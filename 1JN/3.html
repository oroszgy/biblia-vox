t.", "matched_text": "Erről ismerhetők föl Isten gyermekei és a sátán fiai. Aki nem az igazsághoz szabja tetteit, az nem Istentől való. Ugyanígy az sem, aki nem szereti a testvér"}, {"verse_num": 11, "start_sec": 120.53529411764706, "end_sec": 125.75, "confidence": 95.3125, "canonical_text": "Mert ezt az üzenetet halljuk kezdettől fogva: Szeressük egymást!", "matched_text": "Mert ezt az üzenetet halljuk kezdettől fogva, szeressük egymást."}, {"verse_num": 12, "start_sec": 126.37655172413793, "end_sec": 140.56619047619046, "confidence": 95.625, "canonical_text": "Ne tegyünk úgy, mint Káin, aki a gonosztól való volt, és megölte testvérét. Miért ölte meg? Mert az ő tettei gonoszak voltak, a testvére tettei ellenben igazak.", "matched_text": "tegyünk, mint Káin, aki a gonosztól való volt, és megölte a testvérét. És miért ölte meg? Mert az ő tettei gonoszak voltak, a testvére tettei ellenben igazak. N"}, {"verse_num": 13, "start_sec": 139.98, "end_sec": 145.84190476190474, "confidence": 98.48484848484848, "canonical_text": "Ne csodálkozzatok azon, testvérek, hogy a világ gyűlöl benneteket.", "matched_text": "Ne csodálkozzatok azon testvérek, hogy a világ gyűlöl benneteket. M"}, {"verse_num": 14, "start_sec": 145.25571428571428, "end_sec": 156.3663157894737, "confidence": 98.1981981981982, "canonical_text": "Mi tudjuk, hogy a halálból átmentünk az életbe, mert szeretjük testvéreinket. Aki nem szeret, a halálban marad.", "matched_text": "Mi tudjuk, hogy a halálból átmentünk az életbe, mert szeretjük a testvéreinket. Aki nem szeret, a halálban marad"}, {"verse_num": 15, "start_sec": 155.0642105263158, "end_sec": 166.40666666666667, "confidence": 77.35849056603774, "canonical_text": "Aki gyűlöli testvérét, gyilkos, márpedig tudjátok, hogy egy gyilkosnak sem maradandó birtoka az örök élet.", "matched_text": "álban marad. Aki gyűlöli a testvérét, gyilkos. Márpedig tudjátok, hogy egy gyilkosnak sincs örök élete. A s"}, {"verse_num": 16, "start_sec": 164.17894736842106, "end_sec": 175.5, "confidence": 86.8421052631579, "canonical_text": "A szeretetet arról ismerjük fel, hogy ő életét adta értünk. Nekünk is kötelességünk életünket adni testvéreinkért.", "matched_text": ". A szeretetet arról ismerjük föl, hogy életét adta értünk. Nekünk is oda kell adni az életünket a testvéreinkért."}, {"verse_num": 17, "start_sec": 174.93166666666667, "end_sec": 190.2, "confidence": 94.54545454545455, "canonical_text": "Hogyan marad meg az Isten szeretete abban, aki - bár bőven van neki a világ javaiból -, mégis, amikor látja, hogy testvére szükséget szenved, elzárja előle a szívét?", "matched_text": "rt. Hogyan marad meg Isten szeretete abban, aki, bár bőven van neki a világ javaiból, mégis amikor látja, hogy a testvérel szükséget szenved, elzárja előle a szívét."}, {"verse_num": 18, "start_sec": 190.84, "end_sec": 198.10611111111112, "confidence": 79.2207792207792, "canonical_text": "Gyermekeim, ne szeressünk se szóval, se nyelvvel, hanem tettel és igazsággal.", "matched_text": "Gyermekeim, ne szóval és nyelvvel, hanem tettel és igazsággal szeressünk. Ebbő"}, {"verse_num": 19, "start_sec": 197.44555555555556, "end_sec": 208.78916666666666, "confidence": 94.11764705882352, "canonical_text": "Erről ismerjük fel, hogy az igazságból valók vagyunk-e, és így nyugtatjuk meg színe előtt a szívünket.", "matched_text": "l ismerjük föl, hogy az igazságból valók vagyunk-e, és így nyugtatjuk meg az ő színe előtt a szívünket."}, {"verse_num": 20, "start_sec": 208.78916666666666, "end_sec": 217.16, "confidence": 95.1219512195122, "canonical_text": "Ha szívünk vádol minket valamivel, az Isten fölötte áll szívünknek, ő mindent tud.", "matched_text": "a a szívünk vádol minket valamivel, Isten fölötte áll a szívünknek, ő mindent tud."}, {"verse_num": 21, "start_sec": 217.68, "end_sec": 223.78, "confidence": 85.29411764705883, "canonical_text": "Szeretteim, ha szívünk nem vádol, legyünk bizalommal az Isten iránt.", "matched_text": "Szeretteim, ha a szívünk nem vádol, bizalommal lehetünk Isten iránt."}, {"verse_num": 22, "start_sec": 223.78, "end_sec": 233.14176470588237, "confidence": 84.78260869565217, "canonical_text": "Bármit kérünk, megkapjuk tőle, hisz megtartjuk parancsait, és ami tetszik neki, azt tesszük.", "matched_text": "ármit kérünk, megkapjuk tőle, hiszen megtartjuk az ő parancsait, és ami neki tetszik, Azt cse"}, {"verse_num": 23, "start_sec": 233.14176470588237, "end_sec": 243.88, "confidence": 99.04761904761905, "canonical_text": "Az az ő parancsa, hogy higgyünk Fiának, Jézus Krisztusnak nevében, és szeressük egymást parancsa szerint.", "matched_text": "Az az ő parancsa, hogy higgyünk fiának, Jézus Krisztusnak nevében, és szeressük egymást parancsa szerint."}, {"verse_num": 24, "start_sec": 244.33, "end_sec": 262.71, "confidence": 75.51020408163265, "canonical_text": "Aki teljesíti parancsait, benne marad az Istenben, és az Isten is őbenne. Azt, hogy ő bennünk marad-e, a Lélektől tudjuk meg, amelyet nekünk adott.", "matched_text": "Aki teljesíti az ő parancsait, Istenben marad, és Isten is ő benne. Annak, hogy ő bennünk marad-e, a lélek apróba köve, akit nekünk adott. [Silence]"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
