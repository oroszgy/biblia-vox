ei ugyan befejeződtek, mint ahogy egy helyen a hetedik nappal kapcsolatban megállapítja, a hetedik napon Isten megpihent minden munkájától. Itt"}, {"verse_num": 5, "start_sec": 59.31, "end_sec": 64.94869565217391, "confidence": 92.72727272727272, "canonical_text": "Itt mégis így nyilatkozik: \"Nyugalmamba nem mennek be.\"", "matched_text": "Itt mégis így nyilatkozik, nyugalmamba nem mennek be. Az"}, {"verse_num": 6, "start_sec": 64.32217391304349, "end_sec": 78.27923076923076, "confidence": 100.0, "canonical_text": "Azaz még hátra van, hogy némelyek eljussanak, ugyanakkor mások, akik már korábban hallották az evangéliumot, hitetlenségük következtében nem jutottak el oda.", "matched_text": "Azaz még hátra van, hogy némelyek eljussanak, ugyanakkor mások, akik már korábban hallották az evangéliumot, hitetlenségük következtében nem jutottak el oda."}, {"verse_num": 7, "start_sec": 77.53769230769231, "end_sec": 97.51739130434783, "confidence": 93.22033898305084, "canonical_text": "Azért ismét kijelölt egy napot, egy \"má\"-t. Dávid által mondatja annyi idő után, amit már előbb idéztünk: Ma, amikor majd meghalljátok szavát, ne keményítsétek meg a szíveteket.", "matched_text": "Azért ismét kijelölt egy napot, egy mát. Dávid által mondja annyi idő után, amit már előbb idéztünk, ma, amikor majd meghalljátok az ő szavát, megnekeményítsétek a szíveteket. A"}, {"verse_num": 8, "start_sec": 95.6225, "end_sec": 106.62826086956521, "confidence": 87.62886597938144, "canonical_text": "Ha Józsue megszerezte volna nekik nyugalma (országát), nem szólt volna egy másik, későbbi napról.", "matched_text": "t. A Józsue megszerezte volna nekik a nyugalmat, nem szólt volna egy másik, későbbi napról. A szom"}, {"verse_num": 9, "start_sec": 105.41347826086957, "end_sec": 111.88, "confidence": 94.73684210526316, "canonical_text": "A szombati nyugalom tehát még ezután vár az Isten népére.", "matched_text": "A szombati nyugalom tehát még ezután vár Isten népére. Aki"}, {"verse_num": 10, "start_sec": 110.27260869565217, "end_sec": 121.78, "confidence": 97.34513274336283, "canonical_text": "Aki ugyanis belép nyugalma országába, az megpihen minden munkájától, mint ahogy az Isten is megpihent a magáétól.", "matched_text": "Aki ugyanis belép nyugalma országába, az megpihent minden munkájától, mint ahogy Isten is megpihent a magájétól."}, {"verse_num": 11, "start_sec": 121.12, "end_sec": 135.68227272727273, "confidence": 97.16312056737588, "canonical_text": "Törekedjünk tehát rá, hogy bejussunk nyugalmának ebbe az (országába), nehogy valaki éppúgy elessék, mint előbb a hitetlenség példáján láttuk.", "matched_text": "Törekedjünk tehát rá, hogy bejussunk nyugalmának ebbe az országába, nehogy valaki épp úgy elesik, mint előbb a hitetlenség példáján láttuk. I"}, {"verse_num": 12, "start_sec": 135.08, "end_sec": 152.50058823529412, "confidence": 94.01197604790418, "canonical_text": "Az Isten szava ugyanis eleven, átható és minden kétélű kardnál élesebb, behatol a lélek és szellem, az íz és a velő gyökeréig, megítéli a szív gondolatait és érzéseit.", "matched_text": "sten szava ugyanis eleven, átható, és minden kétélő kardinál élesebb. Behatol a lélek és a szellem, az íz és a velő gyökereig. Megítéli a szív gondolatait és érzéseit."}, {"verse_num": 13, "start_sec": 152.50058823529412, "end_sec": 164.52333333333334, "confidence": 93.6, "canonical_text": "Semmilyen teremtett dolog nem marad előtte rejtve; minden föl van fedve és nyitva van az előtt, akinek számadással tartozunk.", "matched_text": "Semmiféle teremtett dolog nem marad előtte rejtve. Minden föl van fedve, és nyitva áll azelőtt, akinek számadással tartozunk."}, {"verse_num": 14, "start_sec": 164.52333333333334, "end_sec": 176.940625, "confidence": 98.33333333333333, "canonical_text": "Mivel tehát olyan kiváló főpapunk van, aki áthatolt az egeken, Jézus, az Isten Fia, legyünk állhatatosak a hitvallásban.", "matched_text": "Mivel tehát olyan kiváló főpapunk van, aki áthatolt az egeken, Jézus, az Isten fia, legyünk álhatatosak a hitvallásban. F"}, {"verse_num": 15, "start_sec": 176.3025, "end_sec": 191.9025, "confidence": 98.22485207100591, "canonical_text": "Főpapunk ugyanis nem olyan, hogy ne tudna együttérezni gyöngeségeinkkel, hanem olyan, aki hozzánk hasonlóan mindenben kísértést szenvedett, a bűntől azonban ment maradt.", "matched_text": "őpapunk ugyanis nem olyan, hogy ne tudna együtt érezni gyöngeségeinkkel, hanem olyan, aki hozzánk hasonlóan mindenben kísértést szenvedett, a bűntől azonban mentes maradt"}, {"verse_num": 16, "start_sec": 191.9025, "end_sec": 203.24, "confidence": 97.5609756097561, "canonical_text": "Járuljunk tehát bizalommal a kegyelem trónjához, hogy irgalmat találjunk és kegyelmet kapjunk, amikor segítségre szorulunk.", "matched_text": "Járuljunk hát bizalommal a kegyelem trónusához, hogy irgalmat találjunk, és kegyelmet kapjunk, amikor segítségre szorulunk."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
