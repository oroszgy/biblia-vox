    <script>
        const chapterData = {"book": {"usx_code": "HEB", "hungarian_name": "Zsidóknak írt levél", "abbreviation": "Zsid", "book_number": 419, "chapter_count": 13}, "chapter": {"book_usx": "HEB", "chapter_num": 10, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/65_zsidok/zsidoknak-irt-level-10-fejezet.mp3", "verse_count": 39, "aligned_count": 39}, "verses": [{"verse_num": 1, "start_sec": 2.38, "end_sec": 19.7, "confidence": 100.0, "canonical_text": "Mivel a törvény a jövendő javak árnyéka, de nem a valóságok képe volt, még azokkal az áldozatokkal sem tehette tökéletessé a résztvevőket, amelyeket évről évre megszakítás nélkül bemutattak.", "matched_text": "Mivel a törvény a jövendő javak árnyéka, de nem a valóságok képe volt, még azokkal az áldozatokkal sem tehette tökéletessé a résztvevőket, amelyeket évről évre megszakítás nélkül bemutattak."}, {"verse_num": 2, "start_sec": 20.41, "end_sec": 31.32, "confidence": 98.4, "canonical_text": "Nemde abbahagyták volna az áldozat bemutatását, ha a bemutatók egyszeri megtisztulás után megszabadultak volna a bűntudattól.", "matched_text": "em de abba hagyták volna az áldozat bemutatását, ha a bemutatók egyszeri megtisztulás után megszabadultak volna a bűntudattól."}, {"verse_num": 3, "start_sec": 31.77, "end_sec": 39.03, "confidence": 100.0, "canonical_text": "Ellenkezőleg, éppen ez emlékeztette őket évről évre a bűnre.", "matched_text": "Ellenkezőleg, éppen ez emlékeztette őket évről évre a bűnre."}, {"verse_num": 4, "start_sec": 40.64, "end_sec": 47.44086956521739, "confidence": 98.50746268656717, "canonical_text": "Lehetetlen ugyanis, hogy a bikák és bakok vére bűnöket töröljön el.", "matched_text": "Lehetetlen ugyanis, hogy a bikák és bakok vére bűnökett töröljön el."}, {"verse_num": 5, "start_sec": 47.44086956521739, "end_sec": 57.39333333333333, "confidence": 98.1651376146789, "canonical_text": "Ezért nyilatkozik így, amikor a világba lép: Áldozatot és felajánlást nem kívántál, de testet alkottál nekem." Isten fiát, semmibe veszi a szövetség vérét, amely megszentelte, és kigúnyolja a kegyelem lelkét. Ism"}, {"verse_num": 30, "start_sec": 285.5005882352941, "end_sec": 300.6957142857143, "confidence": 92.10526315789474, "canonical_text": "Ismerjük jól, azt, aki így szólt: \"Enyém a megtorlás, s én megfizetek.\" Majd ismét: \"Az Úr ítélkezik népe fölött.\"", "matched_text": ". Ismerjük jól azt, aki így szólt, enyém a megtorlás, és én megfizetek. Majd ismét, az Úr ítélkezik népe fölött. Re"}, {"verse_num": 31, "start_sec": 300.01, "end_sec": 306.53, "confidence": 93.02325581395348, "canonical_text": "Rettenetes dolog az élő Isten kezébe jutni.", "matched_text": "Rettenetes dolog az élő Isten kezébe esni. ["}, {"verse_num": 32, "start_sec": 306.53, "end_sec": 316.04, "confidence": 99.13793103448276, "canonical_text": "Emlékezzetek vissza az elmúlt időkre, amikor megvilágosodástok után annyi szenvedésben és küzdelemben helytálltatok.", "matched_text": "Emlékezzetek vissza az elmúlt időkre, amikor megvilágosodástok után annyi szenvedésben és küzdelemben helyt álltatok."}, {"verse_num": 33, "start_sec": 316.44, "end_sec": 327.88, "confidence": 99.21875, "canonical_text": "Részint szidalmazásnak és szorongatásnak voltatok kitéve, részint közösséget vállaltatok azokkal, akik hasonlóképpen szenvedtek.", "matched_text": "Részint szidalmazásnak és szorongatásnak voltatok kivéve, részint közösséget vállaltatok azokkal, akik hasonlóképpen szenvedtek."}, {"verse_num": 34, "start_sec": 328.09, "end_sec": 341.58, "confidence": 98.69281045751634, "canonical_text": "Együtt szenvedtetek a foglyokkal, és vagyonotok elkobzását is örömmel elviselték, abban a tudatban, hogy értékesebb és maradandóbb javakkal rendelkeztek.", "matched_text": "gyütt szenvedtetek a foglyokkal, és vagyonotok elkobzását is örömmel elviseltétek abban a tudatban, hogy értékesebb és maradandóbb javakkal rendelkeztek."}, {"verse_num": 35, "start_sec": 342.01, "end_sec": 348.85285714285715, "confidence": 100.0, "canon         let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
