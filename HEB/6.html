ched_text": ". Hiszen Isten nem igazságtalan. Nem feledkezik meg szeretetetekről, amelyet az ő nevében gyakoroltatok, amikor a szenteknek szolgáltatok és szolgáltok. N"}, {"verse_num": 11, "start_sec": 108.71, "end_sec": 118.0448387096774, "confidence": 99.15966386554622, "canonical_text": "Nagyon szeretnénk azonban, ha mindegyiketek ugyanazt a buzgóságot tanúsítaná, hogy reményetek mindvégig tökéletesedjék.", "matched_text": "Nagyon szeretnénk azonban, ha mindegyiktek ugyanazt a buzgóságot tanúsítaná, hogy reményetek mind végig tökéletesedjék."}, {"verse_num": 12, "start_sec": 117.37806451612903, "end_sec": 129.38, "confidence": 98.1981981981982, "canonical_text": "Ne legyetek tehát hanyagok, hanem kövessétek azokat, akik a hitben és a béketűrésben az ígéret örökösei lettek.", "matched_text": ". Ne legyetek hát hanyagok, hanem kövessétek azokat, akik a hitben és a béketűrésben az ígéret örökösei lettek."}, {"verse_num": 13, "start_sec": 128.71322580645162, "end_sec": 139.785, "confidence": 94.23076923076923, "canonical_text": "Amikor Isten az ígéretet adta Ábrahámnak, saját magára esküdött, hiszen semmi nagyobbra nem esküdhetett,", "matched_text": "ek. Amikor Isten az ígéretet adta Ábrahámnak, önmagára esküdött, hiszen semmi nagyobbra nem esküdhetett,"}, {"verse_num": 14, "start_sec": 139.01999999999998, "end_sec": 145.14, "confidence": 86.36363636363636, "canonical_text": "ezért mondta: Bizony gazdagon megáldalak, és nagyon megsokasítlak.", "matched_text": "etett, ezért mondta, gazdagon megáldalak és nagyon megsokasítalak."}, {"verse_num": 15, "start_sec": 145.41, "end_sec": 151.79222222222222, "confidence": 98.33333333333333, "canonical_text": "Így aztán Ábrahám türelmesen várakozva elnyerte az ígéretet.", "matched_text": "Így aztán Ábraham türelmesen várakozva elnyerte az ígéretet."}, {"verse_num": 16, "start_sec": 150.99444444444444, "end_sec": 162.16333333333333, "confidence": 90.32258064516128, "canonical_text": "Az emberek saját maguknál nagyobbra esküsznek; a pörlekedésnek az eskü bizonyítéka vet véget.", "matched_text": ". Az emberek önmaguknál nagyobbra esküsznek. A perlekedésnek az eskü bizonyítéka vett véget. E"}, {"verse_num": 17, "start_sec": 161.36555555555555, "end_sec": 174.13, "confidence": 99.25373134328358, "canonical_text": "Ezért amikor Isten az ígéret örökösei előtt nagyobb nyomatékkal akarta igazolni elhatározása szilárdságát, esküvel vállalt kezességet.", "matched_text": "zért, amikor Isten az ígéret örökösei előtt nagyobb nyomatékkal akarta igazolni elhatározása szilárdságát, esküvel vállalt kezességet."}, {"verse_num": 18, "start_sec": 173.3322222222222, "end_sec": 189.50181818181818, "confidence": 98.125, "canonical_text": "Így a két változhatatlan dologban, amelyben Isten nem téveszthet meg, erős támaszt kaptunk, mi, akik arra törekszünk, hogy az előttünk levő reményt megragadjuk.", "matched_text": "Így a két változhatatlan dologban, amelyben Isten nem tévezthet meg, erős támaszt kaptunk mi, akik arra törekszünk, hogy az előttünk lévő reményt megragadjuk. L"}, {"verse_num": 19, "start_sec": 188.88, "end_sec": 195.72, "confidence": 100.0, "canonical_text": "Lelkünk biztos és szilárd horgonya ez, amely a függöny mögé ér,", "matched_text": "Lelkünk biztos és szilárd horgonya ez, amely a függöny mögé ér,"}, {"verse_num": 20, "start_sec": 195.0981818181818, "end_sec": 202.56, "confidence": 92.20779220779221, "canonical_text": "ahová elsőnek lépett be értünk Jézus, a Melkizedek rendje szerint való főpap.", "matched_text": "ér, ahová elsőnek lépett be értünk Jézus, a melkizedek rendje szerinti főpap."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
