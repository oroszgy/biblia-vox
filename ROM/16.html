, akik ellentétben a kapott tanítással széthúzást és botrányt okoznak. Kerüljétek őket."}, {"verse_num": 18, "start_sec": 153.50485714285713, "end_sec": 165.57, "confidence": 97.70992366412213, "canonical_text": "Az ilyenek nem Krisztus Urunknak szolgálnak, hanem a hasuknak, és szép szavakkal meg hízelgéssel megtévesztik a gyanútlanok szívét.", "matched_text": "Az ilyenek nem Krisztusurunknak szolgálnak, hanem a hasuknak, és szép szavakkal meg hizelgéssel megtévesztik a gyanútlanok szívét."}, {"verse_num": 19, "start_sec": 166.39, "end_sec": 180.94, "confidence": 97.48427672955975, "canonical_text": "Engedelmességetek híre ugyanis mindenhová eljutott: örömöm is telik bennetek. Mégis szeretném, hogy a jóban járatosak legyetek, a rosszban ellenben járatlanok.", "matched_text": "Engedelmességtek híre ugyanis mindenhová eljutott, Örömem is tellik bennetek. Mégis szeretném, hogy a jóban járatosak legyetek, a rosszban ellenben járatlanok."}, {"verse_num": 20, "start_sec": 180.2125, "end_sec": 193.74347826086955, "confidence": 96.55172413793103, "canonical_text": "A békesség Istene hamarosan összetiporja lábatok alatt a sátánt. A mi Urunk, Jézus Krisztus kegyelme legyen veletek!", "matched_text": "A békesség istene hamarosan összetiporja lábatok alatt a sátánt. Ami Urunk Jézus Krisztus kegyelme legyen veletek. Ü"}, {"verse_num": 21, "start_sec": 193.1, "end_sec": 201.46521739130435, "confidence": 90.69767441860466, "canonical_text": "Üdvözölnek titeket: munkatársam, Timóteus és rokonaim: Lúciusz, Jázon meg Szoszipater.", "matched_text": "Üdvözölnek titeket! A munkatársam Timóteus és a rokonaim Lucius, Jazon meg Sosipater. Ü"}, {"verse_num": 22, "start_sec": 200.8217391304348, "end_sec": 207.9, "confidence": 96.92307692307692, "canonical_text": "Üdvözöllek titeket az Úrban én, Terciusz is, aki a levelet írtam.", "matched_text": "Üdvözöllek titeket az úrban én, Terziusz is, aki a levelet írtam."}, {"verse_num": 23, "start_sec": 208.0, "end_sec": 221.79538461538462, "confidence": 97.24137931034483, "canonical_text": "Üdvözöl titeket Gájusz, aki nekem és az egész közösségnek házigazdája. Üdvözöl titeket Erasztus, aki a város vagyonát kezeli és Quartusz testvér.", "matched_text": "Üdvözöl titeket Gájusz, aki nekem és az egész közösségnek házigazdája. Üdvözöl titeket Erasztusz, aki a város vagyonát kezeli, és Kvartusz testvér"}, {"verse_num": 24, "start_sec": 221.79538461538462, "end_sec": 226.0225, "confidence": 91.89189189189189, "canonical_text": "Az Úr Jézus kegyelme mindnyájatokkal!", "matched_text": "Az úr Jézus kegyelme minnyájatokkal. A"}, {"verse_num": 25, "start_sec": 225.33, "end_sec": 240.565, "confidence": 99.45054945054946, "canonical_text": "Annak pedig, akinek hatalmában áll megerősíteni benneteket evangéliumomban, a Jézus Krisztusról szóló tanításban, annak a titoknak kinyilvánításában, amelyre ősidők óta csend borult,", "matched_text": "Annak pedig, akinek hatalmában áll megerősíteni benneteket evangéliumonban, a Jézus Krisztusról szóló tanításban, annak a titoknak kinyilvánításában, amelyre ősidők óta csend borult,"}, {"verse_num": 26, "start_sec": 239.8725, "end_sec": 256.4925, "confidence": 95.54140127388536, "canonical_text": "de amelyet most az örök Isten parancsára a próféták írásai kinyilatkoztattak, és minden nemzet előtt ismertté tettek, hogy így a hit befogadására eljussanak:", "matched_text": "lt, de melyet most az örök Isten parancsára a proféták írásai kinyilatkoztattak, és minden nemzet előtt ismertétettek, hogy így a hit befogadására jussanak. N"}, {"verse_num": 27, "start_sec": 255.10750000000002, "end_sec": 265.69, "confidence": 91.11111111111111, "canonical_text": "neki, az egyedül bölcs Istennek legyen dicsőség Jézus Krisztus által örökkön-örökké! Amen.", "matched_text": "Neki, az egyedül bölcs Istennek legyen dicsőség, Jézus Krisztus által, örökkön, örökké. [S"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
