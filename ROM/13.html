    <script>
        const chapterData = {"book": {"usx_code": "ROM", "hungarian_name": "Rómabeliekhez írt levél", "abbreviation": "Róm", "book_number": 406, "chapter_count": 16}, "chapter": {"book_usx": "ROM", "chapter_num": 13, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/52_romai/romaiaknak-irt-level-13-fejezet.mp3", "verse_count": 14, "aligned_count": 14}, "verses": [{"verse_num": 1, "start_sec": 1.4133333333333333, "end_sec": 13.136764705882353, "confidence": 95.6140350877193, "canonical_text": "Mindenki vesse alá magát a fölöttes hatalomnak. Mert nincs hatalom, csak az Istentől, ami van, azt Isten rendelte.", "matched_text": ". Mindenki vesse alá magát a fölöttes hatalomnak. Mert nincs hatalom, csak Istentől. Ami van, azt Isten rendelte. E"}, {"verse_num": 2, "start_sec": 12.552500000000002, "end_sec": 21.900735294117652, "confidence": 99.14529914529915, "canonical_text": "Ezért aki a hatósággal szembeszáll, Isten rendelésének szegül ellene. Az ellenszegülő pedig magára vonja az ítéletet.", "matched_text": "Ezért, aki a hatósággal szembeszáll, Isten rendelésének szegül ellene. Az ellenszegülő pedig magára vonja az ítéletet."}, {"verse_num": 3, "start_sec": 21.900735294117652, "end_sec": 39.428676470588236, "confidence": 96.85534591194968, "canonical_text": "A felsőbbség nem arra való, hogy a jótettől ijesszen el, hanem a rossztól. Azt szeretnéd tehát, hogy ne kelljen a hatalomtól tartanod? Tedd a jót és megdicsér:", "matched_text": "felsőbség nem arra való, hogy a jó tett Től iesszen el, hanem a rossz tól. Azt szeretnéd tehát, hogy ne kelljen a hatalomtól tartanod? Tedd a jót, és megdicsér"}, {"verse_num": 4, "start_sec": 38.84441176470588, "end_sec": 54.7516, "confidence": 97.27891156462584, "canonical_text": "Mert az Isten eszköze a javadra. De ha gonoszságot művelsz, rettegj, mert nem hiába viseli a kardot. Isten eszköze, hogy a gonosztevőt megbüntesse.", "matched_text": "mert Isten eszköze a javadra. De ha gonoszságot művelsz, rettegj, mert nem hiába viseli a kardot. Isten eszköze, hogy a gonosz tevőt megbüntesse. A"}, {"verse_num": 5, "start_sec": 54.14, "end_sec": 63.9256, "confidence": 97.89473684210527, "canonical_text": "Alá kell tehát magadat vetned neki, nemcsak a megtorlás miatt, hanem a lelkiismeret szerint is.", "matched_text": "Alá kell tehát magadat vetned neki, Nem csak a megtorlás miatt, hanem a lelkiismeret szerint is."}, {"verse_num": 6, "start_sec": 63.9256, "end_sec": 69.43, "confidence": 96.72131147540983, "canonical_text": "Ezért fizettek adót is, hiszen akik behajtják, Isten szolgái.", "matched_text": "ért fizettek adót is, hiszen akik behajtják, Isten szolgálji."}, {"verse_num": 7, "start_sec": 69.71, "end_sec": 85.69, "confidence": 98.79518072289156, "canonical_text": "Adjátok meg mindenkinek, ami jár neki: akinek adó, annak az adót, akinek vám, annak a vámot, akinek hódolat, annak a hódolatot, akinek tisztelet, annak a tiszteletet.", "matched_text": "Adjátok meg mindenkinek, ami jár neki. Akinek adó, annak az adót, akinek vám, annak a vámot, akinek hódolat, annak a hódolatot, akinek tisztelet, annak a tiszteletet."}, {"verse_num": 8, "start_sec": 86.28, "end_sec": 96.97333333333333, "confidence": 100.0, "canonical_text": "Ne tartozzatok senkinek semmivel, csak kölcsönös szeretettel, mert aki embertársát szereti, a többi törvényt is megtartja.", "matched_text": "Ne tartozzatok senkinek semmivel, csak kölcsönös szeretettel, mert aki embertársát szereti, a többi törvényt is megtartja."}, {"verse_num": 9, "start_sec": 96.97333333333333, "end_sec": 117.02333333333333, "confidence": 97.17514124293785, "canonical_text": "Hiszen a parancs: ne törj házasságot, ne ölj, ne lopj, a másét ne kívánd, s ami egyéb parancs még van, mind ebben az egyben tetőződik: Szeresd embertársadat, mint saját magadat.", "matched_text": "Hiszen a parancs, ne törj házasságot, ne ölj, ne lopj, a másét ne kivánd, és ami egyéb parancs még van, mind ebben az egyben tetőződik, szeresd embertársadat, mint saját magadat."}, {"verse_num": 10, "start_sec": 117.02333333333333, "end_sec": 126.38, "confidence": 100.0, "canonical_text": "A szeretet nem tesz rosszat az embertársnak. A törvény tökéletes teljesítése tehát a szeretet.", "matched_text": "A szeretet nem tesz rosszat az embertársnak. A törvény tökéletes teljesítése tehát a szeretet."}, {"verse_num": 11, "start_sec": 126.92, "end_sec": 140.2276923076923, "confidence": 97.16312056737588, "canonical_text": "Ehhez tartsátok magatokat, felismerve az időt. Itt az óra, hogy fölébredjünk az álomból: üdvösségünk közelebb van, mint amikor hívők lettünk.", "matched_text": "Ehhez tartsátok magatokat, fölismelve az időt. Itt az óra, hogy fölébredjünk az álomból. Üdvösségünk közelebb van, mint amikor hívők lettünk."}, {"verse_num": 12, "start_sec": 140.2276923076923, "end_sec": 152.87, "confidence": 95.6140350877193, "canonical_text": "Múlóban az éjszaka, a nappal pedig közel. Vessük hát le a sötétség tetteit, és öltsük fel a világosság fegyvereit.", "matched_text": "Múlóban az éjszaka, a nappal pedig közel. Bessük le hát a sötétség tetteit, és öltsük föl a világosság fegyvereit."}, {"verse_num": 13, "start_sec": 153.21, "end_sec": 167.9616129032258, "confidence": 93.5251798561151, "canonical_text": "Éljünk tisztességesen, mint nappal, ne evés-ivásban és részegeskedésben, ne kicsapongásban és tobzódásban, ne civakodásban és versengésben.", "matched_text": "jünk tisztességesen, mint nappal. Ne evésben, ivásban és részegeskedésben, ne kicsapongásban és dobzódásban, ne civódásban és versengésben."}, {"verse_num": 14, "start_sec": 167.9616129032258, "end_sec": 180.11, "confidence": 100.0, "canonical_text": "Inkább öltsétek magatokra Urunkat, Jézus Krisztust, és ne dédelgessétek testeteket, nehogy bűnös kívánságokra gerjedjen.", "matched_text": "Inkább öltsétek magatokra Urunkat, Jézus Krisztust, és ne dédelgessétek testeteket, nehogy bűnös kívánságokra gerjedjen."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
