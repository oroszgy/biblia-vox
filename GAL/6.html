    <script>
        const chapterData = {"book": {"usx_code": "GAL", "hungarian_name": "Galatáknak írt levél", "abbreviation": "Gal", "book_number": 409, "chapter_count": 6}, "chapter": {"book_usx": "GAL", "chapter_num": 6, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/55_galata/galataknak-irt-level-06-fejezet.mp3", "verse_count": 18, "aligned_count": 18}, "verses": [{"verse_num": 1, "start_sec": 2.329411764705882, "end_sec": 18.28, "confidence": 97.2027972027972, "canonical_text": "Testvérek, ha valakit botláson értek, ti akik lelkiek vagytok, intsétek meg a szelídség szellemében. De ügyelj, hogy magad kísértésbe ne essél!", "matched_text": "Testvérek, ha valakit botláson értek, ti, akik lelkiek vagytok, incsétek meg a szelítség szellemében. Te ügyelj, hogy magad kísértésbe ne essél."}, {"verse_num": 2, "start_sec": 19.12, "end_sec": 25.026249999999997, "confidence": 95.23809523809523, "canonical_text": "Hordozzátok egymás terhét, így teljesítitek Krisztus törvényét.", "matched_text": "rdozzátok egymásnak terhét, így teljesítitek Krisztus törvényét."}, {"verse_num": 3, "start_sec": 25.026249999999997, "end_sec": 32.62, "confidence": 100.0, "canonical_text": "Aki beképzeli magának, hogy valaki, holott semmi, önmagát áltatja.", "matched_text": "Aki beképzeli magának, hogy valaki, holott semmi, önmagát áltatja."}, {"verse_num": 4, "start_sec": 32.82, "end_sec": 41.915454545454544, "confidence": 98.9795918367347, "canonical_text": "Mindenki a saját tetteit tegye mérlegre, dicsekvését pedig tartsa meg magának, ne tárja mások elé.", "matched_text": "Mindenki a saját tetteit tegye mérlegre, dicsekvését pedig tartsa meg magának, ne tárja mások elé,"}, {"verse_num": 5, "start_sec": 41.915454545454544, "end_sec": 46.16, "confidence": 97.91666666666666, "canonical_text": "Hiszen mindenkinek a maga terhét kell hordoznia.", "matched_text": "hiszen mindenkinek a maga terhét kell hordoznia."}, {"verse_num": 6, "start_sec": 45.55363636363636, "end_sec": 56.83925925925926, "confidence": 82.35294117647058, "canonical_text": "Akit a (keresztény) igazságokra tanítanak, engedjen részt tanítójának minden javából.", "matched_text": "ordoznia. Akit az igazságra tanítanak, engedjen részt tanítójának minden javaiból. Ne"}, {"verse_num": 7, "start_sec": 56.22, "end_sec": 66.12814814814814, "confidence": 97.84946236559139, "canonical_text": "Ne áltassátok magatokat, Isten nem hagy magából gúnyt űzni. Amit az ember vet, azt is aratja.", "matched_text": "Ne áltassátok magatokat. Isten nem hagy magából gúnyt üzni. Amit az ember vet, azt is aratja."}, {"verse_num": 8, "start_sec": 66.74740740740741, "end_sec": 80.5414705882353, "confidence": 96.63865546218487, "canonical_text": "Aki tehát test szerint vet, testéből is arat majd romlást. Aki ellenben a lélek szerint vet, lelkéből arat örök életet.", "matched_text": "tehát test szerint vet, a testéből is arat majd romlást. Aki ellenben a lélek szerint vet, a lelkéből arat örök életet."}, {"verse_num": 9, "start_sec": 80.5414705882353, "end_sec": 90.13970588235294, "confidence": 100.0, "canonical_text": "Ne fáradjunk bele tenni a jót, mert ha kitartunk, annak idején aratni is fogunk.", "matched_text": "Ne fáradjunk bele tenni a jót, mert ha kitartunk, annak idején aratni is fogunk."}, {"verse_num": 10, "start_sec": 90.13970588235294, "end_sec": 96.31, "confidence": 100.0, "canonical_text": "Amíg tehát időnk van, tegyünk jót mindenkivel, főképpen hittestvéreinkkel.", "matched_text": "Amíg tehát időnk van, tegyünk jót mindenkivel, főképpen hittestvéreinkkel."}, {"verse_num": 11, "start_sec": 95.62441176470588, "end_sec": 103.95666666666666, "confidence": 98.21428571428571, "canonical_text": "Nézzétek, mekkora betűkkel írok nektek a saját kezemmel!", "matched_text": "Nézzétek, mekkora betűkkel írok nektek a saját kezemmel."}, {"verse_num": 12, "start_sec": 103.95666666666666, "end_sec": 117.85222222222222, "confidence": 99.29577464788733, "canonical_text": "Akik test szerint akarnak tetszeni, körülmetélkedésre kényszerítenek titeket, csak azért, hogy Krisztus keresztjéért ne szenvedjenek üldözést.", "matched_text": "Akik test szerint akarnak tetszeni, körülmetélkedésre kényszerítenek titeket csak azért, hogy Krisztus keresztjéért ne szenvedjenek üldözést. H"}, {"verse_num": 13, "start_sec": 117.15, "end_sec": 130.4875, "confidence": 99.27536231884058, "canonical_text": "Hiszen maguk a körülmetéltek sem tartják meg a törvényt. Csupán azért kívánják a ti körülmetéléseteket, hogy testetekkel dicsekedhessenek.", "matched_text": "Hiszen maguk a körülmetéltek sem tartják meg a törvényt. Csupán azért kívánják a ti körülmetélésteket, hogy testetekkel dicsekedhessenek. É"}, {"verse_num": 14, "start_sec": 130.4875, "end_sec": 144.69, "confidence": 96.64429530201343, "canonical_text": "Én azonban nem akarok mással dicsekedni, mint Urunk, Jézus Krisztus keresztjével. Általa keresztre szegezték nekem a világot, és engem is a világnak.", "matched_text": "azonban nem akarok mással dicsekedni, mint a mi Urunk Jézus Krisztus keresztjével. Általa keresztre szegezték nekem a világot, és engem is a világnak."}, {"verse_num": 15, "start_sec": 144.94, "end_sec": 153.86, "confidence": 100.0, "canonical_text": "Mert sem a körülmetéltség nem ér semmit, sem a körülmetéletlenség, hanem csak az új teremtmény.", "matched_text": "Mert sem a körülmetéltség nem ér semmit, sem a körülmetéletlenség, hanem csak az új teremtmény."}, {"verse_num": 16, "start_sec": 154.12, "end_sec": 163.56, "confidence": 96.34146341463415, "canonical_text": "Béke és irgalom mindazoknak, akik ezt a szabályt követik, Isten (igaz) Izraelének!", "matched_text": "Béke és irgalom mindazoknak, akik ezt a szabályt követik, és Isten igaz Izraelének."}, {"verse_num": 17, "start_sec": 164.64, "end_sec": 173.32, "confidence": 88.09523809523809, "canonical_text": "Ezután senki ne okozzon kellemetlenséget nekem, mert Jézus jegyeit viselem testemen.", "matched_text": "Ezután senki ne okozzon kellemetlenséget nekem, mert én Jézus stigmáit viselem a test"}, {"verse_num": 18, "start_sec": 173.54, "end_sec": 181.08, "confidence": 94.44444444444444, "canonical_text": "A mi Urunk, Jézus Krisztus kegyelme legyen lelketekkel, testvérek! Amen.", "matched_text": "mi Urunk, Jézus Krisztus kegyelme, legyen a lelketekkel, testvérek. Amen"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
