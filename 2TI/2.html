s Filétusz is,"}, {"verse_num": 18, "start_sec": 163.12714285714287, "end_sec": 176.94, "confidence": 94.65648854961832, "canonical_text": "akik eltévelyedtek az igazságtól, mert azt állítják, hogy a feltámadás már végbement, s ezzel nem kevés embert megzavartak hitében.", "matched_text": "kik eltévejedtek az igazságtól, mert azt állítják, hogy a föltámadás már végbe ment, és ezzel nem kevés embert Megzavartak a hitben."}, {"verse_num": 19, "start_sec": 176.28224489795917, "end_sec": 194.6857627118644, "confidence": 92.10526315789474, "canonical_text": "De azért az Isten alapköve szilárdan áll, s ez van ráírva: \"Az Úr ismeri övéit.\" Továbbá: \"Aki az Úr nevét hívja segítségül, szakítson a bűnös élettel.\"", "matched_text": ". De azért Isten alapköve Szilárdan áll, és ez van ráírva, az Úr ismeri övéit. Továbbá, aki az Úr nevét hívja segítségül, szakítson a bűnös élettel. Egy"}, {"verse_num": 20, "start_sec": 194.01169491525422, "end_sec": 208.1671186440678, "confidence": 97.10144927536231, "canonical_text": "Egy nagy házban nemcsak arany- és ezüsteszközök vannak, hanem fa- és cserépedények is akadnak: azok megtisztelő, ezek alantas használatra.", "matched_text": "Egy nagy házban nem csak arany és ezüst eszközök vannak, hanem fa és cserépedények is akadnak. Azok megtisztelő, ezek alantas használatra."}, {"verse_num": 21, "start_sec": 208.1671186440678, "end_sec": 223.58, "confidence": 98.69281045751634, "canonical_text": "Aki tehát távol tartja magát az ilyen dolgoktól, az megtisztelő rendeltetésű edény lesz, gazdájának megszentelt, hasznos és minden jóra alkalmas eszköze.", "matched_text": "Aki tehát távol tartja magát az ilyen dolgoktól, az megtisztelő rendeltetésű edény lesz. Gazdájának megszentelt, hasznos és minden jóra alkalmas eszköze."}, {"verse_num": 22, "start_sec": 225.0, "end_sec": 239.26938775510203, "confidence": 96.5986394557823, "canonical_text": "Kerüld az ifjúkor vágyait, törekedj igaz életre, hitre, szeretetre és békességre azokkal egyetemben, akik tiszta szívvel hívják az Urat segítségül.", "matched_text": "Kerüld az ifjúkor vágyait. Törekedj igaz életre, hitre. Szeretetre és békességre azokkal egyetemben, akik tiszta szívvel hívják az urat segítségül."}, {"verse_num": 23, "start_sec": 239.26938775510203, "end_sec": 249.25795918367345, "confidence": 97.77777777777777, "canonical_text": "Az oktalan és értelmetlen viták elől térj ki, hisz tudod, hogy csak veszekedéssé fajulnak.", "matched_text": "Az oktalan és értelmetlen viták elől térj ki, hiszen tudod, hogy csak veszekedésé fajulnak."}, {"verse_num": 24, "start_sec": 249.25795918367345, "end_sec": 259.96, "confidence": 97.24770642201834, "canonical_text": "Márpedig az Úr szolgája ne veszekedjék, inkább legyen mindenkihez barátságos, a tanításban ügyes és türelmes.", "matched_text": "rpedig az úr szolgálja, ne veszekedjék, inkább legyen mindenkihez barátságos, a tanításban ügyes és türelmes."}, {"verse_num": 25, "start_sec": 260.82, "end_sec": 269.9459259259259, "confidence": 93.61702127659575, "canonical_text": "Ellenfeleit szelíden intse, hátha megadja nekik az Isten a megtérést, felismerik az igazságot,", "matched_text": "Ellenfeleit szeliden intse. Hát, ha megadja nekik Isten a megtérést, felismerik az igazságot, é"}, {"verse_num": 26, "start_sec": 269.2940740740741, "end_sec": 278.42, "confidence": 92.63157894736842, "canonical_text": "és kikerülnek a sátán kelepcéjéből, aki foglyul tartja őket, hogy alávessék magukat akaratának.", "matched_text": "s kikerülnek a sátán kelepcéjéből, aki fogságban tartja őket, hogy alá vessék magukat akaratának"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
