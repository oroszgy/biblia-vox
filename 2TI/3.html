, "canonical_text": "Mert közülük valók azok, akik betolakodnak a házakba, és megnyernek maguknak olyan nőket, akiket bűnök terhelnek s mindenféle vágyak hajtanak,", "matched_text": "Mert közülük valók azok, akik betolakodnak a házakba, és megnyernek maguknak olyan nőket, akiket bűnök terhelnek, és mindenféle vágyak hajtanak"}, {"verse_num": 7, "start_sec": 65.43, "end_sec": 73.98789473684211, "confidence": 94.5945945945946, "canonical_text": "akik mindig csak tanulnak, de az igazság megismerésére soha el nem jutnak.", "matched_text": "Akik mindig csak tanulnak, de az igazság megismerésére soha nem jutnak el."}, {"verse_num": 8, "start_sec": 73.98789473684211, "end_sec": 89.14562500000001, "confidence": 94.81481481481482, "canonical_text": "Mint ahogy Jannesz és Jambresz ellenszegültek Mózesnek, úgy ezek is szembeszállnak az igazsággal - romlott agyú, ingadozó hitű emberek.", "matched_text": "Mint ahogy Jannes és Jambres ellenszegültek Mózesnek. Úgy ezek is szembeszállnak az igazsággal. Romlott agyú, ingadozó hitű emberek. De"}, {"verse_num": 9, "start_sec": 88.43, "end_sec": 99.88, "confidence": 100.0, "canonical_text": "De sokra nem viszik, mert ostobaságuk mindenki előtt nyilvánvalóvá válik, mint ahogy azoké is nyilvánvalóvá vált.", "matched_text": "De sokra nem viszik, mert ostobaságuk mindenki előtt nyilvánvalóvá válik, mint ahogy azoké is nyilvánvalóvá vált."}, {"verse_num": 10, "start_sec": 101.91, "end_sec": 113.77, "confidence": 100.0, "canonical_text": "Te követtél a tanításban, életmódom és életcélom tekintetében, a hitben, a kitartásban, a szeretetben, a türelemben,", "matched_text": "Te követtél a tanításban, életmódom és életcélom tekintetében, a hitben, a kitartásban, a szeretetben, a türelemben,"}, {"verse_num": 11, "start_sec": 113.8, "end_sec": 131.49, "confidence": 93.67088607594937, "canonical_text": "az üldöztetésekben és a szenvedésekben, amik Antióchiában, Ikoniumban és Lisztrában értek. Mi minden üldöztetést magamra vállaltam! De az Úr mindig kimentett.", "matched_text": "z üldöztetésekben és a szenvedésekben, amelyek antióhiában, ikóniumban és lisztrában értek. Mi minden üldöztetést magamra vállaltam, de az Úr mindig kimentett."}, {"verse_num": 12, "start_sec": 131.72, "end_sec": 139.81, "confidence": 100.0, "canonical_text": "S az üldözésből mindenkinek kijut, aki buzgón akar élni Krisztus Jézusban.", "matched_text": "S az üldözésből mindenkinek kijut, aki buzgón akar élni Krisztus Jézusban."}, {"verse_num": 13, "start_sec": 140.84, "end_sec": 150.28, "confidence": 96.73913043478261, "canonical_text": "A gonoszok és csalók viszont egyre mélyebbre süllyednek: tévúton járnak és tévútra vezetnek.", "matched_text": "A gonoszok és csalók viszont egyre mélyebbre süllyednek, tévuton járnak és tévutra vezetnek."}, {"verse_num": 14, "start_sec": 151.13, "end_sec": 159.88, "confidence": 100.0, "canonical_text": "Te azonban tarts ki amellett, amit tanultál, s amiről meggyőződtél, hiszen tudod, kitől tanultad.", "matched_text": "Te azonban tarts ki amellett, amit tanultál, s amiről meggyőződtél, hiszen tudod, kitől tanultad."}, {"verse_num": 15, "start_sec": 160.91, "end_sec": 172.91, "confidence": 97.03703703703704, "canonical_text": "Gyerekkorod óta ismered a Szentírást: ez megadja neked az útmutatást ahhoz, hogy a Krisztus Jézusba vetett hitben eljuss az üdvösségre.", "matched_text": "Gyermekkorodóda ismered a Szentírást. Ez megadja neked az útmutatást ahhoz, hogy a Krisztus Jézusba vetett hitben eljuss az üdvösségre."}, {"verse_num": 16, "start_sec": 172.2784210526316, "end_sec": 186.09799999999998, "confidence": 96.06299212598425, "canonical_text": "Minden Írás, amit az Isten sugalmazott, jól használható a tanításra, az érvelésre, a feddésre, s az igaz életre való nevelésre,", "matched_text": ". Minden írás, amit Isten sugalmazott, jól használható a tanításra, az érvelésre, a feddésre és az igaz életre való nevelésre, h"}, {"verse_num": 17, "start_sec": 184.6578947368421, "end_sec": 193.54, "confidence": 95.38461538461537, "canonical_text": "hogy az Isten embere tökéletes legyen és minden jóra kész legyen.", "matched_text": "hogy Isten embere tökéletes legyen és minden jóra kész legyen. [S"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
