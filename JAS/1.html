    <script>
        const chapterData = {"book": {"usx_code": "JAS", "hungarian_name": "Jakab levele", "abbreviation": "Jak", "book_number": 420, "chapter_count": 5}, "chapter": {"book_usx": "JAS", "chapter_num": 1, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/66_jakab/szent-jakab-level-01-fejezet.mp3", "verse_count": 27, "aligned_count": 27}, "verses": [{"verse_num": 1, "start_sec": 5.613333333333333, "end_sec": 16.84, "confidence": 97.32142857142857, "canonical_text": "Jakab, Istennek és Urunknak, Jézus Krisztusnak szolgája üdvözletet (küld) a szórványokban élő tizenkét törzsnek.", "matched_text": "Jakab, Istennek és Urunknak, Jézus Krisztusnak szolgálja, üdvözletet küld a szorványokban élő tizenkét törzsnek."}, {"verse_num": 2, "start_sec": 17.86, "end_sec": 25.264545454545452, "confidence": 100.0, "canonical_text": "Testvéreim, tartsátok nagy örömnek, ha különféle megpróbáltatások érnek benneteket.", "matched_text": "Testvéreim, tartsátok nagy örömnek, ha különféle megpróbáltatások érnek benneteket."}, {"verse_num": 3, "start_sec": 24.44181818181818, "end_sec": 30.20090909090909, "confidence": 95.0, "canonical_text": "Tudjátok, hogy hitetek próbájának állhatatosság a gyümölcse.", "matched_text": "Tudjátok, hogy hitetek próbájának, Álhatatossága gyümölcse."}, {"verse_num": 4, "start_sec": 30.20090909090909, "end_sec": 45.74446153846154, "confidence": 97.95918367346938, "canonical_text": "Az állhatatosságnak meg tökéletességre kell vezetnie, hogy tökéletesek és feddhetetlenek legyetek, és semmilyen tekintetben ne essetek kifogás alá.", "matched_text": "Az álhatatosságnak meg tökéletességre kell vezetnie, hogy tökéletesek és fethetetlenek legyetek, és semmilyen tekintetben ne essetek kifogás alá. Ha"}, {"verse_num": 5, "start_sec": 45.17, "end_sec": 55.51030769230769, "confidence": 99.2, "canonical_text": "Ha valaki közületek bölcsességben szenved hiányt, kérje Istentől, aki szívesen ad mindenkinek, anélkül, hogy a szemére vetné,", "matched_text": "Ha valaki ti a növényt, virága lehull, szépsége elenyészik. Így lesz semmivé a gazdag is vallalkozásaival."}, {"verse_num": 12, "start_sec": 109.74405405405406, "end_sec": 126.328125, "confidence": 96.73202614379085, "canonical_text": "Boldog az az ember, aki a kísértésben helytáll, mert miután kiállja a próbát, megkapja az élet koszorúját, amelyet az Úr azoknak ígért, akik őt szeretik.", "matched_text": "Boldog az az ember, aki a kísértésben helyt áll, mert miután kiállja a próbát, Megkapja az élet koszorúját, amelyet az Úr azoknak ígért, akik szeretik őt"}, {"verse_num": 13, "start_sec": 125.7228125, "end_sec": 139.0396875, "confidence": 89.55223880597015, "canonical_text": "Senki se mondja, aki kísértést szenved: \"Az Isten kísért\", mert az Istent nem lehet rosszra csábítani, és ő sem csábít rosszra senkit.", "matched_text": ". Senki ne mondja, amikor kísértést szenved, az Isten kísért, mert Istent nem lehet rosszra csábítani, és ő sem csábít rosszra. Minden"}, {"verse_num": 14, "start_sec": 138.43437500000002, "end_sec": 145.0928125, "confidence": 91.04477611940298, "canonical_text": "Minden embert a saját kívánsága vonzza és csábítja, így esik tőrbe.", "matched_text": "Minden embert a saját kívánsága vonza és csábítja, így esik kísértés"}, {"verse_num": 15, "start_sec": 145.0928125, "end_sec": 153.4911111111111, "confidence": 79.76190476190477, "canonical_text": "Aztán a kívánság, ha már megfogant, bűnt szül, a bűn meg, ha elkövetik, halált szül.", "matched_text": "Aztán a kívánság, ha megfogant, Bűnt szül. A bűn pedig, ha elhatalmasodik, halált von"}, {"verse_num": 16, "start_sec": 154.72, "end_sec": 159.48, "confidence": 97.95918367346938, "canonical_text": "Ne legyetek hát tévedésben, szeretett testvéreim.", "matched_text": "Ne legyetek hát tévedésben szeretett testvéreim. M"}, {"verse_num": 17, "start_sec": 158.12, "end_sec": 174.06266666666667, "confidence": 88.35616438356165, "canonical_text": "Minden jó adomány és minden tökéletes ajándék felülről van, a világosság Atyjától száll alá, akiben nincs változás, még árnyéka sem a változásnak.", "matched_text": "im. Minden jó adomány és minden ajándék fölülről való a világosság atyától száll alá, akiben nincsen változás, még árnyéka sincs a változásnak. Sza"}, {"verse_num": 18, "start_sec": 174.06266666666667, "end_sec": 183.9, "confidence": 85.71428571428572, "canonical_text": "Akarattal hívott minket életre az igazság szavával, hogy mintegy zsengéje legyünk teremtményeinek.", "matched_text": "ból hívott minket életre, Az igazság szavával, hogy mint egy első termése legyünk terentményeinek."}, {"verse_num": 19, "start_sec": 185.5, "end_sec": 196.51357142857142, "confidence": 92.62295081967213, "canonical_text": "Értsétek meg, kedves testvéreim: Legyen minden ember készen a hallgatásra, de késedelmes a szólásra, késedelmes a haragra.", "matched_text": "Értsétek meg, szeretett testvéreim, legyen minden ember kész a hallgatásra, de késedelmes a szólásra, késedelmes a haragra,"}, {"verse_num": 20, "start_sec": 195.8657142857143, "end_sec": 205.29, "confidence": 94.20289855072464, "canonical_text": "Mert haragjában az ember nem azt teszi, ami az Isten előtt igazságos.", "matched_text": "mert haragjában az ember nem azt teszi, ami Isten előtt igazságos. Ez"}, {"verse_num": 21, "start_sec": 204.62, "end_sec": 218.02, "confidence": 92.5, "canonical_text": "Ezért hagyjatok fel minden tisztátalansággal és burjánzó gonoszsággal, fogadjátok tanulékony lélekkel a belétek oltott tanítást, ez képes megmenteni lelketeket.", "matched_text": "Ezért hagyjatok föl minden tisztátalansággal és gonoszsággal. Fogadjátok tanulékony lélekkel a belétek oltott tanítást, ez képes megmenteni lelketeket. A tanítás"}, {"verse_num": 22, "start_sec": 216.01, "end_sec": 225.39, "confidence": 92.3076923076923, "canonical_text": "A tanítást váltsátok tettekre, ne csak hallgassátok, mert különben magatokat csaljátok meg.", "matched_text": "A tanítást váltsátok tettekre, ne csak hallgassátok, különben magatokat sajjátok meg. Ha ug"}, {"verse_num": 23, "start_sec": 223.38, "end_sec": 237.45, "confidence": 97.82608695652173, "canonical_text": "Ha ugyanis valaki csak hallgatja a tanítást, de nem követi, hasonlít ahhoz az emberhez, aki a természettől kapott arcát tükörben nézegeti.", "matched_text": ". Ha ugyanis valaki csak hallgatja a tanítást, de nem követi, hasonlít ahhoz az emberhez, Aki természettől kapott arcát tükörben nézegeti."}, {"verse_num": 24, "start_sec": 237.45, "end_sec": 244.82, "confidence": 98.55072463768117, "canonical_text": "Megnézi magát, aztán odébb megy, s nyomban elfelejti, milyen is volt.", "matched_text": "egnézi magát, aztán odébb megy, és nyomban elfelejti, milyen is volt."}, {"verse_num": 25, "start_sec": 244.14999999999998, "end_sec": 262.90615384615387, "confidence": 91.16022099447514, "canonical_text": "Aki ellenben figyelmesen tanulmányozza a szabadság tökéletes törvényét, és ki is tart mellette, aki nem feledékeny hallgatója, hanem tettekre váltója, az teljesítésében boldog lesz.", "matched_text": "olt. Aki ellenben figyelmesen tanulmányozza a szabadság tökéletes törvényét, és ki is tart mellette, aki nem feledékeny hallgatója, hanem tettekre váltója, az a maga útján boldogságo"}, {"verse_num": 26, "start_sec": 264.71, "end_sec": 276.1685365853658, "confidence": 94.78260869565217, "canonical_text": "Ha valaki vallásosnak tartja magát, nyelvét azonban nem fékezi, hanem áltatja magát, annak vallásossága mit sem ér.", "matched_text": "valaki vallásosnak tartja magát, a nyelvét azonban nem fékezi, hanem altatja magát, annak vallásossága semmit sem é"}, {"verse_num": 27, "start_sec": 275.53195121951217, "end_sec": 290.81, "confidence": 96.1038961038961, "canonical_text": "Az Isten és az Atya szemében ez az igazi, tiszta vallásosság: meglátogatni nyomorukban az árvákat és az özvegyeket, és tisztán maradni a világ szennyétől.", "matched_text": "Isten és az atya szemében ez az igazi, tiszta vallásosság, meglátogatni nyomorúságukban az árvákat és az özvegyeket, és tisztán maradni a világ szennyétől"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
