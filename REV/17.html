y ezeken ül. De jelenti a hét királyt is.", "matched_text": "esz. Akiben van bölcsesség, annak a jelentése ez. A hét fej, hét hegy, melyeken az asszony ül. De hét királyt is jelent"}, {"verse_num": 10, "start_sec": 144.985, "end_sec": 157.01807692307693, "confidence": 66.38655462184873, "canonical_text": "Öt közülük már a múlté, egy most uralkodik, az utolsó még nem jött el, de amikor eljön, rövid ideig lesz csak maradása.", "matched_text": "entenek, öt már elbukott, egy most van, a hetedik még nem jött el. És amikor eljön, csak rövid ideig fog maradni. És a v"}, {"verse_num": 11, "start_sec": 156.03115384615384, "end_sec": 166.19333333333333, "confidence": 72.16494845360825, "canonical_text": "A vadállat, amely volt, de többé nincs, lesz a nyolcadik, a hét közül való, de vesztébe is rohan.", "matched_text": "a vadállat, amely volt és most nincs, ű a nyolcadik, és a hét fej közül is való, és a pusztulásba"}, {"verse_num": 12, "start_sec": 167.3288888888889, "end_sec": 180.41368421052633, "confidence": 65.35433070866141, "canonical_text": "A tíz szarv, amelyet láttál, tíz királyt jelent. Még nem jutottak uralomra, de a vadállattal királyi hatalmat kaptak egy órára.", "matched_text": "a tíz szarv, amelyeket láttál, tíz király, akik uralmukat még nem kapták meg, de királyként egy órára hatalmat kapnak a vadállat"}, {"verse_num": 13, "start_sec": 181.11789473684212, "end_sec": 189.14636363636365, "confidence": 65.33333333333333, "canonical_text": "Egyetértenek a vadállattal, erejüket és hatalmukat átengedik a vadállatnak.", "matched_text": "Ezek tanácsot tartanak, és átadják erejüket és hatalmokat a vadállatnak. Har"}, {"verse_num": 14, "start_sec": 190.2190909090909, "end_sec": 205.62263157894736, "confidence": 72.72727272727273, "canonical_text": "Harcot indítanak a Bárány ellen, de a Bárány legyőzi őket, mert ő az Urak Ura és a Királyok Királya. A vele meghívottak, a kiválasztottak és a hűségesek.\"", "matched_text": "árányjal, és a bárány legyőzi őket, mivel ű az uralkodók ura, és a királyok királya, és akik vele vannak, azok a meghívottak, a választottak és a hűségesek"}, {"verse_num": 15, "start_sec": 206.25421052631577, "end_sec": 219.7037037037037, "confidence": 58.82352941176471, "canonical_text": "Azután folytatta: \"A vizek, amelyeken - mint láttad - a kéjnő ült, a népeket, fajokat, nemzeteket és nyelveket jelenti.", "matched_text": "ta nekem, a vizek, amely fölött az asszonyt ülni láttad, a népek, a fajok, a nemzetek és a nyelvek. És a tíz szarv, mely"}, {"verse_num": 16, "start_sec": 217.67407407407407, "end_sec": 228.06130434782608, "confidence": 56.390977443609025, "canonical_text": "A tíz szarv, amelyet láttál, meg a vadállat, meggyűlölik a kéjnőt, kifosztják és levetkőztetik, a húsán rágódnak, és tűzön megégetik.", "matched_text": "a tíz szarv, melyeket láttál, és a vadállat, gyülölni fogják ezt a parázna asszonyt, és magányossá teszik. Megfosztják ruháitól, fölfa"}, {"verse_num": 17, "start_sec": 234.90652173913043, "end_sec": 249.73916666666668, "confidence": 57.71812080536913, "canonical_text": "Mert Isten sugalmazta nekik, hogy a tervét végrehajtsák, és uralmukat ruházzák egyetértőn a vadállatra, amíg be nem teljesednek az Istennek a szavai.", "matched_text": "egtegyék azt, ami neki tetszik, és egyezzenek meg. És adják át uralmukat a vadállatnak addig, amíg be nem teljesednek Isten igéjé. És az asszony, akit"}, {"verse_num": 18, "start_sec": 247.95166666666668, "end_sec": 255.8475, "confidence": 75.0, "canonical_text": "Az asszony, akit láttál, az a nagy város, amely a föld királyain uralkodik.\"", "matched_text": "z asszony, akit láttál, am a nagyváros, amelynek birodalma van, a föld király"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
