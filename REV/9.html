    <script>
        const chapterData = {"book": {"usx_code": "REV", "hungarian_name": "János jelenései", "abbreviation": "Jel", "book_number": 427, "chapter_count": 22}, "chapter": {"book_usx": "REV", "chapter_num": 9, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/73_jelenesek/jelenesek-konyve-09-fejezet.mp3", "verse_count": 21, "aligned_count": 21}, "verses": [{"verse_num": 1, "start_sec": 1.22, "end_sec": 16.382916666666667, "confidence": 80.88235294117648, "canonical_text": "Az ötödik angyal is megfújta a harsonát. Erre egy csillagot láttam, amint az égből a földre zuhant. Nála volt a mélység kútjának kulcsa.", "matched_text": "Az ötödik angyal is megfújta a harsonát, és leadtam egy csillagot, amint az égből a földre zuhant, és neki adatott a mélység kutyának a"}, {"verse_num": 2, "start_sec": 16.382916666666667, "end_sec": 30.1325, "confidence": 72.65625, "canonical_text": "Megnyitotta az alvilágot, a kútból füst szállt fel, amilyen a nagy kohó füstje. A nap és az égbolt elsötétedett a kút füstjétől.", "matched_text": "és megnyitotta az alvilág kutyát, és a kutyból füst szállt föl, amilyen a nagy kemence füstje, és elsötétedett a nap, és a leveg"}, {"verse_num": 3, "start_sec": 32.25964285714286, "end_sec": 40.76821428571428, "confidence": 72.52747252747253, "canonical_text": "A füstből sáskák lepték el a földet, és akkora erejük volt, amilyen a föld skorpióinak van.", "matched_text": "füstből sáskák jöttek a földre, és olyan erő adatott nekik, mint amilyen a föld skorpióinak"}, {"verse_num": 4, "start_sec": 42.202799999999996, "end_sec": 56.25272727272727, "confidence": 81.29032258064515, "canonical_text": "Parancsot kaptak, hogy ne ártsanak a föld füvének, a zöldellő növénynek és fának, hanem csak az embereknek, akik nem hordják homlokukon az Isten pecsétjét.", "matched_text": "atott nekik, hogy ne árcsanak a föld füvének, a zöldelő növénynek és a fáknak, hanem csak az embereknek, akiknek nincs a homlokán Isten pecsétje. És megadat"}, {"verse_num": 5, " n olyan erő volt, hogy öt hónapig árthattak az embereknek.", "matched_text": "kuk és fullánkjuk, mint a skorpiójé. És a farkukban olyan erő volt, hogy öt hónapig árthattak az emberekne"}, {"verse_num": 11, "start_sec": 120.7064, "end_sec": 133.78833333333333, "confidence": 84.26966292134833, "canonical_text": "A mélység angyala volt a királyuk, akinek héberül Abaddón, görögül pedig Apollión a neve.", "matched_text": ". A mélység angyala a királyuk, akinek neve Héberül Abaddon, Görögül pedig Apollion. Az el"}, {"verse_num": 12, "start_sec": 130.68083333333334, "end_sec": 139.53, "confidence": 75.0, "canonical_text": "Az első jaj elmúlt, de lám, két másik jaj közeledik!", "matched_text": "Az első jaj elmúlt, és íme még két másik jaj jön utá"}, {"verse_num": 13, "start_sec": 139.53, "end_sec": 153.04899999999998, "confidence": 94.69026548672566, "canonical_text": "A hatodik angyal is megfújta a harsonát. Erre szózatot hallottam az Isten előtt álló aranyoltár négy sarka közül.", "matched_text": "A hatodik angyal is megfújta a harsonát. És szózatot hallottam az Isten előtt álló aranyoltár négy szarva közül a"}, {"verse_num": 14, "start_sec": 154.22099999999998, "end_sec": 164.69, "confidence": 84.34782608695653, "canonical_text": "Így szólt a hatodik harsonás angyalhoz: \"Oldozd fel a négy angyalt, aki a nagy Eufrátesz folyónál meg van kötözve!\"", "matched_text": "gy szólt a hatodik harsonás angyalhoz, oldozt fel a négy angyalt, akik a nagy eufratesz folyó fölött vannak megkötöz"}, {"verse_num": 15, "start_sec": 166.84368421052633, "end_sec": 181.8378947368421, "confidence": 77.23577235772358, "canonical_text": "A négy angyal megszabadult kötelékeitől, és készen állt órára, napra, hónapra és évre, hogy megölje az emberek egyharmadát.", "matched_text": "ldották a négy angyalt, akik készen álltak órára, napra, hónapra és évre, hogy megöljék az emberek egy harmadát. És a lovas"}, {"verse_num": 16, "start_sec": 179.67, "end_sec": 188.34157894736842, "confidence": 82.85714285714285, "canonical_text": "A lovas sereg száma húszezerszer tízezerre rúgott: hallottam a számát.", "matched_text": "a lovas sereg száma húszezerszer tízezer. Hallottam a számát. A látomá"}, {"verse_num": 17, "start_sec": 186.89631578947368, "end_sec": 209.555, "confidence": 96.3917525773196, "canonical_text": "A látomásban ilyennek láttam a lovakat és a lovasokat: tűzvörös, kék és kénsárga (páncél) borította őket, a lovak feje olyan volt, mint az oroszláné, s a szájukból tűz, füst és kénkő csapott ki.", "matched_text": "A látomásban ilyennek láttam a lovakat és a lovasokat. Tűzvörös, kék és kén sárga páncél borította őket. A lovak feje olyan volt, mint az oroszláné. És a szájukból tűz, füst és kénkő csapott ki."}, {"verse_num": 18, "start_sec": 209.555, "end_sec": 219.28962962962962, "confidence": 92.3913043478261, "canonical_text": "Ez a három csapás - a szájukból kicsapó tűz, füst és kénkő - megölte az emberek egyharmadát.", "matched_text": "z a három csapás. A szájukból kicsapott tűz, füst és kénkő, megölte az emberek egy harmadát."}, {"verse_num": 19, "start_sec": 219.28962962962962, "end_sec": 231.52, "confidence": 98.38709677419355, "canonical_text": "A lovak ereje a szájukban és a farkukban rejlett: a farkuk ugyanis olyan volt, mint a kígyó, feje volt, amivel marni tudtak.", "matched_text": "A lovak ereje a szájukban és a farkukban rejlett. A farkuk ugyanis olyan volt, mint a kígyó, feje volt, amivel marni tudtak."}, {"verse_num": 20, "start_sec": 232.3190476190476, "end_sec": 254.24, "confidence": 82.91666666666666, "canonical_text": "A többi ember, aki nem halt meg a csapások alatt, mégsem tért meg gonosz tetteiből, hanem továbbra is imádta a démonokat és az aranyból, ezüstből, bronzból, kőből és fából készült bálványokat, amelyek nem látnak, nem hallanak és nem járnak,", "matched_text": "a többi ember, aki nem halt meg a csapások alatt, mégsem tartott bűnbánatot tettei miatt, hogy ne imádják a démonokat. És az aranyból, ezüstből, bronzból, kőből és fából készült bálványokat, amelyek sem látni, sem hallani, sem járni nem képe"}, {"verse_num": 21, "start_sec": 254.85000000000002, "end_sec": 263.64, "confidence": 63.829787234042556, "canonical_text": "nem tértek meg sem a gyilkosságból, sem a varázslatból, sem paráznaságukból, sem a lopásokból.", "matched_text": "nem tartottak bűnbánatot, a gyilkosságaik, a varázslataik, a paráznaságaik és a lopásaik miatt."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
