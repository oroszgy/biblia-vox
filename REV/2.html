deted van, mint azelőtt.", "matched_text": "Tudok tetteidről, szeretetedről, Hitedről, szolgálataidról és álhatatosságodról, arról, hogy most több cselekedeted van, mint az előtt."}, {"verse_num": 20, "start_sec": 255.20727272727274, "end_sec": 275.51, "confidence": 96.65071770334929, "canonical_text": "De van ellened egy kifogásom: eltűröd, hogy Jezabel asszony, aki prófétának mondja magát, tanításával arra csábítsa szolgáimat, hogy erkölcstelenkedjenek és egyenek a bálványoknak bemutatott áldozatok húsából.", "matched_text": "De van ellened egy kifogásom. Eltűröd, hogy Jezebel asszony, aki profétának mondja magát, tanításával arra csábítsa szolgáimat, hogy erkölcstelenkedjenek, és egyenek a bálványoknak bemutatott áldozatokusából."}, {"verse_num": 21, "start_sec": 276.41, "end_sec": 282.6982352941177, "confidence": 100.0, "canonical_text": "Adtam neki időt, hogy megtérjen, de nem akar megtérni paráznaságából.", "matched_text": "Adtam neki időt, hogy megtérjen, de nem akar megtérni paráznaságából."}, {"verse_num": 22, "start_sec": 282.6982352941177, "end_sec": 292.7594117647059, "confidence": 99.1304347826087, "canonical_text": "Ágynak döntöm, akik meg házasságot törnek vele, azokat nagy nyomorúságokba, hacsak meg nem térnek cselekedeteikből.", "matched_text": "gynak döntöm, akik meg házasságot törnek vele, azokat nagy nyomorúságokba, ha csak meg nem térnek cselekedeteikből."}, {"verse_num": 23, "start_sec": 292.7594117647059, "end_sec": 308.48, "confidence": 98.19277108433735, "canonical_text": "Gyermekeit halálra adom, hadd tudja meg minden egyház, hogy én vagyok, aki a veséket és a szíveket vizsgálja, és megfizetek mindenkinek, kinek-kinek a tettei szerint.", "matched_text": "yermekeiket halálra adom, hadd tudja meg minden egyház, hogy én vagyok, aki a veséket és a szíveket vizsgálja, és megfizetek mindenkinek, Kinek-kinek a tettei szerint."}, {"verse_num": 24, "start_sec": 307.2223529411765, "end_sec": 326.1709090909091, "confidence": 85.02994011976048, "canonical_text": "Nektek meg, többi tiatiraiak, akik nem követitek ezt a tanítást, és akik - hogy úgy mondjam - nem ismeritek a sátán mélységeit, ezt üzenem: Nem rakok rátok más terhet.", "matched_text": "tettei szerint. Nektek meg, többi ti a tiraia, akik nem követitek ezt a tanítást, és akik nem ismeritek a sátán mélységeit, ezt üzenem, nem rakok rátok más terhet, de a"}, {"verse_num": 25, "start_sec": 324.9072727272727, "end_sec": 330.23636363636365, "confidence": 98.0, "canonical_text": "De amitek van, ahhoz ragaszkodjatok, amíg eljövök.", "matched_text": "e amitek van, ahhoz ragaszkodjatok, amíg eljövök. A"}, {"verse_num": 26, "start_sec": 329.41, "end_sec": 338.5, "confidence": 98.68421052631578, "canonical_text": "A győztesnek, aki mindvégig kitart tetteimben, hatalmat adok a népek fölött.", "matched_text": "A győztesnek, aki mindvégig kitart tetteimben, Hatalmat adok a népek fölött."}, {"verse_num": 27, "start_sec": 337.6736363636364, "end_sec": 345.82, "confidence": 98.59154929577466, "canonical_text": "Vaspálcával fogja kormányozni, és mint cserépedényeket, összetöri őket.", "matched_text": "Vaspálcával fogja kormányozni, és mint cserépedényeket összetöri őket."}, {"verse_num": 28, "start_sec": 345.82, "end_sec": 353.74, "confidence": 93.65079365079364, "canonical_text": "Ezt a hatalmat Atyámtól kaptam. És neki adom a hajnalcsillagot.", "matched_text": "Ezt a hatalmat atyámtól kaptam, és neki adom a hajnal csillagot."}, {"verse_num": 29, "start_sec": 127.82677419354839, "end_sec": 134.9958064516129, "confidence": 96.7741935483871, "canonical_text": "Akinek van füle, hallja meg, mit mond a Lélek az egyházaknak.\"", "matched_text": "Akinek van füle, hallja meg, mit mond a lélek az egyházaknak."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
