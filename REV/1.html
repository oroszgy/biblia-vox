n, és aki volt, és aki eljő, és a hét lélektől, akik trónja előtt állna"}, {"verse_num": 5, "start_sec": 63.065217391304344, "end_sec": 73.66, "confidence": 88.3495145631068, "canonical_text": "és Jézus Krisztustól, a hűséges tanútól, a halottak elsőszülöttétől és a föld királyainak fejedelmétől!", "matched_text": "ak, és Jézus Krisztustól, aki a hűséges tanú, a halottak elsőszülöttje, és a föld királyainak fejedelme."}, {"verse_num": 6, "start_sec": 76.41777777777779, "end_sec": 92.53, "confidence": 81.13207547169812, "canonical_text": "Ő szeret minket, vérével megváltott bűneinktől, s Atyjának, az Istennek országává és papjaivá tett bennünket. Övé a dicsőség és a hatalom örökkön-örökké! Amen.", "matched_text": "szeret minket, és feloldozott minket bűneinktől a vérében, s atyának, Istennek országává és papjaivá tett bennünket, övé a dicsőség és a hatalom, örökkön, örökk"}, {"verse_num": 7, "start_sec": 94.01, "end_sec": 111.21428571428571, "confidence": 75.93984962406014, "canonical_text": "Íme, közeledik a felhőkben, látni fogja minden szem, még azoké is, akik átszúrták! A föld minden népe veri majd a mellét. Igen. Amen.", "matched_text": "me, eljön a felhőkkel, és látni fogja őt minden szem, még azoké is, akik őt átszúrták, és a föld minden népe, siratni fogja magát ő mi"}, {"verse_num": 8, "start_sec": 111.21428571428571, "end_sec": 129.18, "confidence": 73.77049180327869, "canonical_text": "\"Én vagyok az alfa és az ómega (a kezdet és a vég)\" - mondja az Úr, az Isten, aki van, aki volt és aki eljő, a Mindenható.", "matched_text": ", amen. Én vagyok az alfa és az omega, mondja az Úristen, aki van, aki volt, és aki eljövendő, a mindenható. [Silence] Én,"}, {"verse_num": 9, "start_sec": 134.43, "end_sec": 152.39894736842103, "confidence": 52.71739130434783, "canonical_text": "Én, János, a királyságban és a türelmes várásban testvéretek Jézusban, és az üldöztetésben társatok, a Patmosz nevű szigeten voltam, az Isten szava miatt, és Jézus tanúságtétele miatt.", "matched_text": "atásban, az országban és Jézus türelmes várásában, az Isten igéje és a Jézus melletti tanusság miatt, azon a szigeten voltam, amelyet Patmosznak hívnak. Lélekben elragadtattam az úr nap"}, {"verse_num": 10, "start_sec": 149.42, "end_sec": 157.16526315789474, "confidence": 50.0, "canonical_text": "Az Úr napján elragadtatásba estem. Hátam mögül, mint valami harsona,", "matched_text": "en elragadtattam az úr napján, és a hátam mögül egy olyan erős hangot"}, {"verse_num": 11, "start_sec": 160.1442105263158, "end_sec": 180.98947368421054, "confidence": 84.4311377245509, "canonical_text": "megszólalt egy hang: \"Amit látsz, írd le egy könyvbe, és küldd el a hét egyháznak: Efezusba, Szmirnába, Pergamonba, Tiatirába, Szárdeszbe, Filadelfiába és Laodiceába.\"", "matched_text": "dta, amit látsz, írd le egy könyvbe, és küldd el a hét egyháznak. Efezusba, és Szmirnába, és Pergamomba, és Tiatiirába, és Szardesba, és Filadelfiába, és Laodiceába. És"}, {"verse_num": 12, "start_sec": 180.24, "end_sec": 192.98105263157893, "confidence": 65.13761467889908, "canonical_text": "Erre megfordultam, hogy megnézzem, mely hang szól hozzám. Amint odafordultam, hét arany gyertyatartót láttam,", "matched_text": "És megfordultam, hogy lássam a hozzám beszélő hangot. És megfordulva láttam hét arany gyertyatartót, és a gyer"}, {"verse_num": 13, "start_sec": 190.73263157894735, "end_sec": 202.39909090909092, "confidence": 68.68686868686868, "canonical_text": "a gyertyatartók közt pedig az Emberfiához hasonlót. Bokáig érő ruhát viselt, aranyöv övezte mellét.", "matched_text": "a gyertyatartók között valakit, aki az emberfiához hasonlított, bokáig érő fehér ruhában, a mellén"}, {"verse_num": 14, "start_sec": 204.21238095238095, "end_sec": 211.9304761904762, "confidence": 69.86301369863014, "canonical_text": "Feje és haja fehér volt, mint a hófehér gyapjú, szeme, mint a lobogó tűz,", "matched_text": "eje és a haja ragyogó volt, mint a fehér gyapjú, mint a hó, a szemei pedig"}, {"verse_num": 15, "start_sec": 215.6209523809524, "end_sec": 224.72714285714287, "confidence": 60.86956521739131, "canonical_text": "lába, mint a kohóban izzó sárgaréz, hangja, mint a nagy vizek zúgása.", "matched_text": "izzó, sárga részhez hasonlók, a szózata pedig, mint a nagy vizek zúgá"}, {"verse_num": 16, "start_sec": 225.42761904761906, "end_sec": 239.47, "confidence": 83.72093023255813, "canonical_text": "Jobbjában hét csillagot tartott, szájából kétélű hegyes kard tört elő, arca pedig olyan volt, mint a teljes erejében ragyogó nap.", "matched_text": "obb kezében hét csillagot tartott. A szájából két élő, éles kard tört elő, az arca pedig olyan, mint a teljes fényében ragyogó nap"}, {"verse_num": 17, "start_sec": 240.92, "end_sec": 257.40666666666664, "confidence": 66.43356643356644, "canonical_text": "Amikor megpillantottam, mint egy halott a lába elé rogytam, de megérintett jobbjával, és megszólított: \"Ne félj! Én vagyok az első és az utolsó", "matched_text": "s amikor megláttam őt, úgy zuhantam a lábához, mint egy halott. És Reám tette a jobbját, és mondta, ne félj! Én vagyok az első, és az utolsó, és"}, {"verse_num": 18, "start_sec": 258.5133333333333, "end_sec": 269.65391304347827, "confidence": 79.0, "canonical_text": "és az élő. Meghaltam, s íme, mégis élek, örökké. Nálam vannak a halálnak és az alvilágnak a kulcsai.", "matched_text": "halott voltam, de íme élek, örökkön, örökké. És nálam vannak a halálnak és az alvilágnak a kulcsai."}, {"verse_num": 19, "start_sec": 269.65391304347827, "end_sec": 276.8852173913043, "confidence": 68.42105263157895, "canonical_text": "Írd le hát, amit láttál, a jelent és ami ezután történik.", "matched_text": "le hát, amiket láttál, és amik vannak, és amiknek ezután"}, {"verse_num": 20, "start_sec": 280.28727272727275, "end_sec": 296.32, "confidence": 89.937106918239, "canonical_text": "A hét csillagnak, amit a jobbomban láttál, és a hét arany gyertyatartónak ez a titka: a hét csillag a hét egyház angyala, a hét gyertyatartó meg a hét egyház.\"", "matched_text": "csillagnak, amelyeket a jobbanban láttál, és a hét arany gyertyatartónak ez a titka. A hét csillag, a hét egyház angyala. A hét gyertyatartó pedig a hét egyház."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
