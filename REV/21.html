.04651162790698, "canonical_text": "Annál, aki beszélt velem, arany mérőnád volt, hogy megmérje a várost, kapuit és falát.", "matched_text": "aki beszélt velem, annál arany mérőnád volt, hogy fölmérje a várost, a kapujit és fala"}, {"verse_num": 16, "start_sec": 203.83, "end_sec": 219.78, "confidence": 76.96969696969697, "canonical_text": "A város négyszögben épült, a hossza annyi volt, mint a szélessége. Megmérte a várost e náddal: tizenkétezer stádium. Hossza, szélessége és magassága ugyanannyi volt.", "matched_text": "s, a hosszusága ugyanannyi, mint a szélessége. És megmérte a várost a mérőnáddal tizenkétezer stádium hosszuságban. A hosszusága, szélessége és magassága ugyanannyi."}, {"verse_num": 17, "start_sec": 218.29, "end_sec": 230.986, "confidence": 67.0, "canonical_text": "Megmérte a falat: száznegyvennégy könyök emberi mérték szerint, ami egyenlő az angyal mértékével is.", "matched_text": "ága ugyanannyi. A falat száz negyvennégy könyöknek mérte emberi mértékkel, ami az angyalé is. A város"}, {"verse_num": 18, "start_sec": 230.986, "end_sec": 239.18200000000002, "confidence": 71.62162162162163, "canonical_text": "Falai jáspiskőből épültek, a város pedig kristályhoz hasonló színaranyból.", "matched_text": "kőből volt rakva, maga a város pedig a tiszta kristályhoz hasonló színarany"}, {"verse_num": 19, "start_sec": 237.816, "end_sec": 251.39916666666664, "confidence": 72.99270072992701, "canonical_text": "A város falainak alapjait mindenféle drágakő díszítette. Az első alapkő jáspis, a második zafír, a harmadik kalcedon, a negyedik smaragd,", "matched_text": "ló színaranyból volt. A város alapkövei mind drágakövek. Az első jáspis, a második zafír, a harmadik kalkedon, a negyedik smaragd, az ötöd"}, {"verse_num": 20, "start_sec": 250.8370833333333, "end_sec": 265.5366666666667, "confidence": 91.56626506024097, "canonical_text": "az ötödik szárdonix, a hatodik kárneol, a hetedik topáz, a nyolcadik berill, a kilencedik topáz, a tizedik krizopráz, a tizenegyedik jácint, a tizenkettedik ametiszt.", "matched_text": "tödik szardonix, a hatodik szardinos, a hetedik krizolit, a nyolcadik beril, a kilencedik topáz, a tizedik krizopráz, a tizenegyedik jácint, a tizenkettedik ametiszt."}, {"verse_num": 21, "start_sec": 264.83444444444444, "end_sec": 278.55499999999995, "confidence": 72.72727272727273, "canonical_text": "A tizenkét kapu tizenkét gyöngy: mindegyik kapu egy-egy gyöngy. A város utcái tükörfényes színaranyból voltak.", "matched_text": "t. A tizenkét kapu tizenkét igaz gyöngy. Mindegyik kapu egy-egy gyöngy. A város tere teljesen áttetsző, kristál"}, {"verse_num": 22, "start_sec": 284.6671428571429, "end_sec": 294.49545454545455, "confidence": 61.79775280898876, "canonical_text": "De templomot nem láttam benne, mert a Mindenható, az Úr, az Isten és a Bárány a temploma.", "matched_text": "osban nem láttam templomot, mert temploma a mindenható Úristen és a bárány. És a városnak"}, {"verse_num": 23, "start_sec": 293.93363636363637, "end_sec": 305.17, "confidence": 76.51515151515152, "canonical_text": "A városnak nincs szüksége sem Napra, sem Holdra, hogy világítsanak, mert az Isten dicsősége ragyogja be, világossága pedig a Bárány.", "matched_text": "városnak nincs szüksége sem napra, sem holdra, hogy világítsanak neki, mert Isten fényessége világította meg, és mégyse se a bárány."}, {"verse_num": 24, "start_sec": 309.12333333333333, "end_sec": 316.427, "confidence": 68.91891891891892, "canonical_text": "Fényében járnak a nemzetek, és a föld királyai elhozzák bele dicsőségüket.", "matched_text": "lágosságában fognak járni, és a föld királyai elhozzák a dicsőségüket, és a"}, {"verse_num": 25, "start_sec": 317.0855, "end_sec": 323.012, "confidence": 68.0, "canonical_text": "Kapuit nem zárják be soha, hisz ott nincs éjszaka.", "matched_text": "phosszat nem zárják be, mert ott nem lesz éjszaka."}, {"verse_num": 26, "start_sec": 312.5833333333333, "end_sec": 317.744, "confidence": 45.45454545454546, "canonical_text": "A népek odahordják kincseiket és értékeiket.", "matched_text": "lyai elhozzák a dicsőségüket, és a kapukat na"}, {"verse_num": 27, "start_sec": 336.055625, "end_sec": 345.0, "confidence": 72.41379310344827, "canonical_text": "Nem jut oda be tisztátalan, sem gonosztevő, sem hazug, csak azok, akik be vannak írva a Bárány életkönyvébe.", "matched_text": "tesz, hanem csak azok, akik be vannak írva a bárány életkönyvébe."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
