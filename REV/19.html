    <script>
        const chapterData = {"book": {"usx_code": "REV", "hungarian_name": "János jelenései", "abbreviation": "Jel", "book_number": 427, "chapter_count": 22}, "chapter": {"book_usx": "REV", "chapter_num": 19, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/73_jelenesek/jelenesek-konyve-19-fejezet.mp3", "verse_count": 21, "aligned_count": 21}, "verses": [{"verse_num": 1, "start_sec": 3.12, "end_sec": 16.860000000000003, "confidence": 62.4, "canonical_text": "Aztán hallottam, hogy nagy sokaság zengi a mennyben, ezt mondva: \"Alleluja! Üdv, dicsőség és hatalom legyen a mi Istenünknek,", "matched_text": "Ezek után egy nagy sereg zúgó hangját hallottam, akik az égben ezt mondták, Alleluia, üdvés dicsőség és erő a mi Istenünknek,"}, {"verse_num": 2, "start_sec": 16.205714285714286, "end_sec": 34.52571428571429, "confidence": 73.91304347826086, "canonical_text": "mert igazak és igazságosak ítéletei! Elítélte a nagy kéjnőt, aki megrontotta a földet paráznaságával és megbosszulta rajta szolgái vérét, melyet keze ontott ki.\"", "matched_text": "mert igazak és igazságosak az ő ítéletei. Mert ítélkezett a nagy kénő fölött, aki megrontotta a földet paráznaságával, És most Isten számon kérte kezéből az ő sz"}, {"verse_num": 3, "start_sec": 33.871428571428574, "end_sec": 45.1025, "confidence": 58.241758241758234, "canonical_text": "Másodszor is felhangzott: \"Alleluja! És a parázna asszony füstje felszáll, örökkön-örökké!\"", "matched_text": "szolgáinak vérét. És ismét mondták, Alleluia, és az ő füstje fölszáll örökkön örökké. És a h"}, {"verse_num": 4, "start_sec": 42.2675, "end_sec": 57.151250000000005, "confidence": 78.57142857142857, "canonical_text": "A huszonnégy vén és a négy élőlény leborult, imádták a trónon ülő Istent, ezekkel a szavakkal: \"Amen! Alleluja!\"", "matched_text": "é. És a huszonnégy vén és a négy élőlény leborult, és imádták a trónon ülő Istent, és mondták, Amen, Alleluia. És"}, {"verse_num": 5, "start_sec": 58.56875, "end_sec": 70.31777777777778, "confidence": 58.47457627118644, "canonical_text": "És a trónról hang tört elő, s így szólt: \"Dicsőítsétek Istenünket, akik szolgáltok neki és félitek, kicsik és nagyok!\"", "matched_text": "zat hallatszott, amely mondta, dicséretet mondjatok Istenünknek minden szolgái, akik félitek őt, kicsinyek és nagyok. É"}, {"verse_num": 6, "start_sec": 69.76, "end_sec": 85.7888, "confidence": 61.0062893081761, "canonical_text": "És hallottam, mint hatalmas tömeg moraját, mint nagy vizek zúgását, mint zengő mennydörgés robaját: \"Alleluja! Megkezdte uralmát Urunk, Istenünk, a Mindenható.", "matched_text": "És olyan hangot hallottam, mint a nagy tömeg, vagy a tenger zúgása, vagy mint a hatalmas mennydörgések robaja. Alleluia, mert uralkodott az Úr, ami minden ható"}, {"verse_num": 7, "start_sec": 87.26599999999999, "end_sec": 98.345, "confidence": 77.45098039215686, "canonical_text": "Örüljünk, ujjongjunk és dicsőítsük, mert eljött a Bárány menyegzőjének napja. Menyasszonya felkészült.", "matched_text": "és ujjongjunk és dicsőítsük őt, mert elérkezett a bárány mennyegzője és az ő mennyasszonya fölgészült."}, {"verse_num": 8, "start_sec": 99.0836, "end_sec": 110.1626, "confidence": 61.0, "canonical_text": "Megadatott neki, hogy ragyogó fehér patyolatba öltözzék.\" A patyolat a szentek igaz tetteit jelenti.", "matched_text": "egadatott neki, hogy tiszta hófehérbe öltözzék, mert a fehér ruha a szentek megigazultsága. És mondta"}, {"verse_num": 9, "start_sec": 107.9468, "end_sec": 123.76702702702703, "confidence": 70.37037037037037, "canonical_text": "Ekkor hozzám fordult: \"Írd! Boldogok, akik hivatalosak a Bárány menyegzői lakomájára!\" Majd folytatta: \"Istennek ezek a szavai igazak.\"", "matched_text": "ága. És mondta nekem, írjad, Boldogok, akik hivatalosak a bárány mennyegzői lakomájára. És mondta nekem, Istennek ezek az igéi igazak. É"}, {"verse_num": 10, "start_sec": 125.61810810810812, "end_sec": 145.98, "confidence": 73.39901477832512, "canonical_text": "Lába elé borultam, hogy imádjam, de ő így szólt: \"Vigyázz, ne tedd! Szolgatársad vagyok, neked és testvéreidnek, akik tanúságot tesznek Jézusról. Az Istent imádd!\" Mert Jézus tanúsága a prófétaság lelke.", "matched_text": "ába előtt, hogy imádjam, de ő mondta nekem, vigyázz, ne tedd, én szolgatársad vagyok neked és testvéreidnek, akiké a Jézusról való tanuság. Istent imádd! Mert a Jézusról való tanuság tétel a profétai léle"}, {"verse_num": 11, "start_sec": 145.36297297297295, "end_sec": 163.38949152542372, "confidence": 65.71428571428571, "canonical_text": "Ekkor nyitva láttam az eget. Egyszerre egy fehér ló jelent meg. Aki rajta ült, azt Hűségesnek és Igaznak hívták. Igazságosan ítél és harcol.", "matched_text": "lek. És láttam a megnyílt eget, és íme egy fehér ló, és aki rajta ült, annak neve hűséges és igazmondó, s igazságosan ítél és harcol. A szeme"}, {"verse_num": 12, "start_sec": 163.38949152542372, "end_sec": 175.11796610169492, "confidence": 68.08510638297872, "canonical_text": "Szeme olyan, mint a lobogó tűz, fején sok korona, ráírva a név, amelyet senki sem tud, csak ő.", "matched_text": "olyanok, mint a lobogó tűz, a fején ékes diadém, És név van rajta, amit senki sem ismer, csak ő"}, {"verse_num": 13, "start_sec": 175.73525423728813, "end_sec": 183.76, "confidence": 50.847457627118644, "canonical_text": "Vértől ázott ruha van rajta, a nevét Isten Igéjének hívják.", "matched_text": "ruhája meg van hintve vérrel, és az ő neve az Isten igéje."}, {"verse_num": 14, "start_sec": 183.76, "end_sec": 192.00142857142856, "confidence": 70.58823529411764, "canonical_text": "Az égi seregek fehér lovon kísérik, tiszta fehér patyolatba öltözve.", "matched_text": "a mennyei seregek fehér lovon követik őt, és tiszta fehérbe öltöztet"}, {"verse_num": 15, "start_sec": 193.375, "end_sec": 211.91821428571427, "confidence": 61.038961038961034, "canonical_text": "Szájából éles kard tör elő, hogy lesújtson a nemzetekre. Vasvesszővel kormányozza majd őket, és tapossa a mindenható Isten haragja tüzes borának sajtóját.", "matched_text": "szájából két élű kard tör elő, hogy azzal verje meg a nemzeteket, és uralkodni fog fölöttük vaspálcával, és ő tapossa Isten haragja dühének sajtóját. A ru"}, {"verse_num": 16, "start_sec": 211.23142857142858, "end_sec": 222.22, "confidence": 71.05263157894737, "canonical_text": "Öltözetén a csípő körül ez a név volt felírva: Királyok Királya és Urak Ura.", "matched_text": "a csipője körül, ez a név áll írva, a királyok királya, és az uralkodók ura."}, {"verse_num": 17, "start_sec": 227.8825, "end_sec": 239.1467857142857, "confidence": 56.52173913043479, "canonical_text": "Láttam, hogy egy angyal áll a napban. Nagy szóval kiáltotta az égen repülő madaraknak: \"Gyertek, gyűljetek össze az Isten nagy lakomájára.", "matched_text": "állt, és kiáltott a hangos szóval, és mondta az összes madaraknak, melyek átröpültek az égen, jöjjetek, gyülekezzetek Isten nagy lakomájára"}, {"verse_num": 18, "start_sec": 239.70999999999998, "end_sec": 254.9167857142857, "confidence": 72.0, "canonical_text": "Egyétek a királyok húsát, a vezérek húsát, a bajnokok húsát, a lovak és lovasok húsát, minden szabadnak és rabszolgának, kicsinek és nagynak a húsát!\"", "matched_text": "yétek a királyok húsát, a fejedelmek húsát, és az erősek húsát, a lovak, és a rajtuk ülőknek a húsát, az összes szabadok és rabszolgák, kicsinek és nag"}, {"verse_num": 19, "start_sec": 256.78583333333336, "end_sec": 267.9025, "confidence": 61.78861788617886, "canonical_text": "Majd láttam: A vadállat és a föld királyai összegyűltek a seregeikkel együtt, hogy harcra keljenek a Lovassal és seregével.", "matched_text": "láttam a vadállatot, és a föld királyait, meg a seregeiket, hogy összegyűltek, hogy megütközzenek azzal, aki a lovon ült, és"}, {"verse_num": 20, "start_sec": 270.6218333333333, "end_sec": 293.2596666666667, "confidence": 66.96035242290749, "canonical_text": "De ezek elfogták a vadállatot és vele együtt a hamis prófétát, aki csodákat tett, és félrevezette velük azokat, akik a vadállat bélyegét viselték, és a képmását imádták. Elevenen bevetették mind a kettőt a kénköves, tüzes tóba.", "matched_text": "egfogták a vadállatot, és vele együtt a hamis profétát, aki jeleket művelt a színe előtt, melyekkel félrevezette azokat, akik fölvették a vadállat jelét, és akik imádják az ő képmását. Ezt a kettőt elevenen vetették a kénkővel é"}, {"verse_num": 21, "start_sec": 294.48333333333335, "end_sec": 306.72, "confidence": 79.20792079207921, "canonical_text": "A többit a Lovas kardja ölte meg, amely a szájából tört elő. És az összes madár jóllakott a húsukból.", "matched_text": "többieket megölte a lovon ülő kardja, mely a szájából tör elő, és az összes madár jól lakott a húsukk"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
