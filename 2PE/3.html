hogy némelyek késedelmesnek tartják, hanem türelemmel van irántatok. Mert nem akarja, hogy bárki elveszen, hanem mindenkit bűnbánatot tartson."}, {"verse_num": 10, "start_sec": 117.76157894736842, "end_sec": 134.16, "confidence": 91.71974522292994, "canonical_text": "Mint a tolvaj, úgy jön el az Úr napja. Ezen a napon az egek nagy robajjal elmúlnak, az elemek a tűz hevétől felbomlanak, a föld és ami rajta van, elenyészik.", "matched_text": "a tolvaj, úgy jön el az úr napja. Azon a napon az egek nagy robajjal megszakadnak, az elemek a tűzhevétől felbomlanak, s a föld és ami rajta van, elenyészik."}, {"verse_num": 11, "start_sec": 135.61, "end_sec": 144.01277777777779, "confidence": 93.90243902439023, "canonical_text": "Mivel így minden elpusztul, minden tekintetben szentül és vallásosan kell élnetek,", "matched_text": "Mivel minden így elpusztul, minden tekintetben szentül és vallásosan kell élnetek."}, {"verse_num": 12, "start_sec": 143.2488888888889, "end_sec": 157.4256, "confidence": 94.5945945945946, "canonical_text": "hiszen várjátok és siettetitek az Isten napjának eljövetelét, amikor is az egek lángba borulnak és felbomlanak, az elemek a tűz hevétől megolvadnak.", "matched_text": "k. Hiszen várjátok és siettetitek Isten napjának eljövetelét. Amikor is az egek lángba borulnak és fölbomlanak, az elemek a tűzhevétől megolvadnak. M"}, {"verse_num": 13, "start_sec": 157.4256, "end_sec": 166.59, "confidence": 91.66666666666666, "canonical_text": "Mi ígérete alapján új eget és új földet várunk, az igazságosság hazáját.", "matched_text": "ig az ő ígérete alapján új eget és új földet várunk, az igazság hazáját."}, {"verse_num": 14, "start_sec": 165.65, "end_sec": 177.78, "confidence": 98.23008849557522, "canonical_text": "Szeretteim, minthogy ezt várjuk, legyetek rajta, hogy békességben, tisztán és feddhetetlenül találjon benneteket.", "matched_text": "Szeretteim, minthogy ezt várjuk, legyetek rajta, hogy békességben, tisztán és fethetetlenül találjon benneteket."}, {"verse_num": 15, "start_sec": 178.15, "end_sec": 187.49761904761905, "confidence": 97.34513274336283, "canonical_text": "Urunk türelmét tartsátok üdvösségnek, ahogy szeretett testvérünk, Pál írta nektek ajándékul kapott bölcsességében", "matched_text": "Urunk türelmét tartsátok üdvösségesnek, ahogy szeretett testvérünk Pál írta nektek, ajándékul kapott bölcsességébe"}, {"verse_num": 16, "start_sec": 187.49761904761905, "end_sec": 205.93, "confidence": 98.48484848484848, "canonical_text": "minden olyan levélben, amelyben ezekről a dolgokról beszél. Vannak bennük nehezen érthető dolgok, ezeket a tanulatlan és állhatatlan emberek kicsavarják a saját vesztükre, akárcsak a többi Írást is.", "matched_text": "minden olyan levelében, amelyben ezekről a dolgokról beszél. Vannak bennük nehezen érthető dolgok, ezeket a tanulatlan és álhatatlan emberek kicsavarják a saját vesztükre, akárcsak a többi írást is."}, {"verse_num": 17, "start_sec": 207.09, "end_sec": 219.68, "confidence": 97.82608695652173, "canonical_text": "Szeretteim, mivel már eleve tudtok erről, vigyázzatok, nehogy a gonoszok tévedése elsodorjon benneteket, és elveszítsétek biztonságotokat.", "matched_text": "zeretteim, mivel már eleve tudtok ezekről, vigyázzatok, nehogy a gonoszok tévedése elsodorjon benneteket, és elveszítsétek biztonságtokat."}, {"verse_num": 18, "start_sec": 220.18, "end_sec": 234.25, "confidence": 95.62043795620438, "canonical_text": "Gyarapodjatok Urunk és Megváltónk, Jézus Krisztus kegyelmében és ismeretében. Neki legyen dicsőség most és az örökkévalóság napján! Amen.", "matched_text": "arapodjatok, Urunk és megváltunk, Jézus Krisztus kegyelmében és ismeretében. Neki legyen dicsőség most és az örök kivalóság napján. Amen."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
