n kényszerű kötelességem. Jaj, nekem ugyanis, ha nem hirdetem az evangéliumot. Ha"}, {"verse_num": 17, "start_sec": 171.14117647058825, "end_sec": 179.23529411764707, "confidence": 97.84946236559139, "canonical_text": "Ha önszántamból teszem, jutalmam lesz, ha nem önszántamból, csak megbízott hivatalnok vagyok.", "matched_text": "Ha önszántamból teszem, jutalmam lesz. Ha nem önszántamból, csak megbízott hivatalnok vagyok."}, {"verse_num": 18, "start_sec": 179.23529411764707, "end_sec": 193.4, "confidence": 99.28571428571429, "canonical_text": "Mi tehát a jutalmam? Az, hogy mint az evangélium hirdetője, ingyen nyújtsam az evangéliumot, s ne éljek az evangéliumban gyökerező jogommal.", "matched_text": "Mi tehát a jutalmam? Az, hogy mint az evangélium hirdetője, ingyen nyújtsam az evangéliumot, és ne éljek az evangéliumban gyökerező jogommal."}, {"verse_num": 19, "start_sec": 195.0642222222222, "end_sec": 202.1948888888889, "confidence": 95.91836734693877, "canonical_text": "Bár mindenkitől független voltam, mégis mindenkinek szolgája lettem, hogy minél többet megnyerjek.", "matched_text": "mindenkitől független voltam, mégis mindenkinek a szolgája lettem, hogy minél többeket megnyerjek."}, {"verse_num": 20, "start_sec": 201.60066666666665, "end_sec": 221.9146551724138, "confidence": 97.82608695652173, "canonical_text": "A zsidók előtt zsidóvá váltam, hogy megnyerjem a zsidókat. A törvény alá rendeltek között a törvény alárendeltje lettem - noha magam nem vagyok a törvénynek alárendelve -, csak hogy megnyerjem azokat, akik a törvény alárendeltjei.", "matched_text": "A zsidók előtt zsidóvá váltam, hogy megnyerjem a zsidókat. A törvény alárendeltek között a törvény alárendeltje lettem, noha magam nem vagyok a törvénynek alárendelve, csak hogy megnyerjem azokat, akik a törvény alárendeltjei. Azo"}, {"verse_num": 21, "start_sec": 221.27, "end_sec": 243.188275862069, "confidence": 96.08695652173913, "canonical_text": "Azok közt, akikre a törvény nem vonatkozik, olyan lettem, mint aki a törvényen kívül áll - pedig nem állok Isten törvényén kívül, hanem Krisztus törvényének vagyok alárendelve -, csak hogy megnyerjem a törvény alá nem rendelteket.", "matched_text": "Azok között. Akikre a törvény nem vonatkozik, olyan lettem, mint aki a törvényen kívül áll. Pedig nem állok Isten törvényén kívül, hanem Krisztus törvényének vagyok alárendelve. Csak hogy megnyerjem, a törvény alá nem rendelteket."}, {"verse_num": 22, "start_sec": 243.188275862069, "end_sec": 252.85810344827587, "confidence": 98.23008849557522, "canonical_text": "A gyöngék közt gyönge lettem, hogy megnyerjem a gyöngéket. Mindenkinek mindene lettem, hogy mindenkit üdvözítsek.", "matched_text": "A gyöngék közt gyöngelettem, hogy megnyerjem a gyöngéket. Mindenkinek minden elettem, hogy mindenkit üdvözítsek. M"}, {"verse_num": 23, "start_sec": 252.2134482758621, "end_sec": 258.66, "confidence": 100.0, "canonical_text": "Mindezt az evangéliumért teszem, hogy nekem is részem legyen benne.", "matched_text": "Mindezt az evangéliumért teszem, hogy nekem is részem legyen benne."}, {"verse_num": 24, "start_sec": 258.0153448275862, "end_sec": 272.9866666666667, "confidence": 99.1304347826087, "canonical_text": "Nem tudjátok, hogy a pályán küzdők mind futnak ugyan, de a díjat csak egy nyeri el? Úgy fussatok, hogy elnyerjétek!", "matched_text": "Nem tudjátok, hogy a pályán küzdők mind futnak ugyan, de a díjat csak egy nyeri el? Úgy fussatok, hogy elnyerjétek."}, {"verse_num": 25, "start_sec": 272.29333333333335, "end_sec": 284.08, "confidence": 95.96774193548387, "canonical_text": "A versenyzők valamennyien megtartóztató életet élnek, minden tekintetben. Ők hervadó koszorúért, mi pedig hervadhatatlanért.", "matched_text": "A versenyzők valamennyien megtartóztató életet élnek minden tekintetben. Ők hervadó koszorú ért, Mi pedig hervathatatlan érd"}, {"verse_num": 26, "start_sec": 284.08, "end_sec": 293.68, "confidence": 96.73913043478261, "canonical_text": "Én is futok, de nem céltalanul, az ökölvívásban nem a levegőt csapkodom, hanem megzabolázom,", "matched_text": "Én is futok, de nem céltalanul. Az ökölvivásban nem a levegőt csapkodom, hanem megzabolázom,"}, {"verse_num": 27, "start_sec": 293.68, "end_sec": 302.52, "confidence": 95.1219512195122, "canonical_text": "és rabságba vetem testemet, hogy míg másokat tanítok, magam méltatlanná ne váljak.", "matched_text": "s rapságra vetem a testemet, hogy míg másokat tanítok, magam méltatlanná ne váljak."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
