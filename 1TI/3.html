    <script>

 hogyan tudná gondját viselni Isten egyházának?"}, {"verse_num": 6, "start_sec": 54.464285714285715, "end_sec": 63.12, "confidence": 97.36842105263158, "canonical_text": "Újonnan megtért se legyen, nehogy felfuvalkodjék, és a sátán sorsára jusson.", "matched_text": "Újonnan megtért se legyen, nehogy fölfuvalkodjék és a sátán sorsára jusson."}, {"verse_num": 7, "start_sec": 63.65, "end_sec": 73.5925, "confidence": 95.40229885057472, "canonical_text": "Legyen jó híre a kívülállók körében is, nehogy megszólják, és a sátán csapdájába essék.", "matched_text": "Legyen jó híre a kívülálló körében is, nehogy megszólják és a sátán csapdájába essen. A"}, {"verse_num": 8, "start_sec": 72.76, "end_sec": 82.75, "confidence": 99.04761904761905, "canonical_text": "A diakónusok hasonlóképpen legyenek tisztességesek, ne kétszínűek, borisszák vagy piszkos haszonra lesők.", "matched_text": "A diakonusok hasonlóképpen legyenek tisztességesek, ne kétszínűek, borisszák vagy piszkos haszonra lesők."}, {"verse_num": 9, "start_sec": 83.08, "end_sec": 87.32941176470588, "confidence": 100.0, "canonical_text": "A hit titkát őrizzék tiszta lelkiismerettel.", "matched_text": "A hit titkát őrizzék tiszta lelkiismerettel."}, {"verse_num": 10, "start_sec": 87.32941176470588, "end_sec": 96.48277777777777, "confidence": 86.48648648648648, "canonical_text": "Ki kell előbb próbálni őket, s csak akkor szolgáljanak, ha kifogástalanok.", "matched_text": "lőbb ki kell őket próbálni, s csak akkor szolgáljanak, ha kifogástalanok. A"}, {"verse_num": 11, "start_sec": 95.74, "end_sec": 105.39611111111111, "confidence": 100.0, "canonical_text": "Az asszonyok szintén legyenek tisztességesek, ne legyenek rágalmazók, hanem mértéktartók és mindenben megbízhatók.", "matched_text": "Az asszonyok szintén legyenek tisztességesek, ne legyenek rágalmazók, hanem mértéktartók és mindenben megbízhatók."}, {"verse_num": 12, "start_sec": 105.39611111111111, "end_sec": 113.748, "confidence": 96.20253164556962, "canonical_text": "A diakónus legyen egyszer nősült, s gyermekeinek és otthonának jó gondviselője.", "matched_text": "A diakonos legyen egyszer nősült, s gyermekeinek is otthonának jó gondviselője."}, {"verse_num": 13, "start_sec": 113.748, "end_sec": 126.16, "confidence": 99.2248062015504, "canonical_text": "Aki ugyanis jól végzi szolgálatát, nagy megbecsülésre tesz szert, és bizalmat szerez magának a Krisztus Jézusra alapozott hitben.", "matched_text": "Aki ugyanis jól végzi szolgálatát, nagy megbecsülésre tesz szert, és bizalmat szerez magának a Krisztusi Jézusra alapozott hitben."}, {"verse_num": 14, "start_sec": 127.88, "end_sec": 134.4305, "confidence": 95.94594594594594, "canonical_text": "Mindezt azért írom neked, jóllehet remélem, hogy hamarosan eljutok hozzád,", "matched_text": "Mindezt azért írom neked. Jó lehet remélem, hogy hamarosan eljutok hozzád,"}, {"verse_num": 15, "start_sec": 134.4305, "end_sec": 146.73, "confidence": 96.09375, "canonical_text": "hogy ha késném is; tudd, hogyan kell viselkedned Isten házában, amely az élő Isten egyháza, az igazság oszlopa és biztos alapja.", "matched_text": "hogyha késném is, tudd, hogyan kell viselkedned Isten házában. Amely az élő Isten egyháza, s az igazság oszlopa és biztos alapja."}, {"verse_num": 16, "start_sec": 147.78, "end_sec": 169.5, "confidence": 97.02970297029702, "canonical_text": "Megvallottan nagy dolog az istenfélő élet titka: Aki megjelent testben, igazolást nyert lélekben. Az angyaloknak megjelent, a pogányoknak hirdették. Világszerte hittek benne, s felvétetett a dicsőségbe.", "matched_text": "Megvallottan nagy dolog az Isten félő élettitka, aki megjelent testben, igazolást nyelt lélekben. Az angyaloknak megjelent, a pogányoknak hirdették. Világszerte hittek benne, s fölvétetett a dicsőségbe."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
