    <script>
        const chapterData = {"book": {"usx_code": "MAT", "hungarian_name": "Máté evangéliuma", "abbreviation": "Mt", "book_number": 401, "chapter_count": 28}, "chapter": {"book_usx": "MAT", "chapter_num": 8, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/47_mate/mate-evangeliuma-08-fejezet.mp3", "verse_count": 34, "aligned_count": 34}, "verses": [{"verse_num": 1, "start_sec": 3.04, "end_sec": 8.820512820512821, "confidence": 87.75510204081633, "canonical_text": "Amikor lejött a hegyről, nagy népsokaság követte.", "matched_text": "Amikor pedig lejött a hegyről, nagy sokaság követt"}, {"verse_num": 2, "start_sec": 8.097948717948718, "end_sec": 19.65897435897436, "confidence": 72.0, "canonical_text": "Egyszer csak odament hozzá egy leprás, leborult előtte és kérte: \"Uram, ha akarod, megtisztíthatsz!\"", "matched_text": "ette őt, és íme odajött egy leprás. Leborult előtte, és mondta, Uram, ha akarod, megtisztíthatsz enge"}, {"verse_num": 3, "start_sec": 18.213846153846152, "end_sec": 31.8096, "confidence": 71.07438016528927, "canonical_text": "Jézus kinyújtotta kezét, megérintette, s így szólt hozzá: \"Akarom, tisztulj meg!\" Erre az nyomban megtisztult leprájától.", "matched_text": "z engem. És kinyújtván a kezét, megérintette őt, és mondta, akarom, tisztulj meg. És azonnal megtisztult a leprájától. És"}, {"verse_num": 4, "start_sec": 31.22, "end_sec": 45.96, "confidence": 72.72727272727273, "canonical_text": "Ekkor Jézus ezt mondta neki: \"Vigyázz, ne mondd el senkinek, hanem menj, mutasd meg magad a papnak, és ajánld fel a Mózes rendelte áldozatot bizonyságul!\"", "matched_text": "s Jézus mondta neki, vigyázz, senkinek ne mond, hanem menj, mutasd meg magadat a papnak, és ajánld föl az adományt, amit Mózes parancsolt, bizonságul nekik"}, {"verse_num": 5, "start_sec": 47.936527777777776, "end_sec": 53.10180555555556, "confidence": 61.29032258064516, "canonical_text": "Amikor beért Kafarnaumba, egy százados járult eléje, kérve őt:", "matched_text": "ig  a gadarénusok vidékén, elébe futott két ördögtől megszállott, akik a sírokból jöttek elő, És annyira vadak voltak, hogy azon az uton senki sem járhatott."}, {"verse_num": 29, "start_sec": 291.26622222222227, "end_sec": 299.66, "confidence": 70.2127659574468, "canonical_text": "Így kiabáltak: \"Mi közünk hozzád, Isten fia? Azért jöttél ide, hogy idő előtt gyötörj minket?\"", "matched_text": "kiáltottak mondván, mi közünk egymáshoz, Istennek, fia, ide jöttél, hogy idő előtt gyötöri mink"}, {"verse_num": 30, "start_sec": 108.695, "end_sec": 112.0075, "confidence": 47.61904761904761, "canonical_text": "Messze tőlük nagy sertéskonda legelészett.", "matched_text": "keletről és napnyugatról, és letelepszenek"}, {"verse_num": 31, "start_sec": 305.26875, "end_sec": 311.3416666666667, "confidence": 61.19402985074627, "canonical_text": "Ezért az ördögök kérték: \"Ha kiűzöl minket, küldj a sertéskondába!\"", "matched_text": "gonosz lelkek pedig kérték, ha kiüzöl minket, küldjél a disznókba."}, {"verse_num": 32, "start_sec": 312.9979166666667, "end_sec": 326.8, "confidence": 56.71641791044777, "canonical_text": "\"Menjetek!\" - mondta nekik. Erre kimentek és megszállták a sertéseket, mire az egész konda lerohant a meredekről a tóba és vízbe fúlt.", "matched_text": "njetek. Azok kimenvén az emberekből a disznókba mentek, és íme az egész gonda a meredek partról nagy erővel a tóba rohant, és a vízbe f"}, {"verse_num": 33, "start_sec": 326.8, "end_sec": 338.45514285714285, "confidence": 56.896551724137936, "canonical_text": "A kanászok elfutottak, és a városba érve mindent elmondtak, azt is, ami a megszállottakkal a szemük láttára történt.", "matched_text": "kanászok pedig elfutottak, bementek a városba, és hirül vittek mindent azokról is, akiknek ördögei voltak. És íme az"}, {"verse_num": 34, "start_sec": 337.84171428571426, "end_sec": 348.27, "confidence": 72.72727272727273, "canonical_text": "Az egész város kiment Jézus elé, és amikor megpillantották, kérték, hagyja el határukat.", "matched_text": "egész város kijött Jézus elé, és miután látta, Ták őt, kérték, hogy menjen el a határukb"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
