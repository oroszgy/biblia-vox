.14, "end_sec": 325.405, "confidence": 61.654135338345874, "canonical_text": "Amikor a házba érkezett, a vakok bementek hozzá. Jézus megkérdezte tőlük: \"Hiszitek, hogy meg tudom tenni?\" \"Igen, Uram!\" - felelték.", "matched_text": "Amikor Jézus hazaért, bementek hozzá a vakok. És mondta nekik Jézus, hiszitek-e, hogy ezt meg tudom tenni? Mondták neki, Igen, Uram. A"}, {"verse_num": 29, "start_sec": 323.923, "end_sec": 332.815, "confidence": 82.6086956521739, "canonical_text": "Erre megérintette a szemüket, és így szólt: \"Legyen hitetek szerint!\"", "matched_text": "Uram. Akkor megérintette a szemüket, és így szólt, a hitetek szerint l"}, {"verse_num": 30, "start_sec": 333.556, "end_sec": 343.71000000000004, "confidence": 74.72527472527473, "canonical_text": "Nyomban megnyílt a szemük. Jézus pedig rájuk parancsolt: \"Vigyázzatok, ne tudja meg senki!\"", "matched_text": "megnyíltak a szemeik. Jézus pedig rájuk parancsolt mondván, vigyázzatok, nehogy valaki megt"}, {"verse_num": 31, "start_sec": 341.41333333333336, "end_sec": 348.30333333333334, "confidence": 55.73770491803278, "canonical_text": "De azok alighogy elmentek, az egész környéken elhíresztelték.", "matched_text": "ehogy valaki megtudja. Azok pedig kimentek, és elhíreztelték ő"}, {"verse_num": 32, "start_sec": 352.71, "end_sec": 360.65, "confidence": 50.70422535211267, "canonical_text": "Alighogy ezek elmentek, íme, egy ördögtől megszállt némát hoztak eléje.", "matched_text": "iután azok elmentek, íme, hoztak oda egy néma embert, akinek ördöge volt"}, {"verse_num": 33, "start_sec": 361.3566666666666, "end_sec": 373.09, "confidence": 66.10169491525424, "canonical_text": "Mihelyt kiűzte belőle a gonosz lelket, a néma megszólalt. A nép csodálkozva mondta: \"Ilyen még nem történt Izraelben!\"", "matched_text": "után kiüzte belőle az ördögöt, a néma beszélt. És a sokaság csodálkozott, és mondta, ilyen még soha nem volt Izraelben."}, {"verse_num": 34, "start_sec": 372.50333333333333, "end_sec": 385.43857142857144, "confidence": 59.63302752293578, "canonical_text": "A farizeusok azonban azt terjesztették: \"A gonosz lelkek fejedelmének segítségével űzi ki a gonosz lelkeket.\"", "matched_text": "ben. A farizeusok pedig azt mondták, a gonosz lelkek fejedelmével űzi ki az ördögöket. És Jézus körbejárta az"}, {"verse_num": 35, "start_sec": 384.74142857142857, "end_sec": 398.6842857142857, "confidence": 74.12587412587412, "canonical_text": "Jézus bejárt minden várost és falut, tanított a zsinagógákban, hirdette országa örömhírét, és gyógyított minden betegséget, minden gyengeséget.", "matched_text": "az összes városokat és hegyi falvakat, tanított a zsinagógáikban, hirdette az ország evangéliumát, és gyógyított minden betegséget és minden nyo"}, {"verse_num": 36, "start_sec": 398.6842857142857, "end_sec": 410.5357142857143, "confidence": 55.93220338983051, "canonical_text": "Amikor látta a tömeget, megesett rajta a szíve, mert olyan volt, mint pásztor nélkül a juhok: elcsigázott és kimerült.", "matched_text": "Amikor pedig látta a sereget, megkönyörült rajtuk, mert olyan meggyötörtek és elesettek voltak, mint a juhok, melyeknek"}, {"verse_num": 37, "start_sec": 413.48, "end_sec": 423.77, "confidence": 64.7887323943662, "canonical_text": "\"Az aratnivaló sok, de a munkás kevés\" - mondta akkor tanítványainak. -", "matched_text": "inak, az aratni való sok, de a munkás kevés. Kérjétek azért az aratás ur"}, {"verse_num": 38, "start_sec": 419.36, "end_sec": 426.71, "confidence": 82.53968253968253, "canonical_text": "\"Kérjétek hát az aratás urát, küldjön munkásokat az aratáshoz.\"", "matched_text": "Kérjétek azért az aratás urát, hogy küldjön munkásokat aratásáb"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
