Zorobábelt,"}, {"verse_num": 13, "start_sec": 119.22833333333332, "end_sec": 127.78999999999999, "confidence": 75.0, "canonical_text": "Zerubbábel nemzette Abihudot, Abihud nemzette Eljakimot. Eljakim nemzette Acort.", "matched_text": "nemzette Ábiudot, Ábiud pedig nemzette Eliakimot, Eliakim pedig nemzette Ázort,"}, {"verse_num": 14, "start_sec": 129.34666666666666, "end_sec": 137.13, "confidence": 77.14285714285715, "canonical_text": "Acor nemzette Cádokot, Cádok nemzette Achimot, Achim nemzette Eliudot.", "matched_text": "mzette Szádokot, Szádok pedig nemzette Ahimot, Ahim pedig nemzette Eliu"}, {"verse_num": 15, "start_sec": 138.68666666666667, "end_sec": 146.47, "confidence": 80.0, "canonical_text": "Eliud nemzette Eleazárt, Eleazár nemzette Mattant, Mattan nemzette Jákobot.", "matched_text": "te Eleázárt, Eleázár pedig nemzette Mattant, Mattant pedig nemzette Jákobot,"}, {"verse_num": 16, "start_sec": 146.47, "end_sec": 155.34714285714287, "confidence": 67.05882352941177, "canonical_text": "Jákob nemzette Józsefet, Máriának a férjét, aki a Krisztusnak nevezett Jézust szülte.", "matched_text": "Jákob pedig nemzette Józsefet, a férjét Máriának, akit ő született Jézus, akit Krisztu"}, {"verse_num": 17, "start_sec": 153.98142857142858, "end_sec": 178.71310344827586, "confidence": 64.51612903225806, "canonical_text": "Így a nemzedékek száma: Ábrahámtól Dávidig tizennégy nemzedék, Dávidtól a Babilonba való elhurcolásig tizennégy nemzedék, és a Babilonba való elhurcolástól Krisztusig tizennégy nemzedék.", "matched_text": "t Krisztusnak neveznek. Tehát az összes nemzedékek száma Ábrahámtól Dávidig 14 nemzedék, Dávidtól a babiloni fogságig 14 nemzedék, a babiloni fogságtól Krisztusig 14 nemzedék. Jézus Krisz"}, {"verse_num": 18, "start_sec": 174.87666666666667, "end_sec": 192.27724137931037, "confidence": 72.12121212121212, "canonical_text": "Jézus Krisztus születésének ez a története: Anyja, Mária, Józsefnek a jegyese, még mielőtt egybekeltek volna, úgy találtatott, hogy gyermeket fogant a Szentlélektől.", "matched_text": ". Jézus Krisztus születése pedig így történt. Amikor Jézus anyja, Mária, már jegyese volt Józsefnek, még mielőtt egybe keltek volna, úgy találtatott, hogy áldott álla"}, {"verse_num": 19, "start_sec": 193.5103448275862, "end_sec": 207.28155555555557, "confidence": 52.34375, "canonical_text": "Férje, József igaz ember volt, nem akarta a nyilvánosság előtt megszégyeníteni, ezért úgy határozott, hogy titokban bocsátja el.", "matched_text": "Lélek től. József pedig, az ő férje, mivel igaz ember volt, és nem akarta őt meghurcolni, titokban akarta elbocsátani. Miközben"}, {"verse_num": 20, "start_sec": 205.4964705882353, "end_sec": 225.41355555555558, "confidence": 65.07936507936508, "canonical_text": "Míg ezen töprengett, megjelent neki álmában az Úr angyala, és így szólt hozzá: \"József, Dávid fia, ne félj magadhoz venni feleségedet Máriát, hiszen a benne fogant élet a Szentlélektől van!", "matched_text": ". Miközben erről gondolkodott, íme, álomban megjelent neki az úrangyala, és ezt mondta, József, Dávid fia, ne féld feleségül venni Máriát, ami ugyanis benne született, a Szent Lélektől van."}, {"verse_num": 21, "start_sec": 228.77133333333336, "end_sec": 238.646875, "confidence": 56.00000000000001, "canonical_text": "Fiút szül, akit Jézusnak nevezel el, mert ő szabadítja meg népét bűneitől.\"", "matched_text": "snak fogod hívni a nevét. Ő ugyanis megszabadítja majd a népét, bűneitől. Mi"}, {"verse_num": 22, "start_sec": 238.646875, "end_sec": 246.53625, "confidence": 81.25, "canonical_text": "Ezek azért történtek, hogy beteljesedjék, amit az Úr a próféta szavával mondott:", "matched_text": "azért történt, hogy beteljesedjék, amit az úr megmondott a proféta szavával, íme"}, {"verse_num": 23, "start_sec": 247.75, "end_sec": 257.46, "confidence": 71.76470588235294, "canonical_text": "Íme a szűz fogan és fiat szül, Emmánuel lesz a neve. Ez azt jelenti: Velünk az Isten.", "matched_text": "fog an, és fiút szül, és Emmánuelnek fogják hívni, ami azt jelenti, velünk az Isten."}, {"verse_num": 24, "start_sec": 259.02166666666665, "end_sec": 268.34666666666664, "confidence": 61.0, "canonical_text": "József erre fölébredt álmából és úgy tett, ahogy az Úr angyala parancsolta. Magához vette feleségét,", "matched_text": "fölszerkemvén az álomból megtette, amit parancsolt neki az úrangyala. és magához vette a feleségét,"}, {"verse_num": 25, "start_sec": 267.725, "end_sec": 280.19, "confidence": 62.16216216216216, "canonical_text": "de nem ismerte meg, míg világra nem hozta fiát, akinek a Jézus nevet adta.", "matched_text": "és nem ismerte meg őt, amíg megszülte a fiút, és a nevét Jézusnak hívta. ["}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
