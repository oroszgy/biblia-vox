zus azt mondta neki: \"Boldog vagy, Simon, Jónás fia, mert nem a test és vér nyilatkoztatta ki ezt neked, hanem az én mennyei Atyám.", "matched_text": "Jézus mondta neki, boldog vagy Simon, jónás fia, mert nem a test és a vér nyilatkoztatta ki ezt neked, hanem az én atyám, aki a mennyekben"}, {"verse_num": 18, "start_sec": 168.33705882352942, "end_sec": 179.82529411764705, "confidence": 77.06422018348624, "canonical_text": "Én is mondom neked: Péter vagy, erre a sziklára építem egyházamat, s az alvilág kapui sem vesznek rajta erőt.", "matched_text": "is mondom neked, te Péter vagy, és én erre a sziklára fogom építeni egy házamat, és a pokol kapui nem vesznek"}, {"verse_num": 19, "start_sec": 180.91941176470587, "end_sec": 194.59588235294117, "confidence": 75.33333333333333, "canonical_text": "Neked adom a mennyek országa kulcsait. Amit megkötsz a földön, a mennyben is meg lesz kötve, s amit feloldasz a földön, a mennyben is fel lesz oldva.\"", "matched_text": "Neked adom a mennyek országának kulcsait, és amit megkötsz majd a földön, megkötött lesz a mennyekben is, és amit feloldasz a földön, feloldott lesz a"}, {"verse_num": 20, "start_sec": 197.99380952380952, "end_sec": 205.42857142857142, "confidence": 60.0, "canonical_text": "Aztán lelkére kötötte tanítványainak, ne mondják el senkinek, hogy ő a Krisztus.", "matched_text": "ancsolta a tanítványoknak, hogy senkinek el ne mondják, hogy ő a Krisztus. Ettől"}, {"verse_num": 21, "start_sec": 204.85666666666665, "end_sec": 219.72619047619048, "confidence": 82.75862068965517, "canonical_text": "Ettől kezdve Jézus jelezni kezdte tanítványainak: Jeruzsálembe kell mennie, sokat kell szenvednie a vénektől, a főpapoktól és az írástudóktól, megölik, de harmadnap feltámad.", "matched_text": "Ettől kezdve Jézus kezdte föltárni tanítványai előtt, hogy Jeruzsálembe kell mennie, sokat kell szenvedni a vénektől, a főpapoktól és az írástudóktól, meg fogják ölni, de harm"}, {"verse_num": 22, "start_sec": 158.84275862068966, "end_sec": 171.07235294117646, "confidence": 43.58974358974359, "canonical_text": "Péter félrevonta, és szemrehányást tett neki ezekkel a szavakkal: \"Isten mentsen, Uram! Ilyesmi nem történhet veled.\"", "matched_text": "t nem a test és a vér nyilatkoztatta ki ezt neked, hanem az én atyám, aki a mennyekben van. Én is mondom neked, te Pét"}, {"verse_num": 23, "start_sec": 232.77411764705883, "end_sec": 247.31682539682538, "confidence": 51.388888888888886, "canonical_text": "Megfordult és rászólt: \"Távozz tőlem, sátán! Botránkoztatsz, mert nem arra van gondod, amit az Isten akar, hanem arra, amit az emberek akarnak.\"", "matched_text": "megfordult, és mondta Péternek, takarodj előlem, sátán, mert nem az Isten dolgaival törődöl, hanem az emberekével. Akkor Jézus mondta tanítványai"}, {"verse_num": 24, "start_sec": 246.1784126984127, "end_sec": 255.85492063492063, "confidence": 70.75471698113208, "canonical_text": "Ezután Jézus így szólt tanítványaihoz: \"Aki követni akar, tagadja meg magát, vegye keresztjét és kövessen.", "matched_text": "ondta tanítványainak, ha valaki utánam akar jönni, tagadja meg magát, vegye föl a keresztjét, és kövessen e"}, {"verse_num": 25, "start_sec": 255.85492063492063, "end_sec": 264.3930158730159, "confidence": 70.58823529411764, "canonical_text": "Aki meg akarja menteni életét, elveszíti, aki azonban értem elveszíti, az megtalálja.", "matched_text": "rt aki meg akarja menteni az életét, el fogja veszíteni. Aki pedig elveszíti az életét"}, {"verse_num": 26, "start_sec": 268.3774603174603, "end_sec": 282.1226666666667, "confidence": 76.37795275590551, "canonical_text": "Mi haszna van az embernek, ha az egész világot megszerzi is, de lelke kárát vallja? Mit is adhatna az ember cserébe a lelkéért?", "matched_text": "mit használ az embernek, ha megnyeri az egész világot, a lelke pedig kárát látja? Vagy mit adhat az ember cserébe a lelkéért? Me"}, {"verse_num": 27, "start_sec": 282.88533333333334, "end_sec": 292.8, "confidence": 66.97247706422019, "canonical_text": "Eljön ugyanis az Emberfia Atyja dicsőségében, angyalai kíséretében, és megfizet mindenkinek a tettei szerint.", "matched_text": "mberfia eljön, Atya dicsőségében, angyalaival együtt, és akkor majd megfizet kinek-kinek cselekedetei szerint."}, {"verse_num": 28, "start_sec": 293.34, "end_sec": 306.1591304347826, "confidence": 59.166666666666664, "canonical_text": "Bizony mondom nektek: az itt állók közül némelyek nem halnak meg, amíg nem látják az Emberfiát, amint eljön országában.\"", "matched_text": "Bizony mondom nektek, vannak néhányan az itt állók között, akik nem fogják megízlelni a halált, amíg meg nem látják az or"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
