k, a gonosz lelkek fejedelmének nevében űzi ki a gonosz lelkeket.\"", "matched_text": "án ezt mondták, ez nem űz másként ördögöt, csak Belzebúllal, az ördögök fejedelmével. Mivel pedig Jézus ismerte a gondolataik"}, {"verse_num": 25, "start_sec": 224.26, "end_sec": 239.72875, "confidence": 62.576687116564415, "canonical_text": "Jézus belelátott gondolataikba és így szólt hozzájuk: \"Minden önmagával meghasonlott ország elnéptelenedik, minden önmagával meghasonlott város vagy ház elpusztul.", "matched_text": "l pedig Jézus ismerte a gondolataikat, mondta nekik, minden önmagával meghasonlott ország elvész, És egyetlen meghasonlott város vagy ház nem maradhat fenn. És ha a"}, {"verse_num": 26, "start_sec": 240.96625, "end_sec": 249.01, "confidence": 66.26506024096386, "canonical_text": "Ha a sátánt sátán űzi ki, meghasonlik magával. Hogyan állhat fenn akkor az országa?", "matched_text": "a sátánt, akkor meghasonlott önmagával. Tehát, hogyan fog fennmaradni az ő országa?"}, {"verse_num": 27, "start_sec": 246.535, "end_sec": 262.4109375, "confidence": 59.66386554621849, "canonical_text": "Ha én Belzebul segítségével űzöm ki a gonosz lelkeket, a fiaitok kinek a segítségével űzik ki? Így ők lesznek bíráitok.", "matched_text": "ni az ő országa? És ha én, Belzebullan üzöm az ördögöket, a fiaitok, kivel üzik ki őket, ezért ők lesznek a bíráitok. Ha"}, {"verse_num": 28, "start_sec": 261.0003125, "end_sec": 272.3831578947368, "confidence": 77.55102040816327, "canonical_text": "De ha én Isten Lelkével űzöm ki a gonosz lelkeket, akkor már elérkezett hozzátok az Isten országa.", "matched_text": "ok. Ha azonban én Isten lelkével űzöm az ördögöket, akkor elérkezett hozzátok az Isten országa. Vag"}, {"verse_num": 29, "start_sec": 272.9863157894737, "end_sec": 287.46210526315787, "confidence": 81.3953488372093, "canonical_text": "Hogy törhet be valaki az erős ember házába, s hogy rabolhatja el vagyonát, hacsak előbb meg nem kötözi? Akkor kifoszthatja házát.", "matched_text": "et be va ": 35, "start_sec": 347.09155172413796, "end_sec": 357.6212068965517, "confidence": 95.18072289156626, "canonical_text": "A jó ember jó kincséből jót hoz elő, a rossz ember rossz kincséből rosszat hoz elő.", "matched_text": "A jó ember jó kincséből jót hoz elő. A rossz ember rossz kincséből rosszakat hoz elő"}, {"verse_num": 36, "start_sec": 362.88603448275865, "end_sec": 374.0737931034483, "confidence": 50.0, "canonical_text": "Mondom nektek: az emberek az ítélet napján minden fölösleges szóról számot adnak, amit kiejtenek a szájukon.", "matched_text": "ondanak az emberek, számot fognak adni az ítélet napján. Mert szavaid szerint igazulsz meg, és szavaid alapjá"}, {"verse_num": 37, "start_sec": 368.80896551724135, "end_sec": 376.06333333333333, "confidence": 69.86301369863014, "canonical_text": "Szavaid alapján igazulsz meg, és szavaid alapján vonsz magadra ítéletet.\"", "matched_text": "ert szavaid szerint igazulsz meg, és szavaid alapján fognak elítélni. Akko"}, {"verse_num": 38, "start_sec": 376.6766666666667, "end_sec": 384.65, "confidence": 69.6629213483146, "canonical_text": "Ekkor néhány írástudó és farizeus így szólt hozzá: \"Mester, jelt szeretnénk tőled látni.\"", "matched_text": "eki némelyek az írástudók és farizeusok közül mondván, Mester, jelet akarunk tőled látni."}, {"verse_num": 39, "start_sec": 386.49, "end_sec": 398.13166666666666, "confidence": 77.14285714285715, "canonical_text": "\"A gonosz és házasságtörő nemzedék jelet kíván - válaszolta -, de nem kap mást, csak Jónás próféta jelét.", "matched_text": ", a gonosz és házasságtörő nemzedék jelet kíván, és nem adatik neki más jel, csak Jónás proféta jele. Mert"}, {"verse_num": 40, "start_sec": 398.13166666666666, "end_sec": 414.4073076923077, "confidence": 64.28571428571428, "canonical_text": "Amint ugyanis Jónás próféta három nap és három éjjel volt a hal gyomrában, úgy lesz az Emberfia is három nap és három éjjel a föld szívében.", "matched_text": "miként Jónás a Cethal gyomrában volt három nap és három éjjel, úgy lesz az emberfia a föld szívében három nap és három éjjel. A ninivei férfi"}, {"verse_num": 41, "start_sec": 411.36833333333334, "end_sec": 429.3369230769231, "confidence": 77.48344370860927, "canonical_text": "A ninivei férfiak feltámadnak az ítéletkor ezzel a nemzedékkel, és elítélik, mert ők bűnbánatot tartottak Jónás szavára, s itt nagyobb van, mint Jónás.", "matched_text": "A ninivei férfiak föltámadnak majd az ítéletkor ezzel a nemzedékkel együtt, és elfogják ítélni, mert ők bűnbánatot tartottak Jónás prédikációjára, És í"}, {"verse_num": 42, "start_sec": 431.6942307692308, "end_sec": 451.33714285714285, "confidence": 83.24022346368716, "canonical_text": "Dél királynője feltámad majd az ítéletkor ezzel a nemzedékkel, és elítéli, mert ő eljött a föld végső határáról, hogy hallja Salamon bölcsességét, s itt nagyobb van, mint Salamon.", "matched_text": "t. Délkirálynője, föltámad majd az ítéletkor ezzel a nemzedékkel együtt, és elfogja ítélni, mert ő eljött a föld határáról, hogy hallja Salomon bölcsességét, és íme, Salamonnál nag"}, {"verse_num": 43, "start_sec": 453.7298214285714, "end_sec": 464.4469642857143, "confidence": 83.83838383838383, "canonical_text": "Amikor a tisztátalan lélek kimegy az emberből, sivár helyeken bolyong, nyugtot keres, de nem talál.", "matched_text": "a tisztátalan lélek, Kimegy az emberből, vizetlen helyeken bolyong, és nyugalmat keres, de nem talá"}, {"verse_num": 44, "start_sec": 466.45642857142855, "end_sec": 475.1641071428571, "confidence": 65.0, "canonical_text": "Azt mondja hát: Visszatérek elhagyott házamba. Amikor odaér, üresen, kisöpörve, feldíszítve találja.", "matched_text": "szatérek a házamba, ahonnét kijöttem. És odaérve üresen, tisztára kisöpörve, és feldiszítve találja."}, {"verse_num": 45, "start_sec": 473.82446428571427, "end_sec": 498.4296, "confidence": 67.48768472906403, "canonical_text": "Erre nyomban elsiet, s hoz magával hét más lelket, magánál is gonoszabbat. Bemennek és ott laknak. Ennek az embernek a sorsa most rosszabb, mint előbb volt. Hasonló sors vár erre a gonosz nemzedékre is.\"", "matched_text": "e találja. Akkor megy, maga mellé vesz hét másik, magánál gonoszabb lelket, bemennek, és ott laknak. És annak az embernek most rosszabb, mint korábban volt. Így jár majd ez a nagyon gonosz nemzedék is. Mi"}, {"verse_num": 46, "start_sec": 497.8, "end_sec": 505.9848, "confidence": 63.74999999999999, "canonical_text": "Amíg beszélt a néphez, megálltak kint anyja és rokonai, s beszélni akartak vele.", "matched_text": "ben beszélt, íme anyja és testvérei kívül megálltak, és beszélni akartak vele. Mo"}, {"verse_num": 47, "start_sec": 505.9848, "end_sec": 514.2395652173913, "confidence": 65.4320987654321, "canonical_text": "Valaki szólt neki: \"Anyád és rokonaid kint állnak és beszélni szeretnének veled.\"", "matched_text": "neki valaki, íme anyád és testvéreid odakin állnak, és beszélni akarnak veled. Err"}, {"verse_num": 48, "start_sec": 513.63, "end_sec": 522.7734782608695, "confidence": 52.17391304347826, "canonical_text": "De ő megkérdezte azt, aki szólt neki: \"Ki az anyám s kik a rokonaim?\"", "matched_text": "e ő a hozzászólónak mondta, ki az én anyám, és kik az én testvéreim? É"}, {"verse_num": 49, "start_sec": 521.554347826087, "end_sec": 531.3073913043478, "confidence": 66.66666666666667, "canonical_text": "Aztán kitárta tanítványai felé karját, s így szólt: \"Ezek az anyám és testvéreim!", "matched_text": "És kitárva karját a tanítványai felé mondta, íme az én anyám és az én testvéreim."}, {"verse_num": 50, "start_sec": 535.574347826087, "end_sec": 542.77, "confidence": 68.45637583892618, "canonical_text": "Aki teljesíti mennyei Atyám akaratát, az nekem mind testvérem, nővérem és anyám.\"", "matched_text": "ki a mennyekben van, az nekem testvérem, nővérem és anyám. [Silence]"}]};

            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
