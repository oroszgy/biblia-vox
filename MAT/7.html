sz fa pedig rossz gyümölcsöt t"}, {"verse_num": 18, "start_sec": 179.0130769230769, "end_sec": 186.61615384615385, "confidence": 80.3030303030303, "canonical_text": "Nem hozhat a jó fa rossz gyümölcsöt, sem a rossz fa jó gyümölcsöt.", "matched_text": "et a jó fa rossz gyümölcsöt, sem a rossz fa nem teremhet jó gyümölc"}, {"verse_num": 19, "start_sec": 184.44384615384615, "end_sec": 190.4176923076923, "confidence": 65.67164179104478, "canonical_text": "Kivágnak és tűzre vetnek minden fát, amely nem terem jó gyümölcsöt.", "matched_text": "nem teremhet jó gyümölcsöt. Minden fát, amely nem hoz jó gyümölcsöt,"}, {"verse_num": 20, "start_sec": 193.04, "end_sec": 197.25, "confidence": 90.0, "canonical_text": "Tehát gyümölcseikről ismeritek fel őket.", "matched_text": "Tehát a gyümölcseikről ismeritek meg őket"}, {"verse_num": 21, "start_sec": 200.4316, "end_sec": 216.12444444444444, "confidence": 74.68354430379746, "canonical_text": "Nem jut be mindenki a mennyek országába, aki mondja nekem: - Uram, Uram! Csak az, aki teljesíti mennyei Atyám akaratát. Sokan mondják majd nekem azon a napon:", "matched_text": "e a mennyek országába, aki mondja nekem, Uram, Uram, hanem csak az, aki megteszi az én atyám akaratát, aki a mennyekben van. Sokan mondják majd nekem azon a na"}, {"verse_num": 22, "start_sec": 216.12444444444444, "end_sec": 226.79333333333335, "confidence": 69.91869918699187, "canonical_text": "Uram, Uram, hát nem a te nevedben jövendöltünk? Nem a te nevedben űztünk ördögöt? Nem a te nevedben tettünk annyi csodát? -", "matched_text": "Uram, Uram, nem, de a te nevedben profétáltunk. A te nevedben űztünk ördögöket, és a te nevedben sok csoda jelettettünk. Akk"}, {"verse_num": 23, "start_sec": 225.20222222222222, "end_sec": 236.96666666666667, "confidence": 71.73913043478262, "canonical_text": "Akkor kijelentem nekik: Sosem ismertelek benneteket. Távozzatok színem elől, ti gonosztevők!", "matched_text": "Akkor majd megvallom nekik, soha nem ismertelek titeket, távozzatok tőlem, ti gonosztevők. M"}, {"verse_num": 24, "start_sec": 237.64333333333332, "end_sec": 248.47, "confidence": 61.53846153846154, "canonical_text": "Aki hallgatja szavamat, és tettekre is váltja, az okos emberhez hasonlít, aki sziklára építette a házát.", "matched_text": "llja ezeket az igéimet, és megteszi, amit hallott. Hasonlít a bölcs emberhez, aki sziklára építette házát"}, {"verse_num": 25, "start_sec": 250.25565217391303, "end_sec": 262.18, "confidence": 61.01694915254237, "canonical_text": "Szakadt a zápor, ömlött az ár, süvített a szél, és nekizúdult a háznak, de nem dőlt össze, mert szikla volt az alapja.", "matched_text": "kadt az eső, és jöttek a patakok, föltámadtak a viharos szelek, és rátörtek a házra, nem dőlt össze, mert sziklára alap"}, {"verse_num": 26, "start_sec": 263.47285714285715, "end_sec": 275.3071428571429, "confidence": 61.261261261261254, "canonical_text": "Aki hallgatja ugyan tanításomat, de nem váltja tettekre, a balga emberhez hasonlít, aki házát homokra építette.", "matched_text": ", aki hallja ezeket az igéimet, de nem teszi meg, amit hallott. Hasonlít a balga emberhez, aki homokra építette"}, {"verse_num": 27, "start_sec": 277.4960869565217, "end_sec": 288.0039130434783, "confidence": 53.77358490566038, "canonical_text": "Szakadt a zápor, ömlött az ár, süvített a szél, és nekizúdult a háznak. Az összedőlt és romhalmazzá vált.\"", "matched_text": "zakadt az eső, és jöttek a patakok, föltámadtak a viharos szelek, és rátörtek a házra, összedőlt, és nagy l"}, {"verse_num": 28, "start_sec": 293.56, "end_sec": 300.66, "confidence": 64.61538461538461, "canonical_text": "Ezzel Jézus befejezte ezeket a beszédeket. A nép ámult tanításán,", "matched_text": "ézus befejezte ezeket az igéket, a sokaság csodálkozott a tanításá"}, {"verse_num": 29, "start_sec": 302.77882352941174, "end_sec": 310.66, "confidence": 80.82191780821918, "canonical_text": "mert úgy tanított, mint akinek hatalma van, s nem úgy, mint az írástudók.", "matched_text": "ket olyan volt, mint akinek hatalma van, és nem olyan, mint az ő irástudói"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
