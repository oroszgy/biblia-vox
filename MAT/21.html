nik. És bármit kértek majd hittel,"}, {"verse_num": 22, "start_sec": 253.5862222222222, "end_sec": 257.74577777777773, "confidence": 79.59183673469387, "canonical_text": "Bármit kértek hittel az imádságban, megkapjátok.\"", "matched_text": "ármit kértek majd hittel, imádságban, meg fogjátok"}, {"verse_num": 23, "start_sec": 257.74577777777773, "end_sec": 275.7547619047619, "confidence": 69.00584795321637, "canonical_text": "Amikor a templomba érve tanított, odamentek hozzá az írástudók és a nép vénei és megkérdezték: \"Miféle hatalom birtokában teszed te ezeket? Ki adott neked hatalmat ehhez?\"", "matched_text": "És amikor bement a templomba és tanított, oda jöttek hozzá a főpapok és a nép vénei, mondván, miféle hatalommal teszed ezeket? És ki adta neked ezt a hatalmat? Felelvén pe"}, {"verse_num": 24, "start_sec": 275.7547619047619, "end_sec": 287.62454545454545, "confidence": 71.21212121212122, "canonical_text": "Jézus így válaszolt: \"Én is kérdezek tőletek valamit. - Ha megfeleltek rá, én is megmondom, milyen hatalom birtokában teszem ezeket.", "matched_text": "Jézus mondta nekik, én is kérdezek tőletek valamit, amit ha megmondodok nekem, én is megmondom, miféle hatalommal teszem ezeket. Jáno"}, {"verse_num": 25, "start_sec": 288.2390909090909, "end_sec": 306.12, "confidence": 76.53631284916202, "canonical_text": "Honnan volt János keresztsége? Az égből vagy az emberektől?\" Azok tanakodni kezdtek egymás közt: \"Ha azt mondjuk, hogy az égből, azt fogja kérdezni: Akkor miért nem hittetek neki?", "matched_text": "honnan való volt? Az égből, vagy az emberek közül? Erre azok tanakodni kezdtek egymás között mondván, ha azt mondjuk az égből, azt fogja válaszolni, tehát miért nem hittetek neki?"}, {"verse_num": 26, "start_sec": 305.5125, "end_sec": 315.84, "confidence": 75.75757575757575, "canonical_text": "Ha azt mondjuk, hogy az emberektől, félnünk kell a néptől, hisz Jánost mindenki prófétának tartja.\"", "matched_text": "i? Ha pedig azt mondjuk az emberektől, félün  32, "start_sec": 374.8966101694915, "end_sec": 396.8530434782609, "confidence": 72.82051282051283, "canonical_text": "Eljött ugyanis hozzátok János, hogy az igazság útjára vezessen benneteket, de nem hittetek neki. A vámosok és a cédák hittek neki. De ti ennek láttára sem tartottatok bűnbánatot és nem hittetek.\"", "matched_text": "gába. Eljött ugyanis hozzátok János az igazság útján, és nem hittetek neki, de a vámosok és az utca nők hittek neki. Ti pedig ezt látván, később sem tartottatok bűnbánatot, hogy higgyetek neki. Ha"}, {"verse_num": 33, "start_sec": 394.15864406779656, "end_sec": 416.092, "confidence": 73.76237623762376, "canonical_text": "\"Halljatok egy másik példabeszédet. Volt egy gazda, aki szőlőt telepített. Bekerítette sövénnyel, belül pedig sajtót ásott és őrtornyot épített. Aztán bérbe adta a szőlőt műveseknek, és elment idegenbe.", "matched_text": ". Halljatok egy másik példabeszédet. Volt egy családfő, aki szőlőt telepített, sövényel bekerítette, Prést vágott benne, őrtornyot épített, majd bérbeadta szőlőműveseknek, és elutazott messzeföldre. Amik"}, {"verse_num": 34, "start_sec": 416.804, "end_sec": 425.348, "confidence": 79.56989247311827, "canonical_text": "Amikor eljött a szüret ideje, elküldte szolgáit a szőlőművesekhez, hogy szedjék be a termést.", "matched_text": "elgett a szőlőérés ideje, elküldte szolgáit a szőlőművesekhez, hogy átvegyék a szőlőtermését."}, {"verse_num": 35, "start_sec": 426.772, "end_sec": 437.5733333333333, "confidence": 74.31192660550458, "canonical_text": "Ám a szőlőművesek nekiestek a szolgáknak. Az egyiket megverték, a másikat megölték, a harmadikat megkövezték.", "matched_text": "zonban megragadták a szolgákat, és az egyiket megverték, A másikat meggyilkolták, a harmadikat megköveszték. I"}, {"verse_num": 36, "start_sec": 436.94, "end_sec": 444.54, "confidence": 81.33333333333333, "canonical_text": "Erre más szolgákat küldött, többet, mint először, de ezekkel is úgy bántak.", "matched_text": "ét más szolgákat kül             // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
