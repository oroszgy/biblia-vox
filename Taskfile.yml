version: '3'

vars:
  PACKAGE: bibliavox

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check {{.PACKAGE}}/ tests/

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format {{.PACKAGE}}/ tests/

  format-check:
    desc: Check formatting without modifying
    cmds:
      - uv run ruff format --check {{.PACKAGE}}/ tests/

  typecheck:
    desc: Run ty type checker
    cmds:
      - uv run ty check {{.PACKAGE}}/

  test:
    desc: Run test suite
    cmds:
      - uv run pytest tests/ -x -v

  test-cov:
    desc: Run tests with coverage
    cmds:
      - uv run pytest tests/ -x -v --cov={{.PACKAGE}} --cov-report=term-missing

  quality:
    desc: Run all quality checks (lint + format-check + typecheck + test)
    cmds:
      - task: lint
      - task: format-check
      - task: typecheck
      - task: test

  reference:generate:
    desc: Generate reference data JSON from szentiras.eu source
    cmds:
      - uv run bibliavox reference generate
    status:
      - test -f data/reference/books.json
      - test -f data/reference/versification.json

  text:fetch:
    desc: Download SZIT Bible JSON from GitHub
    cmds:
      - mkdir -p data/raw/text
      - curl -L -o data/raw/text/H_Kaldi_SZIT.json https://raw.githubusercontent.com/peterpolgar/Biblia-json-xml/main/bibles_json_dict/full_bibles/H_Kaldi_SZIT.json
    status:
      - test -f data/raw/text/H_Kaldi_SZIT.json

  text:test:
    desc: Test text fetch with sample chapter
    cmds:
      - uv run bibliavox text fetch --book GEN --chapter 1
    deps: [text:fetch]

  text:normalize:
    desc: Normalize all Bible text
    cmds:
      - uv run bibliavox text normalize --all
    deps: [text:fetch]

  text:validate:
    desc: Validate verse counts against versification schema
    cmds:
      - uv run bibliavox text validate --all
    deps: [text:fetch]

  text:convert-jsonl:
    desc: Convert SZIT JSON to JSONL format with USX codes
    cmds:
      - mkdir -p data/processed/text
      - uv run bibliavox text convert-jsonl
    status:
      - test -f data/processed/text/szit.jsonl
    deps: [text:fetch]

  sync:
    desc: Install/sync dependencies
    cmds:
      - uv sync

  clean:
    desc: Clean generated files and caches
    cmds:
      - rm -rf data/.cache/
      - rm -rf data/reference/*.json
      - rm -rf .pytest_cache/
      - rm -rf __pycache__/ {{.PACKAGE}}/__pycache__/ tests/__pycache__/
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
