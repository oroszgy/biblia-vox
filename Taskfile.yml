version: '3'

vars:
  PACKAGE: bibliavox

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check {{.PACKAGE}}/ tests/

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format {{.PACKAGE}}/ tests/

  format-check:
    desc: Check formatting without modifying
    cmds:
      - uv run ruff format --check {{.PACKAGE}}/ tests/

  typecheck:
    desc: Run ty type checker
    cmds:
      - uv run ty check {{.PACKAGE}}/

  test:
    desc: Run test suite
    cmds:
      - uv run pytest tests/ -x -v

  test-cov:
    desc: Run tests with coverage
    cmds:
      - uv run pytest tests/ -x -v --cov={{.PACKAGE}} --cov-report=term-missing

  quality:
    desc: Run all quality checks (lint + format-check + typecheck + test)
    cmds:
      - task: lint
      - task: format-check
      - task: typecheck
      - task: test

  reference:generate:
    desc: Generate reference data JSON from szentiras.eu source
    cmds:
      - uv run bibliavox reference generate
    status:
      - test -f data/reference/books.json
      - test -f data/reference/versification.json

  experiment:text-fetch:
    desc: "[EXPERIMENTAL] Download SZIT Bible JSON from GitHub"
    cmds:
      - mkdir -p data/raw/text
      - curl -L -o data/raw/text/H_Kaldi_SZIT.json https://raw.githubusercontent.com/peterpolgar/Biblia-json-xml/main/bibles_json_dict/full_bibles/H_Kaldi_SZIT.json
    status:
      - test -f data/raw/text/H_Kaldi_SZIT.json

  experiment:text-test:
    desc: "[EXPERIMENTAL] Test text fetch with sample chapter"
    cmds:
      - uv run bibliavox text fetch --book GEN --chapter 1
    deps: [experiment:text-fetch]

  experiment:text-normalize:
    desc: "[EXPERIMENTAL] Normalize all Bible text"
    cmds:
      - uv run bibliavox text normalize --all
    deps: [experiment:text-fetch]

  experiment:text-validate:
    desc: "[EXPERIMENTAL] Validate verse counts against versification schema"
    cmds:
      - uv run bibliavox text validate --all --strict-missing-chapters
    deps: [experiment:text-fetch]

  data:coverage:
    desc: Strict coverage audit with known source gap policy
    cmds:
      - uv run bibliavox data coverage --allow-known-source-gaps --fail-on-unclassified

  experiment:text-convert-jsonl:
    desc: "[EXPERIMENTAL] Convert SZIT JSON to JSONL format with USX codes"
    cmds:
      - mkdir -p data/processed/text
      - uv run bibliavox text convert-jsonl
    status:
      - test -f data/processed/text/szit.jsonl
    deps: [experiment:text-fetch]

  experiment:text-fix-verses:
    desc: "[EXPERIMENTAL] Fix embedded verse markers in JSONL"
    cmds:
      - uv run bibliavox text fix-verses
    status:
      - test -f data/processed/text/szit-fixed.jsonl
    deps: [experiment:text-convert-jsonl]

  text:ingest-mek:
    desc: Download and parse MEK HTML text into processed JSONL corpus
    cmds:
      - mkdir -p data/processed/text
      - uv run bibliavox text ingest-mek
    status:
      - test -f data/processed/text/mek.jsonl

  experiment:text-cross-validate:
    desc: "[EXPERIMENTAL] Cross-validate SZIT vs MEK corpora"
    cmds:
      - uv run bibliavox text cross-validate
    deps: [experiment:text-fix-verses, text:ingest-mek]

  # NOTE: go-task parses task-level flags itself, so command flags like
  # `task audio:download --book GEN --chapter 1` are not supported.
  # Use task vars (BOOK/CHAPTER/WORKERS) intentionally for this contract.
  audio:download:
    desc: Download a single chapter MP3 (requires BOOK and CHAPTER vars)
    cmds:
      - uv run bibliavox audio download --book {{.BOOK}} --chapter {{.CHAPTER}}{{if .FORCE}} --force{{end}}

  audio:download-all:
    desc: Download all available chapter MP3s from playlist (WORKERS var optional, default 4)
    vars:
      WORKERS: '{{default "4" .WORKERS}}'
    cmds:
      - uv run bibliavox audio download --all --workers {{.WORKERS}}{{if .FORCE}} --force{{end}}

  audio:download-nt:
    desc: Download all New Testament chapter MP3s
    vars:
      WORKERS: '{{default "4" .WORKERS}}'
    cmds:
      - uv run bibliavox audio download --all --testament NT --workers {{.WORKERS}}{{if .FORCE}} --force{{end}}

  audio:convert:
    desc: Convert one chapter MP3 to 16kHz mono PCM WAV (requires BOOK/CHAPTER vars and ffmpeg+ffprobe)
    deps: [audio:download]
    cmds:
      - uv run bibliavox audio convert --book {{.BOOK}} --chapter {{.CHAPTER}}{{if .FORCE}} --force{{end}}

  audio:convert-all:
    desc: Convert downloaded MP3 batch to WAV; idempotent unless FORCE=true (requires ffmpeg+ffprobe)
    deps: [audio:download-all]
    cmds:
      - uv run bibliavox audio convert-all{{if .FORCE}} --force{{end}}

  audio:convert-nt:
    desc: Convert downloaded NT MP3s to WAV
    cmds:
      - uv run bibliavox audio convert-all --testament NT{{if .FORCE}} --force{{end}}

  audio:info:
    desc: Inspect chapter audio metadata (requires ffprobe)
    deps: [audio:download]
    cmds:
      - uv run bibliavox audio info --book {{.BOOK}} --chapter {{.CHAPTER}}

  audio:prepare:
    desc: Prepare chapter artifacts (wav + meta + index) from raw MP3
    deps: [audio:download]
    cmds:
      - uv run bibliavox audio prepare --book {{.BOOK}} --chapter {{.CHAPTER}}{{if .FORCE}} --force{{end}}

  audio:prepare-all:
    desc: Prepare all downloaded chapters; idempotent unless FORCE=true
    deps: [audio:download-all]
    cmds:
      - uv run bibliavox audio prepare-all{{if .FORCE}} --force{{end}}

  audio:prepare-nt:
    desc: Prepare all NT chapter artifacts (wav + meta + index)
    cmds:
      - uv run bibliavox audio prepare-all --testament NT{{if .FORCE}} --force{{end}}

  audio:seek:
    desc: Write WAV preview window from prepared seek index
    deps: [audio:prepare]
    cmds:
      - uv run bibliavox audio seek --book {{.BOOK}} --chapter {{.CHAPTER}} --seconds {{.SECONDS}} --duration-sec {{.DURATION_SEC}} --output {{.OUTPUT}}{{if .FORCE}} --force{{end}}

  align:setup:
    desc: Pre-download model weights specified in the gauntlet configuration
    cmds:
      - uv run bibliavox align setup

  align:evaluate-gold:
    desc: Run transcription, alignment, and metrics calculation on 10 gold chapters in Docker with GPU acceleration
    deps:
      - text:ingest-mek
      - audio:download-all
      - audio:convert-all
      - audio:prepare-all
    cmds:
      - docker compose run --rm align python -m bibliavox.main align evaluate-gold {{if .MODEL}}--model "{{.MODEL}}"{{end}}

  align:vibevoice:
    desc: Run VibeVoice alignment on a chapter (requires BOOK/CHAPTER vars)
    cmds:
      - docker compose run --rm vibevoice python -m bibliavox.main align vibevoice --book {{.BOOK}} --chapter {{.CHAPTER}} --path both

  align:evaluate:
    desc: Evaluate and compare alignment approaches (use --gold for gold chapters)
    cmds:
      - docker compose run --rm align python -m bibliavox.main align evaluate {{if .BOOK}}--book {{.BOOK}}{{end}} {{if .CHAPTER}}--chapter {{.CHAPTER}}{{end}} {{if .GOLD}}--gold{{end}}

  export:fetch-text:
    desc: Ensure canonical text corpus is available (mek.jsonl)
    cmds:
      - task: text:ingest-mek
    status:
      - test -f data/processed/text/mek.jsonl

  export:prepare-audio:
    desc: Prepare audio for all chapters (download + convert + index)
    cmds:
      - task: audio:prepare-all

  export:align:
    desc: Run alignment on all prepared chapters in Docker with GPU
    cmds:
      - docker compose run --rm align python -m bibliavox.main align run-all {{if .MODEL}}--model "{{.MODEL}}"{{end}}{{if .FORCE}} --force{{end}}

  export:align-nt:
    desc: Run alignment on all NT prepared chapters in Docker with GPU
    cmds:
      - docker compose run --rm align python -m bibliavox.main align run-all --testament NT{{if .MODEL}} --model "{{.MODEL}}"{{end}}{{if .FORCE}} --force{{end}}

  export:align-gold:
    desc: Run alignment on gold chapters only (for evaluation)
    cmds:
      - docker compose run --rm align python -m bibliavox.main align evaluate-gold {{if .MODEL}}--model "{{.MODEL}}"{{end}}

  export:jsonl:
    desc: Export alignment results to JSONL (use GOLD=true for gold chapters only)
    vars:
      MODEL: '{{default "microsoft/VibeVoice-ASR-HF" .MODEL}}'
    cmds:
      - uv run bibliavox export jsonl {{if .GOLD}}--gold{{end}} --model "{{.MODEL}}"{{if .FORCE}} --force{{end}}
    deps:
      - export:fetch-text

  export:run:
    desc: Run full pipeline on all chapters (text → audio → align → export)
    vars:
      MODEL: '{{default "microsoft/VibeVoice-ASR-HF" .MODEL}}'
    cmds:
      - task: export:jsonl
        vars:
          MODEL: "{{.MODEL}}"
          FORCE: "{{.FORCE}}"
          GOLD: "{{.GOLD}}"
    deps:
      - export:prepare-audio
      - task: export:align
        vars:
          MODEL: "{{.MODEL}}"

  export:run-nt:
    desc: Run full pipeline on New Testament only (text → audio → align → export)
    vars:
      MODEL: '{{default "microsoft/VibeVoice-ASR-HF" .MODEL}}'
    cmds:
      - task: export:jsonl
        vars:
          MODEL: "{{.MODEL}}"
          FORCE: "{{.FORCE}}"
    deps:
      - audio:prepare-nt
      - task: export:align-nt
        vars:
          MODEL: "{{.MODEL}}"

  export:run-gold:
    desc: Run full pipeline on gold chapters only (for evaluation)
    vars:
      MODEL: '{{default "microsoft/VibeVoice-ASR-HF" .MODEL}}'
    cmds:
      - task: export:jsonl
        vars:
          MODEL: "{{.MODEL}}"
          FORCE: "{{.FORCE}}"
          GOLD: "true"
    deps:
      - export:prepare-audio
      - task: export:align-gold
        vars:
          MODEL: "{{.MODEL}}"

  sync:
    desc: Install/sync dependencies
    cmds:
      - uv sync

  clean:python:
    desc: Clear Python caches and test artifacts only
    cmds:
      - rm -rf .pytest_cache/
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

  clean:processed:
    desc: Clear prepared, and processed pipeline outputs (JSONL, evaluation, alignment, export, MP3s, WAVs, model caches)
    cmds:
      - rm -rf data/processed/
      - rm -rf data/aligned/
      - rm -rf data/export/
      - rm -rf data/evaluation/
      - rm -rf data/prepared/

  clean:raw:
    desc: Clear raw downloads
    cmds:
      - rm -rf data/raw/

  clean:cache:
    desc: Clear caches (huggingface, torch, general) - use if you want to free up disk but keep processed data
    cmds:
      - rm -rf data/.hf-cache/
      - rm -rf data/.torch-cache/
      - rm -rf data/.cache/

  clean:all:
    desc: Clear all generated data (reference data is git-versioned, preserved)
    deps: [clean:processed, clean:raw, clean:cache, clean:python]
