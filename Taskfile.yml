version: '3'

vars:
  PACKAGE: bibliavox

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:
    desc: Run ruff linter
    cmds:
      - uv run ruff check {{.PACKAGE}}/ tests/

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format {{.PACKAGE}}/ tests/

  format-check:
    desc: Check formatting without modifying
    cmds:
      - uv run ruff format --check {{.PACKAGE}}/ tests/

  typecheck:
    desc: Run ty type checker
    cmds:
      - uv run ty check {{.PACKAGE}}/

  test:
    desc: Run test suite
    cmds:
      - uv run pytest tests/ -x -v

  test-cov:
    desc: Run tests with coverage
    cmds:
      - uv run pytest tests/ -x -v --cov={{.PACKAGE}} --cov-report=term-missing

  quality:
    desc: Run all quality checks (lint + format-check + typecheck + test)
    cmds:
      - task: lint
      - task: format-check
      - task: typecheck
      - task: test

  reference:generate:
    desc: Generate reference data JSON from szentiras.eu source
    cmds:
      - uv run bibliavox reference generate
    status:
      - test -f data/reference/books.json
      - test -f data/reference/versification.json

  text:fetch:
    desc: Download SZIT Bible JSON from GitHub
    cmds:
      - mkdir -p data/raw/text
      - curl -L -o data/raw/text/H_Kaldi_SZIT.json https://raw.githubusercontent.com/peterpolgar/Biblia-json-xml/main/bibles_json_dict/full_bibles/H_Kaldi_SZIT.json
    status:
      - test -f data/raw/text/H_Kaldi_SZIT.json

  text:test:
    desc: Test text fetch with sample chapter
    cmds:
      - uv run bibliavox text fetch --book GEN --chapter 1
    deps: [text:fetch]

  text:normalize:
    desc: Normalize all Bible text
    cmds:
      - uv run bibliavox text normalize --all
    deps: [text:fetch]

  text:validate:
    desc: Validate verse counts against versification schema
    cmds:
      - uv run bibliavox text validate --all
    deps: [text:fetch]

  text:convert-jsonl:
    desc: Convert SZIT JSON to JSONL format with USX codes
    cmds:
      - mkdir -p data/processed/text
      - uv run bibliavox text convert-jsonl
    status:
      - test -f data/processed/text/szit.jsonl
    deps: [text:fetch]

  text:fix-verses:
    desc: Fix embedded verse markers in JSONL
    cmds:
      - uv run bibliavox text fix-verses
    status:
      - test -f data/processed/text/szit-fixed.jsonl
    deps: [text:convert-jsonl]

  audio:download:
    desc: Download a single chapter MP3 (book/chapter required)
    cmds:
      - uv run bibliavox audio download --book {{.BOOK}} --chapter {{.CHAPTER}}{{if .FORCE}} --force{{end}}

  audio:download-all:
    desc: Download all available chapter MP3s from playlist
    cmds:
      - uv run bibliavox audio download --all --workers {{.WORKERS}}{{if .FORCE}} --force{{end}}

  audio:convert:
    desc: Convert one chapter MP3 to 16kHz mono PCM WAV (requires ffmpeg+ffprobe)
    deps: [audio:download]
    cmds:
      - uv run bibliavox audio convert --book {{.BOOK}} --chapter {{.CHAPTER}}{{if .FORCE}} --force{{end}}

  audio:convert-all:
    desc: Convert downloaded MP3 batch to WAV; idempotent unless FORCE=true (requires ffmpeg+ffprobe)
    deps: [audio:download-all]
    cmds:
      - FORCE_FLAG="{{.FORCE}}"; FORCE_ARG=""; [ "${FORCE_FLAG,,}" = "true" ] && FORCE_ARG="--force"; rc=0; for mp3 in data/raw/audio/*/*.mp3; do [ -f "$mp3" ] || continue; usx=$(basename "$(dirname "$mp3")"); chapter=$(basename "$mp3" .mp3); wav="data/prepared/audio/$usx/$chapter.wav"; if [ -f "$wav" ] && [ "${FORCE_FLAG,,}" != "true" ]; then continue; fi; uv run bibliavox audio convert --book "$usx" --chapter "$((10#$chapter))" $FORCE_ARG || rc=$?; done; exit $rc

  audio:info:
    desc: Inspect chapter audio metadata (requires ffprobe)
    deps: [audio:download]
    cmds:
      - uv run bibliavox audio info --book {{.BOOK}} --chapter {{.CHAPTER}}

  sync:
    desc: Install/sync dependencies
    cmds:
      - uv sync

  clean:
    desc: Clean generated files and caches
    cmds:
      - rm -rf data/.cache/
      - rm -rf data/reference/*.json
      - rm -rf .pytest_cache/
      - rm -rf __pycache__/ {{.PACKAGE}}/__pycache__/ tests/__pycache__/
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
