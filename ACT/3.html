    <script>
        const chapterData = {"book": {"usx_code": "ACT", "hungarian_name": "Apostolok cselekedetei", "abbreviation": "ApCsel", "book_number": 405, "chapter_count": 28}, "chapter": {"book_usx": "ACT", "chapter_num": 3, "audio_url": "https://mek.oszk.hu/08800/08820/mp3/ujtestamentum/51_apcsel/apostolok-cselekedetei-03-fejezet.mp3", "verse_count": 26, "aligned_count": 26}, "verses": [{"verse_num": 1, "start_sec": 1.997142857142857, "end_sec": 9.32, "confidence": 66.66666666666667, "canonical_text": "Péter és János a kilencórai imádság idején fölment a templomba.", "matched_text": "r és János pedig az imádság kilencedik órájában fölment a templo"}, {"verse_num": 2, "start_sec": 9.6, "end_sec": 25.30833333333333, "confidence": 64.96815286624205, "canonical_text": "Éppen akkor vittek oda egy bénán született embert, akit mindennap letettek a templom úgynevezett Ékes-kapujánál, hogy a templomba menőktől alamizsnát kérjen.", "matched_text": "Éppen akkor hoztak egy születésétől béna embert, akit minden nap oda szoktak tenni a templom ékes kapujához, hogy alamizsnát kérjen a templomba menőktől. Ő, a"}, {"verse_num": 3, "start_sec": 24.68, "end_sec": 33.79148148148148, "confidence": 53.06122448979591, "canonical_text": "Amikor meglátta Pétert és Jánost, amint épp be akartak menni a templomba, alamizsnáért könyörgött.", "matched_text": "amikor meglátta a templomba igyekvő Pétert és Jánost, Koldult, hogy alamizsnát kapjon. Péter pedig"}, {"verse_num": 4, "start_sec": 31.59166666666667, "end_sec": 39.78314814814815, "confidence": 73.13432835820896, "canonical_text": "Péter Jánossal együtt rátekintett, és így szólt hozzá: \"Nézz ránk!\"", "matched_text": "on. Péter pedig Jánossal együtt reá tekintve így szólt, néz ránk. Er"}, {"verse_num": 5, "start_sec": 37.120185185185186, "end_sec": 45.77481481481482, "confidence": 62.5, "canonical_text": "Erre rájuk emelte tekintetét, abban a reményben, hogy kap tőlük valamit.", "matched_text": "néz ránk. Erre ő odafigyelt rájuk, azt remélve, hogy kap tőlük valamit."}, {"verse_num": 6, "start_sec": 44.44333333333333, "end_sec": 60.4211111111111, "confidence": 74.07407407407408, "canonical_text": "Péter azonban ezt mondta neki: \"Aranyom, ezüstöm nincs, de amim van, neked adom: A názáreti Jézus Krisztus nevében (állj fel és) járj!\"", "matched_text": "valamit. Péter azonban mondta, ezüstöm és aranyom nincsen, de amim van, azt neked adom. A názáreti Jézus nevében. Kelj föl és járj! És"}, {"verse_num": 7, "start_sec": 60.4211111111111, "end_sec": 69.523, "confidence": 58.13953488372092, "canonical_text": "Jobb kezénél fogva fölsegítette, mire annak nyomban erő szállt a lábába és a bokájába.", "matched_text": "agadta jobb kezét, fölsegítette. És azonnal megerősödött a bokája és a lába. Kitörő örö"}, {"verse_num": 8, "start_sec": 68.41, "end_sec": 79.54, "confidence": 67.21311475409837, "canonical_text": "Egy ugrással talpon volt, és tudott járni. Velük együtt bement a templomba, járkált, ugrándozott és dicsőítette az Istent.", "matched_text": "Kitörő örömmel talpra állt és járni kezdett, és velük együtt bement a templomba. Föl és alá járkált és dicsőítette Istent."}, {"verse_num": 9, "start_sec": 81.31125, "end_sec": 86.6325, "confidence": 84.31372549019608, "canonical_text": "Az egész nép látta, hogy jár és dicsőíti az Istent.", "matched_text": "z egész nép észrevette, hogy jár és dicsőíti Istent."}, {"verse_num": 10, "start_sec": 86.6325, "end_sec": 103.627, "confidence": 54.37499999999999, "canonical_text": "Amikor ráismertek, hogy ő szokott ott ülni a templom Ékes-kapujánál alamizsnát koldulva, nem tudták, hová legyenek azon való csodálkozásukban, ami vele történt.", "matched_text": "ték ugyanis, hiszen ő volt az, aki alamizsnáért ott üldögélt a templom ékes kapujánál. Álmulattal teltek el, és magukon kívül voltak amiatt, ami vele történt. Mi"}, {"verse_num": 11, "start_sec": 105.418, "end_sec": 116.61620689655173, "confidence": 65.8119658119658, "canonical_text": "Mivel nem tágított Péter és János mellől, odagyűlt köréjük csodálkozva az egész nép az úgynevezett Salamon-csarnokba.", "matched_text": "ember nem tágított Péter és János mellől, az egész nép köréjük gyűlt nagy csodálkozással Salomon csarnokában. Amikor P"}, {"verse_num": 12, "start_sec": 114.373, "end_sec": 135.16372881355935, "confidence": 74.16267942583733, "canonical_text": "Amikor Péter ezt látta, beszédet intézett a néphez: \"Izraelita férfiak! Miért csodálkoztok ezen, miért bámultok úgy ránk, mintha a saját erőnkből vagy jámborságunk folytán értük volna el, hogy ez járni tudjon?", "matched_text": "n. Amikor Péter ezt látta, így válaszolta népnek, izraelita férfiak, miért csodálkoztok ezen? Vagy miért bámultok ránk úgy, mintha a saját erőnkkel, vagy jámborságunkkal indítottuk volna meg ezt az embert? Ábra"}, {"verse_num": 13, "start_sec": 136.511186440678, "end_sec": 152.6806779661017, "confidence": 74.09638554216868, "canonical_text": "Ábrahám, Izsák és Jákob Istene megdicsőítette a Fiát, Jézust, akit ti kiszolgáltattatok és megtagadtatok Pilátus előtt, noha ő úgy határozott, hogy szabadon bocsátja.", "matched_text": "stene és Jákob istene, atyáink istene megdicsőítette az ő fiát, Jézust, Akit ti elárultatok, és megtagadtatok Pilátus előtt, amikor ő úgy ítélkezett, hogy elbocsátja."}, {"verse_num": 14, "start_sec": 156.0493220338983, "end_sec": 164.8077966101695, "confidence": 65.4320987654321, "canonical_text": "Megtagadtátok a szentet és igazat; arra kértétek, hogy a gyilkosnak kegyelmezzen,", "matched_text": "megtagadtátok, és azt kértétek, hogy a gyilkost ajándékozzák nektek, az élet szer"}, {"verse_num": 15, "start_sec": 163.46033898305086, "end_sec": 174.24, "confidence": 89.0, "canonical_text": "az élet szerzőjét pedig megöltétek. Isten azonban feltámasztotta a halálból, ennek mi tanúi vagyunk.", "matched_text": "let szerzőjét pedig megöltétek. Isten azonban föltámasztotta őt a halálból, és mi az ő tanúi vagyunk."}, {"verse_num": 16, "start_sec": 176.87, "end_sec": 194.75, "confidence": 68.23529411764706, "canonical_text": "Mert hittel segítségül hívtuk a nevét, erőt öntött ebbe az emberbe, akit itt láttok és akit ismertek. A tőle való hit visszaadta neki épségét mindannyiótok szeme láttára.", "matched_text": "nevébe vetett hitben erősítette meg az ő neve ezt az embert, akit láttok és ismertek. És a benne való hit adta vissza neki egészségét mindannyiótok szeme láttára. És most"}, {"verse_num": 17, "start_sec": 192.53000000000003, "end_sec": 201.45, "confidence": 69.31818181818181, "canonical_text": "Tudom, testvérek, hogy csak tudatlanságból tettétek, amit tettetek, ahogy vezetőitek is.", "matched_text": "És most, testvérek, tudom, hogy tudatlanságból cselekedtetek, miként a vezetőitek is. Is"}, {"verse_num": 18, "start_sec": 200.11, "end_sec": 212.17000000000002, "confidence": 61.46788990825688, "canonical_text": "Ám az Isten így váltotta be, amit minden prófétája által hirdetett, tudniillik, hogy Krisztusa szenvedni fog.", "matched_text": "Isten azonban mindazt, Amit előre megmondott a proféták ajka által arról, hogy az ő Krisztusa szenvedni fog,"}, {"verse_num": 19, "start_sec": 214.38, "end_sec": 220.64, "confidence": 71.42857142857143, "canonical_text": "Tartsatok hát bűnbánatot, és térjetek meg bűneitek bocsánatára,", "matched_text": "Tartsatok át bűnbánatot, és térjetek meg, hogy eltöröltesse meg"}, {"verse_num": 20, "start_sec": 221.33555555555554, "end_sec": 231.07333333333332, "confidence": 67.88990825688073, "canonical_text": "hogy eljöjjön az Úr színétől a megenyhülés ideje, és elküldje az elsősorban nektek rendelt Megváltót, Jézust,", "matched_text": "hogy elérkezzék Istentől a megenyhülés ideje, és elküldje számotokra azt, aki Krisztussá rendeltetett, Jézust,"}, {"verse_num": 21, "start_sec": 231.76888888888888, "end_sec": 245.68, "confidence": 58.778625954198475, "canonical_text": "akit az égnek kell befogadnia egészen a mindenség megújulása idejéig, ahogy az Isten réges-rég megmondta szent prófétái ajka által.", "matched_text": "Az égnek kellett befogadnia addig, amíg helyre nem állítatik minden, amiről Isten beszélt, századok óta szentjei a proféták által."}, {"verse_num": 22, "start_sec": 246.64875, "end_sec": 262.6731914893617, "confidence": 59.493670886075954, "canonical_text": "Mózes ezt mondta: \"Az Úr, a mi Istenünk hozzám hasonlóan prófétát támaszt nektek testvéreitek sorából. Hallgassatok rá mindenben, amit csak mond majd nektek!\"", "matched_text": "anis megmondta, profétát támaszt majd nektek az Úr, a ti istenetek, testvéreitek közül, mint engem. Ráhallgassatok mindenben, Amit csak mondani fog nektek. Léz"}, {"verse_num": 23, "start_sec": 264.03148936170214, "end_sec": 272.8604255319149, "confidence": 71.83098591549295, "canonical_text": "\"Azokat, akik nem hallgatnak erre a prófétára, irtsátok ki a népből.\" -", "matched_text": "ket, aki nem fog hallgatni arra a profétára, ki fognak írtani a népből."}, {"verse_num": 24, "start_sec": 273.5395744680851, "end_sec": 283.0476595744681, "confidence": 52.63157894736843, "canonical_text": "A többi próféta is, Sámueltől kezdve mind, akik utána szóltak, megjövendölték ezeket a napokat.", "matched_text": "z összes proféták, Sámueltől fogva, ahányan csak beszéltek, mind a jelen napokat jövendölték. Ti"}, {"verse_num": 25, "start_sec": 281.68936170212766, "end_sec": 301.68, "confidence": 72.15909090909092, "canonical_text": "Ti vagytok a prófétáknak és annak a szövetségnek a fiai, amelyet az Isten atyátokkal kötött, amikor így szólt Ábrahámhoz: A te utódodban áldást nyer a föld minden nemzetsége. -", "matched_text": ". Ti vagytok a profétáknak, és annak a szövetségnek a fiai, Amelyet Isten atyáitoknak rendelt, amikor mondta Ábrahámnak, és a te ivadékodban áldatnak meg majd a föld összes csal"}, {"verse_num": 26, "start_sec": 300.9844444444445, "end_sec": 314.332, "confidence": 60.3448275862069, "canonical_text": "Az Isten elsősorban nektek támasztotta szolgáját, hogy megáldjon titeket, s így mindegyikőtök elforduljon a bűntől.\"", "matched_text": "Isten elsőként nektek támasztotta föl a fiád, és elküldte nektek őt, hogy megáldjon benneteket azzal, hogy mindegyik"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
