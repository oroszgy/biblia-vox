_text": "Bizony, bizony, mondom neked: arról beszélünk, amit tudunk, s arról tanúskodunk, amit láttunk, mégsem fogadjátok el tanúságtételünket.", "matched_text": "Bizony, bizony, mondom neked, amit tudunk, elmondjuk, és amit látunk, arról tanuskodunk, és tanúságunkat nem fogadjátok el. A földieket"}, {"verse_num": 12, "start_sec": 109.73147540983607, "end_sec": 119.23475409836067, "confidence": 57.009345794392516, "canonical_text": "Ha földi dolgokról beszélek, s azt sem hiszitek, hogy fogjátok hinni, ha majd a mennyei dolgokról beszélek?", "matched_text": ". A földieket mondtam nektek, és nem hiszitek. Hogyan fogjátok majd elhinni az égieket, ha elmondom nektek?"}, {"verse_num": 13, "start_sec": 119.23475409836067, "end_sec": 130.42000000000002, "confidence": 65.95744680851064, "canonical_text": "Senki sem ment föl a mennybe, csak aki alászállt a mennyből: az Emberfia (aki a mennyben van).", "matched_text": "senki sem megy föl az égbe, csak az, aki leszállott az égből, az emberfia. És miként Mózes mag"}, {"verse_num": 14, "start_sec": 128.44, "end_sec": 137.02, "confidence": 79.01234567901234, "canonical_text": "Amint Mózes fölemelte a kígyót a pusztában, úgy fogják fölemelni az Emberfiát is,", "matched_text": "ént Mózes magasba emelte a kígyót a pusztában, úgy kell fölemeltetnie az emberfián"}, {"verse_num": 15, "start_sec": 149.36260869565217, "end_sec": 155.67652173913044, "confidence": 81.03448275862068, "canonical_text": "hogy aki hisz benne, az el ne vesszen, hanem örökké éljen.", "matched_text": "aki benne hisz, el ne vesszen, hanem örökké éljen. Isten u"}, {"verse_num": 16, "start_sec": 143.34173913043477, "end_sec": 155.0882608695652, "confidence": 86.29032258064517, "canonical_text": "Mert úgy szerette Isten a világot, hogy egyszülött Fiát adta oda, hogy aki hisz benne, az el ne vesszen, hanem örökké éljen.", "matched_text": "en úgy szerette a világot, hogy egy szülött fiát adta oda, hogy mindaz, aki benne hisz, el ne vesszen, hanem örökké éljen. Is"}, {" kaphat semmit, ha az égből nem adatik neki. Ti mag"}, {"verse_num": 28, "start_sec": 272.144, "end_sec": 279.736, "confidence": 56.043956043956044, "canonical_text": "Magatok vagytok a tanúim, hogy megvallottam: Nem a Messiás vagyok, hanem csak az előfutára.", "matched_text": "magatok tanuskodtok mellettem, hogy megmondtam, nem én vagyok a Krisztus, hanem küldött vagy"}, {"verse_num": 29, "start_sec": 280.32, "end_sec": 294.336, "confidence": 68.30985915492957, "canonical_text": "A menyasszony a vőlegényé. A vőlegény barátja csak ott áll mellette, és szívből örül a vőlegény hangját hallva. Ez az örömöm most teljes lett.", "matched_text": "Akié a mennyasszony, az a vőlegény. A vőlegény barátja pedig, aki ott áll és hallgatja őt, örvendvén örül a vőlegény hangja miatt. Ezzel tehát"}, {"verse_num": 30, "start_sec": 296.67199999999997, "end_sec": 300.176, "confidence": 85.36585365853658, "canonical_text": "Neki növekednie kell, nekem kisebbednem.\"", "matched_text": "Neki növekednie kell, nekem pedig kisebbet"}, {"verse_num": 31, "start_sec": 300.176, "end_sec": 317.27396825396823, "confidence": 77.95275590551181, "canonical_text": "\"Aki felülről jön, az mindenkinek fölötte van. Aki a földről való, az földies és a földi dolgokról beszél. Aki a mennyből jött,", "matched_text": "[Noise] Aki felülről jön, az mindenek fölött van. Aki a földből való, földből van és a földről beszél. Aki az égből jön, az min"}, {"verse_num": 32, "start_sec": 319.0549206349206, "end_sec": 326.77238095238096, "confidence": 80.82191780821918, "canonical_text": "azt tanúsítja, amit látott és hallott, de tanúságát nem fogadja el senki.", "matched_text": "tanuskodik, amit látott és hallott, de a tanúságát senki sem fogadja el."}, {"verse_num": 33, "start_sec": 326.77238095238096, "end_sec": 332.11523809523806, "confidence": 72.1311475409836, "canonical_text": "Ám aki elfogadja tanúságát, bizonyítja, hogy Isten igazmondó.", "matched_text": "i elfogadja az ő tanúságát, megpecsételte, hogy Isten igazmond"}, {"verse_num": 34, "start_sec": 331.52158730158726, "end_sec": 344.24285714285713, "confidence": 58.47457627118644, "canonical_text": "Akit ugyanis az Isten küldött, az az Isten szavait közvetíti, mert hisz (Isten) nem méri szűken a Lelket, amikor adja.", "matched_text": "ndó. Akit ugyanis Isten küldött, az Isten igéjét mondja, mert nem szűk markúan adja a lelket. Az atya szereti a fiút, é"}, {"verse_num": 35, "start_sec": 341.02, "end_sec": 346.39142857142855, "confidence": 93.87755102040816, "canonical_text": "Az Atya szereti a Fiút, s mindent a kezébe adott.", "matched_text": "z atya szereti a fiút, és mindent a kezébe adott."}, {"verse_num": 36, "start_sec": 346.39142857142855, "end_sec": 358.74571428571426, "confidence": 66.38655462184873, "canonical_text": "Aki hisz a Fiúban, az örökké él. Aki azonban nem hisz a Fiúban, az nem látja meg az életet, az Isten haragja száll rá.\"", "matched_text": "hisz a fiúban, annak örök élete van. Aki pedig hitetlen a fiú iránt, az nem fogja látni az életet, hanem Isten haragja"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
