_text": "Még sok mondani valom volna, de nem tudjátok elviselni most. A"}, {"verse_num": 13, "start_sec": 100.47384615384615, "end_sec": 117.32, "confidence": 76.27118644067797, "canonical_text": "Hanem amikor eljön az Igazság Lelke, ő majd elvezet benneteket a teljes igazságra. Nem magától fog beszélni, hanem azt mondja el, amit hall, és a jövendőt fogja hirdetni nektek.", "matched_text": ". Amikor azonban eljön ő, az igazság lelke, bevezet titeket a teljes igazságba, mert nem magától fog beszélni, hanem amit hall, Azt mondja el, és a jövendőt hirdeti majd nektek."}, {"verse_num": 14, "start_sec": 117.32, "end_sec": 123.49692307692307, "confidence": 77.27272727272727, "canonical_text": "Megdicsőít engem, mert az enyémből kapja, amit majd hirdet nektek.", "matched_text": "megdicsőít engem, mert az enyémből veszi, és hirdeti nektek. Minde"}, {"verse_num": 15, "start_sec": 122.37384615384615, "end_sec": 133.4775, "confidence": 80.61224489795919, "canonical_text": "Minden, ami az Atyáé, az enyém is. Azért mondtam, hogy az enyémből kapja, amit majd hirdet nektek.", "matched_text": "k. Minden, ami az én atyámé, az enyém. Ezért mondtam, hogy az enyémből veszi, és hirdeti nektek. Eg"}, {"verse_num": 16, "start_sec": 132.94, "end_sec": 140.465, "confidence": 65.57377049180329, "canonical_text": "Rövid idő s már nem láttok, ismét rövid idő s viszontláttok.\"", "matched_text": "y kis idő, és már nem láttok engem. És ismét kis idő, és látni"}, {"verse_num": 17, "start_sec": 143.8129268292683, "end_sec": 159.84414634146341, "confidence": 52.94117647058824, "canonical_text": "A tanítványok közül néhányan elkezdtek tanakodni: \"Mit akarhat ezzel mondani: Rövid idő, s már nem láttok, ismét rövid idő, és viszontláttok? És hogy: az Atyához megyek?\"", "matched_text": "a tanítványok, mi ez, amit mond nekünk, kis idő, és nem láttok engem, és ismét kis idő, és látni fogtok engem, és elmegyek az atyához. Mondták tehát, mi ez, hogy azt mondj"}, {"verse_num": 18, "start_sec": 156.33731707 text": "Így ti is, most szomorkodtok, de én majd újra látlak titeket, és örülni fog a szívetek, és örömötöket senki sem veszi el tőletek, és azo"}, {"verse_num": 23, "start_sec": 222.986875, "end_sec": 236.38931034482758, "confidence": 74.80314960629921, "canonical_text": "Azon a napon már nem kérdeztek tőlem semmit. Bizony, bizony mondom nektek: Bármit kértek az Atyától a nevemben, megadja nektek.", "matched_text": "a napon nem fogtok tőlem kérni semmit. Bizony, bizony, mondom nektek, ha kértek majd valamit az atyától az én nevemben, megadja"}, {"verse_num": 24, "start_sec": 236.99068965517242, "end_sec": 245.41, "confidence": 95.34883720930233, "canonical_text": "Eddig nem kértetek semmit a nevemben. Kérjetek és kaptok, hogy örömötök teljes legyen.", "matched_text": "ig nem kértetek semmit az én nevemben. Kérjetek és kaptok, hogy örömötök teljes legyen."}, {"verse_num": 25, "start_sec": 245.81, "end_sec": 257.89, "confidence": 69.76744186046511, "canonical_text": "Ezeket képekben mondtam el nektek. De elérkezik az óra, amikor már nem beszélek képekben, hanem nyíltan hirdetem nektek az Atyát.", "matched_text": "Ezeket példabeszédekben mondtam nektek, de eljön az óra, amikor már nem példabeszédekben fogok szólni, hanem nyíltan beszélek az a"}, {"verse_num": 26, "start_sec": 257.91, "end_sec": 269.0871153846154, "confidence": 71.11111111111111, "canonical_text": "Azon a napon majd a nevemben kértek, s nem mondom azt nektek, hogy kérem értetek az Atyát,", "matched_text": "Azon a napon a nevemben fogtok kérni, és én nem azt mondom nektek, hogy én fogom kérni az a"}, {"verse_num": 27, "start_sec": 269.67538461538464, "end_sec": 279.67596153846154, "confidence": 74.48979591836735, "canonical_text": "mert az Atya maga is szeret titeket, mivel ti is szerettetek, és hittétek, hogy az Atyától jöttem.", "matched_text": "a az atya szeret titeket, hiszen ti szerettetek engem, és elhittétek, hogy én Istentől jöttem. Ki j"}, {"verse_num": 28, "start_sec": 278.4994230769231, "end_sec": 288.5, "confidence": 68.42105263157895, "canonical_text": "Eljöttem az Atyától, a világba jöttem, de most itthagyom a világot, és visszatérek az Atyához.\"", "matched_text": "jöttem az atyától, és eljöttem a világba. Most ismét elhagyom a világot, és az atyához megyek."}, {"verse_num": 29, "start_sec": 289.46, "end_sec": 297.1864516129032, "confidence": 56.75675675675676, "canonical_text": "Erre a tanítványok megjegyezték: \"Most már nyíltan beszélsz, nem képekben.", "matched_text": "a tanítványai, íme, most nyíltan szólsz, és semmi példázatot nem mondasz."}, {"verse_num": 30, "start_sec": 295.89870967741933, "end_sec": 309.42, "confidence": 75.91240875912408, "canonical_text": "Így világossá vált előttünk, hogy mindent tudsz, s nincs szükséged rá, hogy valaki is kérdezzen. Ezért hisszük, hogy az Istentől jöttél.\"", "matched_text": "em mondasz. Most tudjuk, hogy mindent tudsz, és nincs rá szükséged, hogy bárki kérdezzen téged. Ezért elhisszük, hogy Istentől jöttél ki."}, {"verse_num": 31, "start_sec": 309.94, "end_sec": 313.7153846153846, "confidence": 57.57575757575757, "canonical_text": "Jézus így felelt: \"Most hiszitek?", "matched_text": "t nekik Jézus, Most, hiszitek, íme"}, {"verse_num": 32, "start_sec": 314.3446153846154, "end_sec": 331.9630769230769, "confidence": 79.72972972972973, "canonical_text": "Eljön az óra, s már itt is van, amikor szétszéledtek, ki-ki megy a maga útjára, s magamra hagytok. De én nem vagyok egyedül, mert az Atya velem van.", "matched_text": "z óra, és már itt is van, hogy szétszoródjatok, ki ki a sajátjai közé, és engem magamra hagyjatok. De én nem vagyok egyedül, mert az atya velem van."}, {"verse_num": 33, "start_sec": 331.9630769230769, "end_sec": 346.02, "confidence": 72.18045112781954, "canonical_text": "Azért mondtam el ezeket nektek, hogy békességet találjatok bennem. A világban üldözést szenvedtek, de bízzatok, mert legyőztem a világot.\"", "matched_text": "t elmondtam nektek, hogy békességtek legyen bennem. A világban szorongatástok lesz, de bízzatok, én legyőztem a világot. [Music]"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
