    <script>

gy őrizd meg őket a gonosztól. Nem"}, {"verse_num": 16, "start_sec": 161.37333333333333, "end_sec": 168.998, "confidence": 84.61538461538461, "canonical_text": "Hiszen nem a világból valók, amint én sem vagyok a világból való.", "matched_text": "mert nem a világból valók, miként én sem vagyok a világból. Nem az"}, {"verse_num": 17, "start_sec": 181.51, "end_sec": 188.94909090909093, "confidence": 73.84615384615385, "canonical_text": "Szenteld meg őket az igazságban, mert hiszen a tanításod igazság.", "matched_text": "Szenteld meg őket az igazságban, a te beszéded igazság. Miként en"}, {"verse_num": 18, "start_sec": 187.71, "end_sec": 194.525, "confidence": 65.0, "canonical_text": "Amint te a világba küldtél, úgy küldöm én is őket a világba.", "matched_text": "ént engem küldtél a világba, én is elküldtem őket a világba."}, {"verse_num": 19, "start_sec": 195.14454545454547, "end_sec": 201.34, "confidence": 91.04477611940298, "canonical_text": "Értük szentelem magamat, hogy ők is szentek legyenek az igazságban.", "matched_text": "rtük szentelem magam, hogy ők is megszenteltek legyenek az igazságba"}, {"verse_num": 20, "start_sec": 202.72, "end_sec": 210.3302564102564, "confidence": 98.78048780487805, "canonical_text": "De nemcsak értük könyörgök, hanem azokért is, akik a szavukra hinni fognak bennem.", "matched_text": "De nem csak értük könyörgök, hanem azokért is, akik a szavukra hinni fognak bennem."}, {"verse_num": 21, "start_sec": 209.78666666666666, "end_sec": 223.92, "confidence": 75.49668874172185, "canonical_text": "Legyenek mindnyájan egyek. Amint te, Atyám bennem vagy s én benned, úgy legyenek ők is eggyé bennünk, hogy így elhiggye a világ, hogy te küldtél engem.", "matched_text": "nnem. Hogy minnyáján egyek legyenek, miként te atyám bennem, és én te benned, úgy ők is bennünk legyenek, és elhiggye a világ, hogy te küldöttél engem."}, {"verse_num": 22, "start_sec": 222.8328205128205, "end_sec": 233.716, "confidence": 65.65656565656566, "canonical_text": "Megosztottam velük a dicsőséget, amelyben részesítettél, hogy eggyé legyenek, amint mi egy vagyunk:", "matched_text": "él engem. A dicsőséget, amit nekem adtál, átadtam nekik, hogy egyek legyenek, mint mi egyek vagyunk."}, {"verse_num": 23, "start_sec": 233.05771428571427, "end_sec": 249.65, "confidence": 79.3103448275862, "canonical_text": "én bennük, te bennem, hogy így ők is teljesen eggyé legyenek, s megtudja a világ, hogy te küldtél engem, és szereted őket, amint engem szerettél.", "matched_text": "unk. Én bennük, te bennem, hogy egyé váljanak, és megismerje a világ, hogy te küldöttél engem, és szeretted őket, amint engem szerettél. Atyám, ak"}, {"verse_num": 24, "start_sec": 246.88171428571428, "end_sec": 265.7, "confidence": 77.38095238095238, "canonical_text": "Atyám, azt akarom, hogy akiket nekem adtál, ott legyenek velem, ahol vagyok, s lássák dicsőségemet, amelyben részesítettél, mivel már a világ teremtése előtt szerettél.", "matched_text": "Atyám, akarom, hogy akiket nekem adtál, Ott legyenek, ahol én vagyok. Hogy lássák dicsőségemet, amit nekem adtál, mert szerettél engem a világ teremtése előtt. Én igaz,"}, {"verse_num": 25, "start_sec": 265.10999999999996, "end_sec": 276.32, "confidence": 79.38144329896907, "canonical_text": "Én igazságos Atyám! A világ nem ismert meg, de én ismerlek, s ők is felismerték, hogy te küldtél.", "matched_text": "atyám, a világ nem ismert meg téged. Én azonban ismerlek, és ők is megismerték, hogy te küldtél e"}, {"verse_num": 26, "start_sec": 276.91, "end_sec": 290.48, "confidence": 81.06060606060606, "canonical_text": "Megismertettem velük nevedet, és ezután is megismertetem, hogy a szeretet, amellyel szeretsz, bennük legyen, s én is bennük legyek.\"", "matched_text": "ertettem velük a nevedet. És meg is fogom ismertetni, hogy a szeretet, amelyel engem szerettél, bennük legyen, és én is ő bennük legy"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
