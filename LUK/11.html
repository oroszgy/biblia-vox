text": "nektek. Mert mindaz, aki kér, kap, aki keres, talál, és a zörgetőnek ajtó nyílik."}, {"verse_num": 11, "start_sec": 111.05214285714285, "end_sec": 123.578, "confidence": 56.03448275862068, "canonical_text": "Közületek melyik apa ad a fiának követ, amikor az kenyeret kér? Vagy ha halat, akkor hal helyett tán kígyót ad neki?", "matched_text": "örgetőnek ajtó nyílik. Mert ha közületek valakitől, mint atyától a fia, halat kér, vajon hal helyett kigyó tad neki?"}, {"verse_num": 12, "start_sec": 122.955, "end_sec": 129.185, "confidence": 79.59183673469387, "canonical_text": "Vagy ha tojást kér, akkor talán skorpiót ad neki?", "matched_text": "? Vagy ha tojást kér, vajon skorpiót nyújt neki? H"}, {"verse_num": 13, "start_sec": 131.054, "end_sec": 146.6, "confidence": 72.6027397260274, "canonical_text": "Ha tehát ti, bár gonoszak vagytok, tudtok jót adni gyermekeiteknek, mennyivel inkább adja mennyei Atyátok a Szentlelket azoknak, akik kérik tőle.\"", "matched_text": "et rosszak vagytok, tudtok jó ajándékokat adni fiaitoknak? Mennyivel inkább adja majd az atya, amennyből a szent lelket azoknak, akik kérik tőle. ["}, {"verse_num": 14, "start_sec": 148.44, "end_sec": 160.96733333333333, "confidence": 63.24786324786324, "canonical_text": "Egy alkalommal kiűzött egy néma gonosz lelket. Amikor a gonosz lélek kiment, a néma megszólalt. A nép elcsodálkozott.", "matched_text": "kor kiűzött egy néma ördögöt, és történt, hogy amint az ördög kiment, a néma ember megszólalt. A sokaság csodálkozott."}, {"verse_num": 15, "start_sec": 159.64866666666666, "end_sec": 168.22, "confidence": 53.06122448979591, "canonical_text": "De néhányan így vélekedtek: \"Beelzebullal, a gonosz lelkek fejedelmével űzi ki a gonosz lelkeket.\"", "matched_text": "csodálkozott. Egyesek pedig közülük mondták, Belzebulla az ördögök fejedelmével űzi az ördögöket."}, {"verse_num": 16, "start_sec": 166.90133333333333, "end_sec": 173.5864406779661, "confidence": 56.666666666666664, "canonical_text": "Mások pr _sec": 228.608, "end_sec": 239.13049999999998, "confidence": 79.43925233644859, "canonical_text": "De ha egy erősebb megtámadja és legyőzi, akkor elveszi fegyverét, amiben bízott, és a zsákmányt szétosztja.", "matched_text": "a azonban egy nálánál erősebb megtámadja és legyőzi, elveszi minden fegyverét, amiben bízott, és szétosztja"}, {"verse_num": 23, "start_sec": 239.832, "end_sec": 248.25, "confidence": 91.30434782608697, "canonical_text": "Aki nincs velem, az ellenem van, és aki nem gyűjt velem, az szétszór.", "matched_text": "ányt. Aki nincs velem, ellenem van, és aki nem gyűjt velem, szétszór."}, {"verse_num": 24, "start_sec": 248.91, "end_sec": 263.16849056603775, "confidence": 87.16216216216216, "canonical_text": "Amikor a tisztátalan lélek kimegy az emberből, sivár helyeken bolyong, s nyugalmat keres. Ha nem talál, azt mondja: Visszatérek elhagyott házamba. -", "matched_text": "Amikor a tisztátalan lélek kimegy az emberből, bizetlen helyeken bolyong és nyugalmat keres. Mivel nem talál, azt mondja, visszatérek a házamba, ahon"}, {"verse_num": 25, "start_sec": 263.8166037735849, "end_sec": 267.70528301886793, "confidence": 78.0, "canonical_text": "Amikor megérkezik, kisöpörve, feldíszítve találja.", "matched_text": "Amikor visszatér, kisöpörve és feldiszítve találja."}, {"verse_num": 26, "start_sec": 269.64962264150944, "end_sec": 284.6, "confidence": 68.45637583892618, "canonical_text": "Tüstént elsiet és hív még hét más, nálánál gonoszabb lelket. Behatolnak, és ott élnek. Ennek az embernek az állapota rosszabb lesz, mint előbb volt.\"", "matched_text": "magam ellévez hét másik, magánál gonoszabb lelket, és bemenvén ott laknak. Ennek az embernek mostani állapota pedig rosszabb, mint korábban volt. [Env"}, {"verse_num": 27, "start_sec": 289.9263157894737, "end_sec": 301.3157894736842, "confidence": 62.39316239316239, "canonical_text": "Még beszélt, amikor egy asszony a tömegből felkiáltott: \"Boldog a méh, amely kihordott, és az emlő, amelyet szoptál!\"", "matched_text": "ny fölemelte szavát a sokaságból, és mondta neki, boldog a mély, amely téged hordott, és az emlő, amelyet szoptál. Err"}, {"verse_num": 28, "start_sec": 299.0378947368421, "end_sec": 310.065641025641, "confidence": 65.0, "canonical_text": "De ő ezt mondta: \"Hát még azok milyen boldogok, akik hallgatják az Isten szavát, és meg is tartják!\"", "matched_text": "emlő, amelyet szoptál. Erre ő mondta, boldogabbak, Akik hallgatják Isten igéjét, és meg is tartják. M"}, {"verse_num": 29, "start_sec": 309.46, "end_sec": 323.9953846153846, "confidence": 64.7887323943662, "canonical_text": "Amikor a nép köréje sereglett, elkezdett beszélni: \"Ez a nemzedék gonosz nemzedék. Jelt kíván, de nem kap más jelet, mint Jónás próféta jelét.", "matched_text": "Mikor pedig sokaság sereg lett köréje, kezdte mondani, ez a nemzedék, gonosz nemzedék, jelet keres, de nem adatik neki más jel, csak jónás jele"}, {"verse_num": 30, "start_sec": 324.6010256410256, "end_sec": 333.988275862069, "confidence": 82.14285714285714, "canonical_text": "Mert ahogy Jónás jel volt a niniveieknek, úgy lesz jel az Emberfia is e nemzedéknek.", "matched_text": "ént jónás, jel volt a niniveieknek, Úgy lesz jel az emberfia ennek a nemzedéknek. Dél"}, {"verse_num": 31, "start_sec": 332.47435897435895, "end_sec": 352.7, "confidence": 82.25806451612902, "canonical_text": "Dél királynője feltámad majd az ítéletkor e nemzedék tagjaival együtt, és elítéli őket. Mert eljött a föld széléről, hogy meghallgassa Salamon bölcsességét, s itt nagyobb van Salamonnál.", "matched_text": "Dél királynője, föltámad majd az ítéletkor e nemzedék fiaival együtt, és elítéli őket. Mert ő eljött a föld határáról, hogy hallja Salomon bölcsességét, és íme Salomonnál nagyobb van itt"}, {"verse_num": 32, "start_sec": 352.031724137931, "end_sec": 370.1952, "confidence": 79.87012987012987, "canonical_text": "A ninivei férfiak feltámadnak majd az ítéletkor e nemzedékkel együtt, és elítélik, mert ők bűnbánatot tartottak Jónás szavára, s itt nagyobb van Jónásnál.", "matched_text": "A ninivei férfiak fölkelnek majd az ítéleten, Ezzel a nemzedékkel együtt, és elítélik. Mert ők bűnbánatot tartottak Jónás prédikációjára, és íme Jónásnál"}, {"verse_num": 33, "start_sec": 370.1952, "end_sec": 384.5062711864407, "confidence": 54.47154471544715, "canonical_text": "Senki sem gyújt világot, hogy eltakarja vagy a véka alá rejtse. Inkább a tartóra teszi, hogy aki csak belép, lássa világát.", "matched_text": "van itt. Aki mécsest gyújt, nem rejtekbe teszi, nem is véka alá, hanem lámpatartóra, hogy akik belépnek, világosságot lássa"}, {"verse_num": 34, "start_sec": 385.83406779661016, "end_sec": 397.7842372881356, "confidence": 70.87378640776699, "canonical_text": "A tested világa a szemed. Ha szemed ép, egész tested világos. De ha a szemed rossz, egész tested sötét.", "matched_text": "ese a szemed. Ha a szemed tiszta, egész tested világos lesz. De ha zavarossá válik, tested is elsötétedi"}, {"verse_num": 35, "start_sec": 397.12033898305083, "end_sec": 403.09542372881356, "confidence": 66.07142857142857, "canonical_text": "Vigyázz hát, nehogy sötétség legyen benned a világosság.", "matched_text": "k. Vigyázz tehát, hogy a benned lévő világosság sötétségg"}, {"verse_num": 36, "start_sec": 405.75101694915253, "end_sec": 419.3776923076923, "confidence": 60.150375939849624, "canonical_text": "Ha tested csupa világosság és nincs benne semmi sötétség, olyan világos lesz egészében, mintha a villám fénye világította volna meg.\"", "matched_text": "z tested világos lesz, és egyetlen része sem lesz sötét, Akkor teljesen világos lesz, mint amikor a mécses, ragyogó fénye világít meg"}, {"verse_num": 37, "start_sec": 421.72, "end_sec": 431.27569230769234, "confidence": 51.0, "canonical_text": "Alighogy befejezte a beszédét, egy farizeus meghívta lakomára magához. El is ment, és asztalhoz ült.", "matched_text": "n ezeket mondta, kérte őt egy farizeus, hogy étkezzék nála, és bemenvén hozzá asztalhoz telepedett. A"}, {"verse_         let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
