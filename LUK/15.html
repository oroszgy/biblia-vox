ec": 160.59, "end_sec": 171.16863636363638, "confidence": 60.952380952380956, "canonical_text": "Ekkor magába szállt: Apám házában a sok napszámos bővelkedik kenyérben - mondta -, én meg éhen halok itt.", "matched_text": "Akkor magába szállt és mondta, atyámnak hány bérese dúskál kenyérben, én meg itt éhen halok. Fölkelek, aty"}, {"verse_num": 18, "start_sec": 169.3018181818182, "end_sec": 177.99333333333334, "confidence": 68.6046511627907, "canonical_text": "Útra kelek, hazamegyek apámhoz és megvallom: Apám, vétkeztem az ég ellen és teellened.", "matched_text": ". Fölkelek, atyámhoz megyek és mondom neki, atyám, vétettem az ég ellen és ellened. Arr"}, {"verse_num": 19, "start_sec": 179.04857142857142, "end_sec": 188.23000000000002, "confidence": 58.97435897435898, "canonical_text": "Arra, hogy fiadnak nevezz, már nem vagyok méltó, csak béreseid közé fogadj be.", "matched_text": "ok méltó, hogy a fiadnak nevezzenek. Fogadj be engem a béreseid közé. És fölkel"}, {"verse_num": 20, "start_sec": 184.3247619047619, "end_sec": 202.06, "confidence": 62.06896551724138, "canonical_text": "Csakugyan útra kelt és visszatért apjához. Apja már messziről meglátta és megesett rajta a szíve. Eléje sietett, a nyakába borult és megcsókolta.", "matched_text": "seid közé. És fölkelvén atyához ment. Mikor azonban még messze volt, meglátta őt atya, megszánta, elébe sietett, A nyakába borult és megcsókolta."}, {"verse_num": 21, "start_sec": 203.88521739130434, "end_sec": 215.94227272727272, "confidence": 79.46428571428572, "canonical_text": "Erre a fiú megszólalt: Apám, vétkeztem az ég ellen és teellened. Már nem vagyok méltó arra, hogy fiadnak nevezz.", "matched_text": "eki a fiú, atyám, én vétettem az ég ellen és te ellened. Arra már nem vagyok méltó, hogy a fiadnak nevezzenek. Az"}, {"verse_num": 22, "start_sec": 215.94227272727272, "end_sec": 225.86545454545455, "confidence": 62.903225806451616, "canonical_text": "Az apa odaszólt a szolgáknak: Hozzátok hamar a legdrágább ruhát és adjá  "matched_text": ". Az méltatlankodott, és nem akart bemenni. Atya tehát kijött, és kérlelni kez"}, {"verse_num": 29, "start_sec": 277.36411764705883, "end_sec": 294.71, "confidence": 57.83783783783784, "canonical_text": "De ő szemére vetette apjának: Látod, én annyi éve szolgálok neked és egyszer sem szegtem meg parancsodat. És nekem még egy gödölyét sem adtál soha, hogy egyet mulathassak a barátaimmal.", "matched_text": "dte. Erre ő, válaszolva, mondta atyának, íme, én annyi esztendeje szolgálok neked, és soha nem hágtam át a parancsaidat. De te, soha nem adtál nekem egy kecskét sem, hogy a barátaimmal l"}, {"verse_num": 30, "start_sec": 293.71230769230766, "end_sec": 302.74375, "confidence": 50.0, "canonical_text": "Most meg, hogy ez a fiad megjött, aki vagyonodat rossz nőkre pazarolta, hizlalt borjút vágattál le neki. -", "matched_text": "taimmal lakomázzam. De mikor ez a fiad, aki parázna nőkkel eltékozolta vagyonodat, megjött, levágtad neki a"}, {"verse_num": 31, "start_sec": 304.78, "end_sec": 311.7374074074074, "confidence": 79.10447761194031, "canonical_text": "Az mondta neki: Fiam, te mindig itt vagy velem, és mindenem a tied.", "matched_text": "Erre ő mondta neki, fiam, te mindig velem vagy, és mindenem a tiéd."}, {"verse_num": 32, "start_sec": 312.2725925925926, "end_sec": 326.11, "confidence": 73.26732673267327, "canonical_text": "S illett vigadnunk és örülnünk, mert ez az öcséd halott volt és életre kelt, elveszett és megkerült.\"", "matched_text": "áznunk és vigadnunk kell, mert ez a testvéred halott volt, de életre kelt. Elveszett, de megkerült. [S"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
