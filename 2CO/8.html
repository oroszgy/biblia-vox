    <script>

t": "Minden reményünket felülmúlva szinte magukat adták oda, elsősorban az Úrnak, azután Isten akaratából nekünk. E"}, {"verse_num": 6, "start_sec": 46.45333333333333, "end_sec": 55.6, "confidence": 100.0, "canonical_text": "Ezért arra kértük Tituszt, hogy amint elkezdte, fejezze is be nálatok a jótékonyság művét.", "matched_text": "Ezért arra kértük Tituszt, hogy amint elkezdte, fejezze is be nálatok a jótékonyság művét."}, {"verse_num": 7, "start_sec": 55.8, "end_sec": 72.124, "confidence": 97.38562091503267, "canonical_text": "Ti mindenben kitűntök: a hitben, a szóban, a tudásban, minden buzgólkodásban és az irántunk táplált szeretetben; tűnjetek ki tehát a jótékonykodásban is.", "matched_text": "Ti mindenben kitűntök, a hitben, a szóban, a tudásban, minden buzgolkodásban és az irántunk táplált szeretetben. Tűnjetek ki tehát a jótékonykodásban is."}, {"verse_num": 8, "start_sec": 72.866, "end_sec": 81.028, "confidence": 99.02912621359224, "canonical_text": "Nem parancsként mondom, hanem mások buzgóságára hivatkozva szeretetetek őszinteségét akarom kipróbálni.", "matched_text": "nem parancsként mondom, hanem mások buzgóságára hivatkozva szeretetetek őszinteségét akarom kipróbálni."}, {"verse_num": 9, "start_sec": 81.028, "end_sec": 93.50684210526316, "confidence": 97.79411764705883, "canonical_text": "Hiszen ismeritek Urunk, Jézus Krisztus jótékonyságát. Noha gazdag volt, értetek szegénnyé lett, hogy szegénysége által meggazdagodjatok.", "matched_text": "Hiszen ismeritek Urunk Jézus Krisztus jótékonyságát. Ő noha gazdag volt, értetek szegényé lett, hogy szegénysége által meggazdagodjatok."}, {"verse_num": 10, "start_sec": 93.50684210526316, "end_sec": 107.91, "confidence": 98.65771812080537, "canonical_text": "Erre nézve tanácsot adok nektek, mert javatokra válik. Tavaly óta nemcsak hogy megkezdtétek a gyűjtést, hanem őszinte szándékotokat is megmutattátok.", "matched_text": "Erre nézve tanácsot adok nektek, mert javatokra válik. Tavaly óta nem csak, hogy megkezdtétek a gyűjtést, hanem őszinte szándékotokat is megmutattátok"}, {"verse_num": 11, "start_sec": 107.31, "end_sec": 115.83382352941177, "confidence": 96.07843137254902, "canonical_text": "Most hát gyakorlatban is hajtsátok végre, hogy a készséges akarat tehetségetekhez mérten tetté váljon.", "matched_text": "Most hát gyakorlatban is hajtsátok végre, hogy a készséges akarat, Tehetségetekhez mérten tetté váljék"}, {"verse_num": 12, "start_sec": 115.83382352941177, "end_sec": 124.86676470588236, "confidence": 91.39784946236558, "canonical_text": "Ha az akarat készséges, aszerint tetszik (az Istennek), amije van, nem aszerint, amije nincs.", "matched_text": "a az akarat készséges, a szerint tetszik Istennek, amilye van, s nem a szerint, amilye nincs."}, {"verse_num": 13, "start_sec": 124.86676470588236, "end_sec": 133.89970588235295, "confidence": 100.0, "canonical_text": "Nem azért kell gyűjteni, hogy mások megszabaduljanak a szükségtől, ti meg bajba jussatok, hanem az egyenlőségért.", "matched_text": "Nem azért kell gyűjteni, hogy mások megszabaduljanak a szükségtől, ti meg bajba jussatok, hanem az egyenlőségért."}, {"verse_num": 14, "start_sec": 133.89970588235295, "end_sec": 146.96833333333333, "confidence": 97.2972972972973, "canonical_text": "Most az ő szükségüket a ti bőségetek enyhíti, hogy majd az ő bőségük nektek szolgáljon szükségetekben segítségül, s így (a javak) kiegyenlítődjenek.", "matched_text": "Most az ő szükségüket a ti bőséktek enyhíti, hogy majd az ő bőségük nektek szolgáljon szükségetekben, segítségül, és így a javak kiegyenlítődjenek. A"}, {"verse_num": 15, "start_sec": 145.75544117647058, "end_sec": 156.045, "confidence": 93.6842105263158, "canonical_text": "Az Írásban is az áll: \"Aki sokat gyűjtött, nem bővelkedett, aki meg keveset, nem szűkölködött.\"", "matched_text": "Az írásban is az áll, aki sokat gyűjtött, nem bővelkedett, aki meg kevesett, nem szükölködött."}, {"verse_num": 16, "start_sec": 156.045, "end_sec": 163.17666666666668, "confidence": 97.43589743589743, "canonical_text": "Hála legyen Istennek, aki Titusz szívét hasonló buzgóságra hangolta irántatok!", "matched_text": "Hála legyen Istennek, aki Titus szívét hasonló buzgóságra hangolta irántatok. E"}, {"verse_num": 17, "start_sec": 162.52833333333334, "end_sec": 169.66, "confidence": 98.93617021276596, "canonical_text": "Engedett felszólításomnak, sőt mivel buzgósága még nagyobb volt, önszántából utazott hozzátok.", "matched_text": "ngedett felszólításomnak, sőt, mivel buzgósága még nagyobb volt, önszántából utazott hozzátok."}, {"verse_num": 18, "start_sec": 169.71, "end_sec": 177.49859649122808, "confidence": 95.6043956043956, "canonical_text": "Vele küldjük azt a testvért is, akit az evangélium hirdetéséért minden egyházban dicsérnek.", "matched_text": "eleküldjük azt a két testvért is, akit az evangélium hirdetéséért minden egyházban dicsérnek"}, {"verse_num": 19, "start_sec": 177.49859649122808, "end_sec": 189.48105263157896, "confidence": 99.33774834437085, "canonical_text": "De nemcsak dicsérik, hanem az egyházak kísérőnkül is rendelték a jótékonyság megszervezésében, amelyet az Úr dicsőségére saját akaratunkból vállaltunk.", "matched_text": "De nem csak dicsérik, hanem az egyházak kísérőnkül is rendelték a jótékonyság megszervezésében, amelyet az Úr dicsőségére saját akaratunkból vállaltunk."}, {"verse_num": 20, "start_sec": 189.48105263157896, "end_sec": 196.6705263157895, "confidence": 98.86363636363636, "canonical_text": "El akartuk kerülni, hogy valaki megrágalmazzon a gondunkra bízott bőséges adomány miatt.", "matched_text": "El akartuk kerülni, hogy valaki megrágalmazzon a gondunkra bizott bőséges adomány miatt."}, {"verse_num": 21, "start_sec": 197.26964912280704, "end_sec": 203.86, "confidence": 97.22222222222221, "canonical_text": "A becsületre ugyanis vigyázunk nemcsak Isten, hanem az emberek előtt is.", "matched_text": "becsületre ugyanis vigyázunk, nem csak Isten, hanem az emberek előtt is."}, {"verse_num": 22, "start_sec": 203.86, "end_sec": 216.57, "confidence": 100.0, "canonical_text": "Velük küldtük még azt a testvérünket is, akinek buzgóságát sokféle dologban gyakran kipróbáltuk, s aki most irántatok való bizalma folytán még buzgóbb.", "matched_text": "Velük küldtük még azt a testvérünket is, akinek buzgóságát sokféle dologban gyakran kipróbáltuk, s aki most irántatok való bizalma folytán még buzgóbb."}, {"verse_num": 23, "start_sec": 216.87, "end_sec": 229.3, "confidence": 95.34883720930233, "canonical_text": "Ami Tituszt illeti, ő kísérőm, nálatok pedig munkatársam; ami a testvéreket illeti, ők az egyházak küldöttei, Krisztus dicsősége.", "matched_text": "Amit Itus illeti, ő a kísérőm, nálatok pedig munkatársam. Ami a testvéreket illeti, ők az egyházak küldöttei, Krisztus dicsősége."}, {"verse_num": 24, "start_sec": 229.62, "end_sec": 241.14, "confidence": 98.38709677419355, "canonical_text": "Tanúsítsatok szeretetet irántuk, és bizonyítsátok be az egyházak színe előtt, hogy a veletek való dicsekvésem nem alaptalan.", "matched_text": "Tanosítsatok, szeretetet irántuk, és bizonyítsátok be az egyházak színe előtt, hogy a veletek való dicsekvésem nem alaptalan."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
