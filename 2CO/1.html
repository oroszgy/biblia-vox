jd még egészen megértetek, amint részben már meg is értettetek minket, hogy Urunk Jézus napján mi vagyunk a ti büszkeségetek, s ti a mienk.", "matched_text": ". Remélem, hogy majd még egészen megértetek, amint részben már meg is értettetek minket, hogy Urunk Jézus napján mi vagyunk a ti büszkeségtek, sti a miénk."}, {"verse_num": 15, "start_sec": 184.43, "end_sec": 193.25, "confidence": 98.98989898989899, "canonical_text": "Ebben bízva készültem már korábban hozzátok, hogy másodszor is osztályrészetekül jusson a kegyelem.", "matched_text": "Ebben bízva készültem már korábban hozzátok, hogy másodszor is osztályrészetek üljusson a kegyelem."}, {"verse_num": 16, "start_sec": 193.97, "end_sec": 203.11415094339623, "confidence": 96.63865546218487, "canonical_text": "Tőletek akartam átmenni Macedóniába, s Macedóniából ismét vissza akartam térni hozzátok, hogy ti kísérjetek le Júdeába.", "matched_text": "őletek akartam átmenni Makedóniába, és Makedóniából ismét vissza akartam térni hozzátok, hogy ti kísérjetek le Judeába."}, {"verse_num": 17, "start_sec": 202.54264150943396, "end_sec": 215.68735849056603, "confidence": 98.49624060150376, "canonical_text": "Talán könnyelmű voltam, hogy ezt terveztem? Vagy nálam a tervek csupán földi szándékból születnek, és nekem az igen és a nem mindegy?", "matched_text": "Talán könnyelmű voltam, hogy ezt terveztem. Vagy nálam a tervek csupán földi szándékból születnek, és nekem az igen és a nem mindegy."}, {"verse_num": 18, "start_sec": 215.11584905660376, "end_sec": 225.13923076923078, "confidence": 96.7741935483871, "canonical_text": "Isten a tanúnk, hogy szavainkban, amelyeket hozzátok intéztünk, nem mindegy az igen és a nem.", "matched_text": "Isten a tanunk, hogy szavainkban, melyeket hozzátok intézünk, nem mindegy az igen és a nem. I"}, {"verse_num": 19, "start_sec": 223.68849056603773, "end_sec": 240.428, "confidence": 93.125, "canonical_text": "Az Isten Fia, Jézus Krisztus ugyanis, akit mi - én, Szilvánusz és Timóteus - köztetek hirdettünk, nem volt Igen is meg Nem is, hanem az Igen valósult meg benne.", "matched_text": "Isten fia, Jézus Krisztus ugyanis, akit mi, én, Szilvánusz és Timóteus köztetek hirdettünk, nem volt igen és, meg nem is, hanem az igen valósult meg benne. Iste"}, {"verse_num": 20, "start_sec": 239.7, "end_sec": 250.62, "confidence": 98.07692307692307, "canonical_text": "Isten valamennyi ígérete Igenné vált benne. Ezért hangzik föl általa ajkunkon az Amen Isten dicsőségére.", "matched_text": "Isten valamennyi ígérete igenné vált benne. Ezért hangzik föl általa ajkunkon az Amen, Isten dicsőségére."}, {"verse_num": 21, "start_sec": 250.96, "end_sec": 258.41, "confidence": 98.52941176470588, "canonical_text": "Isten az, aki minket veletek együtt megerősít és fölken Krisztusban.", "matched_text": "Isten az, aki minket veletek együtt megerősít, és fölken Krisztusban."}, {"verse_num": 22, "start_sec": 258.41, "end_sec": 265.86, "confidence": 98.66666666666667, "canonical_text": "Pecsétjével megjelölt minket, és foglalóul a szívünkbe árasztotta a Lelket.", "matched_text": "Pecsétjével megjelölt minket, és foglalóul a szívünkbe árasztotta a lelket."}, {"verse_num": 23, "start_sec": 265.115, "end_sec": 277.2225806451613, "confidence": 92.15686274509804, "canonical_text": "Istent hívom tanúul magam mellett: csak azért nem mentem el eddig Korintusba, hogy kíméljelek titeket.", "matched_text": ". Istent hívom tanunak magam mellé, csak azért nem mentem el eddig Korintusba, hogy kiméjelek titeket."}, {"verse_num": 24, "start_sec": 277.2225806451613, "end_sec": 288.66, "confidence": 99.25925925925925, "canonical_text": "Nem mintha uralkodni akarnánk rajtatok hiteteken keresztül, nem, inkább örömötökben szeretnénk közreműködni. A hitetek ugyanis szilárd.", "matched_text": "em, mintha uralkodni akarnánk rajtatok hiteteken keresztül, nem, inkább örömötökben szeretnénk közreműködni. A hitetek ugyanis szilárd."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
