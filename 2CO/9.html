    <script>

254081632653055, "end_sec": 63.88, "confidence": 97.53694581280789, "canonical_text": "Ezért tartottam szükségesnek, hogy felszólítsam a testvéreket, menjenek előre el hozzátok, és gyűjtsék össze a megígért adományt. Minden legyen készen, hogy a bő áldás, ne a szűk alamizsna képét mutassa.", "matched_text": "Ezért tartottam szükségesnek, hogy felszólítsam a testvéreket, menjenek előre hozzátok, és gyűjtsék össze a megígért adományt. Minden legyen készen, hogy a bő áldás ne a szűk alamizsnak épét mutassa. Azt"}, {"verse_num": 6, "start_sec": 62.49979591836734, "end_sec": 71.97999999999999, "confidence": 88.75, "canonical_text": "Azt mondom ugyanis: Aki szűken vet, szűken is arat; s aki bőven vet, bőven arat.", "matched_text": "Azt mondom ugyanis, aki szüken vet, szűken is arat, és aki bőven vet, az bőven i"}, {"verse_num": 7, "start_sec": 72.58, "end_sec": 83.12, "confidence": 100.0, "canonical_text": "Mindenki elhatározásának megfelelően adjon, ne kelletlenül vagy kényszerűségből, mert Isten a jókedvű adakozót szereti.", "matched_text": "Mindenki elhatározásának megfelelően adjon, ne kelletlenül vagy kényszerűségből, mert Isten a jókedvű adakozót szereti."}, {"verse_num": 8, "start_sec": 83.35, "end_sec": 96.85, "confidence": 98.01324503311258, "canonical_text": "Isten elég hatalmas ahhoz, hogy bőven megadjon nektek minden adományt, hogy mindig és minden tekintetben bőven ellátva készen legyetek minden jótettre.", "matched_text": "sten elég hatalmas ahhoz, hogy bőven megadjon nektek minden adományt, hogy mindig és minden tekintetben, bőven ellátva, készen legyetek minden jó tetre."}, {"verse_num": 9, "start_sec": 97.52714285714285, "end_sec": 106.33, "confidence": 85.0574712643678, "canonical_text": "Az Írásban ezt olvassuk: Osztogat, adakozik a szegénynek, és jósága mindvégig megmarad.", "matched_text": "ásban ezt olvassuk, osztogat, adakozik a szegényeknek, és az ő igazsága mindvégig megmar"}, {"verse_num": 10, "start_sec": 106.81, "end_sec": 117.60722222222222, "confidence": 97.6, "canonical_text": "Aki pedig magot ad a magvetőnek és kenyeret táplálékul, megsokasítja vetésteket, és megszaporítja jótékonyságotok gyümölcsét,", "matched_text": "Aki pedig magot ad a magvetőnek, és kenyeret táplálékul, Megsokasítja vetésteget, és megszaporítja jótékonyságtok gyümölcsét,"}, {"verse_num": 11, "start_sec": 117.60722222222222, "end_sec": 129.8440740740741, "confidence": 100.0, "canonical_text": "hogy mindig gazdagon teljék nektek mindenféle adakozásra. Ez a mi közvetítésünkkel másokból hálát vált ki Isten iránt.", "matched_text": "hogy mindig gazdagon teljék nektek mindenféle adakozásra. Ez a mi közvetítésünkkel másokból hálát vált ki Isten iránt."}, {"verse_num": 12, "start_sec": 129.8440740740741, "end_sec": 145.68, "confidence": 96.57534246575342, "canonical_text": "Mert, ha ebbe a szent szolgálatba bekapcsolódunk, azzal nemcsak a szentek szükségletét elégítjük ki, hanem Isten iránt is őszinte hálára indítunk.", "matched_text": "Mert ha ebbe a szent szolgálatba belekapcsolódunk, azzal nem csak a szentek szükségleteit elégítjük ki, hanem Isten iránt is őszinte hálára indítun"}, {"verse_num": 13, "start_sec": 145.68, "end_sec": 166.58, "confidence": 100.0, "canonical_text": "Ha tehát kitartotok a jótékonykodásban, Istent magasztalják érte, mivel készségesen vallomást tettetek Krisztus evangéliumáról, és bőkezűségetekkel kifejezésre juttattátok a velük és a többiekkel való közösséget.", "matched_text": "Ha tehát kitartotok a jótékonykodásban, Istent magasztalják érte, mivel készségesen vallomást tettetek Krisztus evangéliumáról, és bőkezűségetekkel kifejezésre juttattátok a velük és a többiekkel való közösséget."}, {"verse_num": 14, "start_sec": 167.02, "end_sec": 179.85904761904763, "confidence": 99.10714285714286, "canonical_text": "Imádkoznak is majd értetek, és vágyódnak utánatok abban a tudatban, hogy Isten kegyelme bőségesen kiáradt rátok.", "matched_text": "Imádkoznak is majd értetek, és vágyódnak utánatok abban a tudatban, hogy Isten kegyelme bőségesen kiárat rátok. H"}, {"verse_num": 15, "start_sec": 178.34857142857143, "end_sec": 182.88, "confidence": 97.95918367346938, "canonical_text": "Hála legyen Istennek, kimondhatatlan ajándékáért!", "matched_text": "Hála legyen Istennek, kimondhatatlan ajándékáért."}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
</body>
</html>
