eszédekben mondta nekik, hogyan űzheti ki sátán a sátánt?"}, {"verse_num": 24, "start_sec": 218.32666666666665, "end_sec": 226.08499999999998, "confidence": 76.31578947368422, "canonical_text": "Ha valamely ország meghasonlik magával, az az ország nem állhat tovább fenn.", "matched_text": "Ha egy ország meghasonlik önmagában, az az ország nem maradhat fenn. És ha e"}, {"verse_num": 25, "start_sec": 225.1, "end_sec": 231.90666666666667, "confidence": 73.4375, "canonical_text": "Ha egy ház meghasonlik magával, az a ház nem állhat fenn tovább.", "matched_text": "a egy ház megoszlik önmagán belül, az a ház nem maradhat fenn. És"}, {"verse_num": 26, "start_sec": 230.51749999999998, "end_sec": 239.65666666666667, "confidence": 65.97938144329896, "canonical_text": "Ha a sátán saját maga ellen támad, és így meghasonlik magával, nem maradhat meg, hanem elpusztul.", "matched_text": ". És ha a sátán fölkelt önmaga ellen, és megoszlott önmagában, nem maradhat fenn, hanem vége van."}, {"verse_num": 27, "start_sec": 239.14, "end_sec": 254.17875, "confidence": 62.5, "canonical_text": "Senki sem törhet be az erős ember házába, és nem rabolhatja el a holmiját, hacsak előbb meg nem kötözi az erős embert. Csak akkor rabolhatja ki a házát.", "matched_text": "n. De senki nem mehet be az erős házába, hogy vagyonát elragadja, ha csak előbb az erőset meg nem kötözi, akkor kirabolhatja a házát. Bizony mondom nekte"}, {"verse_num": 28, "start_sec": 251.85375000000002, "end_sec": 263.1466666666667, "confidence": 53.6, "canonical_text": "Bizony mondom nektek, hogy minden bűn és minden káromló szó, amit csak kiejtenek az emberek fiai a szájukon, bocsánatot nyer.", "matched_text": ". Bizony mondom nektek, az emberek fiainak összes bűne és káromlása, amelyel káromkodtak, megbocsáttatik majd. Aki azonban a S"}, {"verse_num": 29, "start_sec": 261.27833333333336, "end_sec": 269.9972222222222, "confidence": 55.81395348837209, "canonical_text": "De aki a Szentlelket káromolja, nem nyer bocsánatot mindörökké, bűne örökre megmarad.\"", "matched_text": "an a Szentlélek ellen fog káromkodni, annak soha nincs bocsánat, hanem örökre terheli a"}, {"verse_num": 30, "start_sec": 269.9972222222222, "end_sec": 277.09, "confidence": 66.03773584905662, "canonical_text": "Mert ezt mondták róla: \"Tisztátalan lélek van benne.\"", "matched_text": "n. Mivel azt mondták, tisztátalan lélek szállta meg. ["}, {"verse_num": 31, "start_sec": 278.1482608695652, "end_sec": 285.5560869565217, "confidence": 53.94736842105263, "canonical_text": "Amikor anyja és rokonai odaértek, kint maradtak, beküldtek érte és hívatták.", "matched_text": "zus anyja a testvéreivel, és odakin állva beküldtek hozzá, és hívták őt. És a"}, {"verse_num": 32, "start_sec": 287.6726086956522, "end_sec": 294.37, "confidence": 69.04761904761905, "canonical_text": "Sokan ültek körülötte, szóltak neki: \"Anyád és testvéreid kint vannak, és keresnek.\"", "matched_text": "körülötte, mondta neki, Íme anyád, testvéreid és nővéreid odakin vannak, és keresnek"}, {"verse_num": 33, "start_sec": 296.04, "end_sec": 302.72, "confidence": 82.14285714285714, "canonical_text": "Így válaszolt: \"Ki az én anyám és kik az én testvéreim?\"", "matched_text": "ekik így szólt, ki az én anyám, és kik az én testvéreim?"}, {"verse_num": 34, "start_sec": 302.16333333333336, "end_sec": 312.51, "confidence": 65.09433962264151, "canonical_text": "Aztán végighordozta tekintetét a körülötte ülőkön, s csak ennyit mondott: \"Ezek az én anyám és testvéreim!", "matched_text": "éreim? És körülhordozván tekintetét azokon, akik körülötte ültek, így szólt, íme az én anyám és testvéreim."}, {"verse_num": 35, "start_sec": 313.58, "end_sec": 327.37, "confidence": 78.87323943661973, "canonical_text": "Aki teljesíti az Isten akaratát, az az én testvérem, nővérem és anyám.\"", "matched_text": "gyanis megteszi Isten akaratát, az nekem testvérem, nővérem és anyám. [S"}]};
        
        let selectedVerses = new Set();
        let timeUpdateHandler = null;
        
        // Initialize the page
        function init() {
            renderChapter();
            setupNavigation();
        }
        
        // Render chapter content
        function renderChapter() {
            const { book, chapter, verses } = chapterData;
            
            // Update title
            document.getElementById('chapter-title').textContent = 
                `${book.hungarian_name} ${chapter.chapter_num}. fejezet`;
            
            // Audio info
            const audioStatus = document.getElementById('audio-status');
            audioStatus.textContent = `${chapter.aligned_count}/${chapter.verse_count} vershez van időbélyeg`;
            
            // Setup audio player
            const audio = document.getElementById('audio-player');
            audio.src = chapter.audio_url;
            audio.load();
            
            // Add error handler
            audio.onerror = function() {
                console.error('Audio load error:', audio.error);
                const errorDiv = document.getElementById('audio-error');
                errorDiv.textContent = 'Hiba a hangfájl betöltésekor. Ellenőrizd a hálózati kapcsolatot.';
                errorDiv.style.display = 'block';
            };
            
            // Add can play handler
            audio.oncanplay = function() {
                console.log('Audio ready to play');
                const errorDiv = document.getElementById('audio-error');
                errorDiv.style.display = 'none';
            };
            
            // Render verses
            const versesDiv = document.getElementById('verses');
            versesDiv.innerHTML = '';
            
            verses.forEach(verse => {
                const verseDiv = document.createElement('div');
                verseDiv.className = 'verse';
                
                if (verse.start_sec !== null) {
                    verseDiv.classList.add('has-timestamp');
                    verseDiv.onclick = () => toggleVerseSelection(verse.verse_num);
                }
                
                const numSpan = document.createElement('span');
                numSpan.className = 'verse-num';
                numSpan.textContent = verse.verse_num;
                verseDiv.appendChild(numSpan);
                
                const textSpan = document.createElement('span');
                textSpan.className = 'verse-text';
                textSpan.textContent = verse.canonical_text || '(szöveg nem elérhető)';
                verseDiv.appendChild(textSpan);
                
                if (verse.confidence !== null) {
                    const confSpan = document.createElement('span');
                    confSpan.className = 'verse-confidence';
                    confSpan.textContent = `${Math.round(verse.confidence)}%`;
                    confSpan.title = 'Megbízhatósági pontszám';
                    verseDiv.appendChild(confSpan);
                }
                
                if (verse.start_sec !== null) {
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'verse-time';
                    timeSpan.textContent = formatTime(verse.start_sec);
                    timeSpan.title = 'Kezdés időpontja';
                    verseDiv.appendChild(timeSpan);
                }
                
                versesDiv.appendChild(verseDiv);
            });
        }
        
        // Setup chapter navigation
        function setupNavigation() {
            const { book, chapter } = chapterData;
            
            const prevBtn = document.getElementById('prev-chapter');
            const nextBtn = document.getElementById('next-chapter');
            
            if (chapter.chapter_num > 1) {
                prevBtn.disabled = false;
                prevBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num - 1}.html`;
                };
            }
            
            if (chapter.chapter_num < book.chapter_count) {
                nextBtn.disabled = false;
                nextBtn.onclick = () => {
                    window.location.href = `${chapter.chapter_num + 1}.html`;
                };
            }
        }
        
        // Toggle verse selection
        function toggleVerseSelection(verseNum) {
            if (selectedVerses.has(verseNum)) {
                selectedVerses.delete(verseNum);
            } else {
                selectedVerses.add(verseNum);
            }
            
            updateVerseSelection();
            playSelectedVerses();
        }
        
        // Update verse selection visual
        function updateVerseSelection() {
            document.querySelectorAll('.verse').forEach(verseDiv => {
                const num = parseInt(verseDiv.querySelector('.verse-num').textContent);
                verseDiv.classList.toggle('selected', selectedVerses.has(num));
            });
        }
        
        // Play selected verses
        function playSelectedVerses() {
            if (selectedVerses.size === 0) return;
            
            const { verses } = chapterData;
            
            // Find min start and max end
            let minStart = Infinity;
            let maxEnd = 0;
            
            selectedVerses.forEach(verseNum => {
                const verse = verses.find(v => v.verse_num === verseNum);
                if (verse && verse.start_sec !== null) {
                    minStart = Math.min(minStart, verse.start_sec);
                    maxEnd = Math.max(maxEnd, verse.end_sec || verse.start_sec + 10);
                }
            });
            
            if (minStart === Infinity) return;
            
            const audio = document.getElementById('audio-player');
            const errorDiv = document.getElementById('audio-error');
            
            // Hide any previous errors
            errorDiv.style.display = 'none';
            
            // Remove previous timeupdate handler
            if (timeUpdateHandler) {
                audio.removeEventListener('timeupdate', timeUpdateHandler);
            }
            
            // Set current time and play
            audio.currentTime = minStart;
            
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.error('Audio playback failed:', error);
                    errorDiv.textContent = 'A lejátszás nem sikerült. Kattints a lejátszó gombra a kézi indításhoz.';
                    errorDiv.style.display = 'block';
                });
            }
            
            // Stop at max end
            timeUpdateHandler = () => {
                if (audio.currentTime >= maxEnd) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', timeUpdateHandler);
                    timeUpdateHandler = null;
                }
            };
            audio.addEventListener('timeupdate', timeUpdateHandler);
        }
        
        // Format time in MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Initialize on load
        init();
    </script>
