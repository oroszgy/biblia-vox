services:
  align:
    build:
      context: .
      dockerfile: docker/Dockerfile.align
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
      - ./data/.hf-cache:/root/.cache/huggingface
      - ./data/.torch-cache:/root/.cache/torch
    environment:
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vibevoice:
    build:
      context: .
      dockerfile: docker/Dockerfile.align
    working_dir: /app
    volumes:
      - .:/app
      - ./data:/app/data
      - ./data/.hf-cache:/root/.cache/huggingface
      - ./data/.torch-cache:/root/.cache/torch
    environment:
      - HF_HOME=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
